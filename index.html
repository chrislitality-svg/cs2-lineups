.eb-hint{padding:0 6px;white-space:nowrap;font-size:10px;color:var(--text-3)}
.eb-btn{padding:7px var(--sp-3);border-radius:var(--r-md);cursor:pointer;border:0;
  font-family:inherit;font-size:var(--fs-micro);font-weight:var(--fw-bold);color:#fff;
  background:linear-gradient(135deg,var(--acc-500),var(--acc-700));box-shadow:var(--sh-acc);
  transition:transform var(--t-2) var(--e-snap),box-shadow var(--t-2) var(--e-snap)}
.eb-btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(13,124,153,.38)}
.eb-sep{width:1px;height:18px;background:var(--line-strong)}

/* ══════════════════════════════════════════════════════════════════════════
   触屏与移动端 —— 重排，不是压缩
   ══════════════════════════════════════════════════════════════════════════ */
/* 手指没有 hover：关掉倾角与光晕，否则只会变成误触后的抖动 */
@media(hover:none),(pointer:coarse){
  .map-card{transform:none}
  .map-card::before,.map-card::after{display:none}
  .lcard{transform:none}
  .mc-go{display:none}
}
/* 命中区 ≥44px：只放大可点区域，不放大视觉体积 */
@media(pointer:coarse){
  .tb-btn,.tb-search,.back-btn,.icon-btn,.faction-btn,.op-add,.nu-btn,
  .pl-del,.pl-adj,.um-btn,.bk-btn,.sel-btn,.ef-input,.ef-select,
  .sp-close,.etab,.tag-chip,.op-toggle button,.op-batch button,
  .pl-batch-btns button,.prop-switch button,.up-tpl,.uf-btn{min-height:44px}
  .tf-btn{width:44px;height:44px}
  .sp-trigger{min-height:48px}
  .sel-opt,.cm-btn,.sp-row,.up-item{padding-top:12px;padding-bottom:12px}
  input[type=range]{height:44px}
  .ii-del{opacity:1;width:28px;height:28px}   /* 触屏没有 hover，删除按钮常显且加大 */
}
@media(max-width:760px){
  /* 顶栏重排：第一行只留「返回 / 图名 / 搜索」，其余控件收进第二行横滑条。
     原来 3 行 174px（吃掉 1/5 屏），现在固定 2 行约 96px，且一个控件都没砍。 */
  .top-bar{top:8px;left:8px;right:8px;padding:6px var(--sp-2);gap:6px;border-radius:var(--r-md)}
  .top-title{font-size:var(--fs-small)}
  .top-tag{font-size:10px;margin-top:1px}
  .tf-btn img{width:18px;height:18px}
  .tb-btn{padding:0 10px;font-size:var(--fs-micro)}
  .tb-scroll{display:flex;flex-basis:100%;align-items:center;gap:6px;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .tb-scroll::-webkit-scrollbar{display:none}
  .tb-scroll>*{flex:none;scroll-snap-align:start}
  /* 右栏：竖屏下改底部抽屉。58vh 是「看得见地图 + 列表够两行瓷片」的平衡点 */
  #mapCanvas,#labels3d,.map-loading{width:100vw}
  #labels3d{right:0}
  .detail-ov{top:auto;left:0;right:0;bottom:0;width:100%;height:58vh}
  .detail-sheet{border-left:0;border-top:1px solid var(--glass-line);
    border-radius:var(--r-lg) var(--r-lg) 0 0;
    box-shadow:0 -14px 44px rgba(18,28,43,.14);
    animation:drawerIn var(--t-4) var(--e-out)}
  .edit-sheet.detail-sheet{top:auto;left:0;right:0;bottom:0;width:100%;height:64vh;
    border-left:0;border-top:1px solid var(--glass-line);
    border-radius:var(--r-lg) var(--r-lg) 0 0;
    box-shadow:0 -16px 48px rgba(18,28,43,.16);
    animation:drawerIn var(--t-4) var(--e-out)}
  #panelEdgeBtn,#panelGrip{display:none}
  /* 竖屏下编辑表单单列：两列挤在 375px 里每个字段只剩 160px，标签都放不下 */
  .ef-grid{grid-template-columns:1fr}
  .ds-grid{grid-template-columns:1fr}
  /* 道具瓷片放宽到 3 列上限，信息密度跟拇指够得着取平衡 */
  .idle-list{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  /* 侧栏抽屉与道具面板：小屏改全宽底部 */
  .side-panel,.util-panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:56vh}
  .side-panel{transform:translateY(calc(100% + 16px))}
  .util-panel{transform:translateY(calc(100% + 16px))}
  .side-panel.open,.util-panel.open{transform:none}
  /* 提示条移到底部，避开顶栏 */
  .place-hint{top:auto;bottom:calc(18px + var(--safe-b));max-width:92vw;
    flex-wrap:wrap;justify-content:center}
  .sp-box{top:0;width:100vw;height:100%;border-radius:0}
  .sp-results{max-height:none;height:calc(100% - 116px)}
  .lb-nav{width:40px;height:40px}
  .lb-prev{left:8px}.lb-next{right:8px}
}
</style>
</head>
<body>

<!-- 云同步状态 -->
<div class="sync-badge" id="syncBadge" style="display:none"></div>

<!-- 加载页 -->
<div class="loading" id="loader">
  <div class="ld-logo">CS2 战术沙盘</div>
  <div class="ld-bar"><div class="ld-fill" id="ldFill" style="width:0%"></div></div>
  <div class="ld-text" id="ldStatus">系统初始化</div>
  <div id="ldRescue">
    <p class="ld-rescue-t">加载超时，请选择操作：</p>
    <button class="ld-rescue-b primary" onclick="try{localStorage.clear();}catch(e){}location.reload()">清空数据重新加载</button>
    <button class="ld-rescue-b" onclick="location.reload()">直接刷新重试</button>
    <p id="ldErrMsg"></p>
  </div>
</div>

<!-- 着陆页 -->
<div id="landing">
  <div class="land-bg"></div>
  <div class="land-content">
    <div class="land-left">
      <div class="lcard">
        <div class="land-tag">TACTICAL SANDBOX</div>
        <h1 class="land-title">CS2 战术沙盘</h1>
        <p class="land-sub">选择地图，进入三维战术沙盘，查看每个道具的投掷点、轨迹与落点效果。实战照着描点，不再忘记。</p>
        <div class="deploy-wrap">
          <button class="deploy-btn" id="deployBtn" onclick="deploy()" disabled>先选择一张地图</button>
        </div>
        <div class="backup-row">
          <button class="bk-btn" onclick="exportAll()" title="把全部数据+图片导出成一个文件">导出完整备份</button>
          <button class="bk-btn ghost" onclick="importAll()" title="在任意浏览器导入备份即可恢复">导入备份</button>
        </div>
      </div>
    </div>
    <div class="land-right">
      <div class="rhead">
        <div class="rh-l"><span class="rh-no">一</span><span class="rh-title">选择地图</span></div>
        <span class="rh-guide">点击地图选择 · 再点左侧「进入沙盘」</span>
      </div>
      <button class="sp-trigger" onclick="openSearch()" style="width:100%;margin-bottom:14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>搜全部地图的道具，一键直达</span><span class="sp-kbd" style="margin-left:auto">/</span></button>
      <div class="map-grid" id="mapGrid"></div>
      <div id="favList"></div>
    </div>
  </div>
  <div class="land-cloud" id="landCloud">本地存储 · 可导出同步</div>
</div>

<!-- 战术视图 -->
<div id="gameView">
  <canvas id="mapCanvas"></canvas>

  <div class="hud-corner hud-tl"></div><div class="hud-corner hud-tr"></div>
  <div class="hud-corner hud-bl"></div><div class="hud-corner hud-br"></div>
  <div class="scan-line"></div>
  <div class="status-bar"><div class="status-dot"></div><span id="statusText">战术视图运行中</span></div>

  <div id="labels3d" style="position:fixed;inset:0;pointer-events:none;z-index:10"></div>
  <div class="dot-tip" id="dotTip"></div>

  <!-- 顶栏 -->
  <div class="top-bar">
    <button class="back-btn" onclick="goBack()" title="返回 (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div>
      <div class="top-title" id="topTitle"></div>
      <div class="top-tag" id="topTag">战术视图</div>
    </div>
    <div style="flex:1"></div>
    <button class="tb-search" onclick="openSearch()" title="搜索道具 (/)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <!-- 桌面端 .tb-scroll 是 display:contents（等于不存在，布局与原来逐像素一致）；
         竖屏下它变成可横滑的第二行，把顶栏从 3 行 174px 压回 2 行，控件一个不少 -->
    <div class="tb-scroll">
    <div class="type-filter" id="typeFilter" role="group" aria-label="道具类型筛选">
      <button type="button" class="tf-btn active" id="tf_smoke" onclick="toggleUtilFilter('smoke')" title="烟雾弹" aria-pressed="true"><img src="imgs/icon_smoke.png?_a=4" alt="烟雾弹"></button>
      <button type="button" class="tf-btn active" id="tf_flash" onclick="toggleUtilFilter('flash')" title="闪光弹" aria-pressed="true"><img src="imgs/icon_flash.png?_a=4" alt="闪光弹"></button>
      <button type="button" class="tf-btn active" id="tf_fire" onclick="toggleUtilFilter('fire')" title="火焰" aria-pressed="true"><img src="imgs/icon_fire.png?_a=4" alt="火焰"></button>
      <button type="button" class="tf-btn active" id="tf_he" onclick="toggleUtilFilter('he')" title="高爆雷" aria-pressed="true"><img src="imgs/icon_he.png?_a=4" alt="高爆雷"></button>
    </div>
    <button class="tb-btn on" id="calloutBtn" onclick="togglePreset()" title="显示/隐藏 cs2util 报点" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6-5.7-6-10a6 6 0 0 1 12 0c0 4.3-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>报点
    </button>
    <button class="tb-btn" id="editBtn" onclick="toggleEdit()" title="编辑模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>编辑
    </button>
    <div class="faction-tog" id="styleTog" title="地图风格（雷达 / 简约标准）" style="display:none">
      <button class="faction-btn sty-on" id="styRadar" onclick="setMapStyle('radar')">雷达</button>
      <button class="faction-btn" id="styStd" onclick="setMapStyle('standard')">简约</button>
    </div>
    <div class="faction-tog" id="levelTog" style="display:none"></div>
    <div class="faction-tog" id="factionTog">
      <button class="faction-btn ct-on" id="btnCT" onclick="setFaction('CT')">CT方</button>
      <button class="faction-btn" id="btnT" onclick="setFaction('T')">T方</button>
    </div>
    </div>
  </div>

  <!-- 地图风格切换/首屏加载占位 -->
  <div class="map-loading" id="mapLoading"><div class="ml-chip"><span class="ml-spin"></span><span id="mlText">重绘地图…</span></div></div>

  <!-- 新增地名提示条 -->
  <div class="place-hint" id="placeHint">
    <span id="placeHintMsg">点地图空白处放置地名</span>
    <button id="phUndo" onclick="undoDrawPoint()" style="display:none">撤销</button>
    <button id="phDone" onclick="finishDraw()" style="display:none">完成</button>
    <button onclick="cancelHint()">取消</button>
  </div>

  <!-- 右键管理菜单 -->
  <div class="ctx-menu" id="ctxMenu"></div>

  <!-- 空数据提示 -->
  <div class="empty-3d" id="empty3d"><div class="e3-box">
    <div class="e3-title">该地图该阵营暂无道具数据</div>
    <div class="e3-sub">按 E 或点击右上角「编辑」开始添加</div>
  </div></div>

  <!-- 侧栏 -->
  <div class="side-panel" id="sidePanel">
    <div class="sp-head">
      <div class="sp-title" id="spTitle">道具清单</div>

/* 普通 script（非 module）：即使 module 解析/执行失败也能运行。
   捕获所有 JS 错误和 unhandledrejection，6 秒后若 loader 未关则显示救援 UI。 */
(function(){
  function showRescue(msg){
    var r=document.getElementById('ldRescue');
    if(r)r.style.display='block';
    if(msg){var m=document.getElementById('ldErrMsg');if(m)m.textContent=msg;}
    var s=document.getElementById('ldStatus');
    if(s&&s.textContent==='系统初始化')s.textContent='初始化出错';
  }
  window.addEventListener('error',function(e){
    showRescue((e.message||'JS Error')+' (L'+(e.lineno||'?')+')');
  },false);
  window.addEventListener('unhandledrejection',function(e){
    var msg=e.reason&&(e.reason.message||String(e.reason))||'Promise rejection';
    showRescue(msg);
  },false);
  setTimeout(function(){
    var l=document.getElementById('loader');
    if(l&&!l.classList.contains('done'))showRescue('');
  },6000);
  // SW v3 激活后会发 CS2_SW_RELOAD，让页面重新加载拿到最新 HTML（client.navigate 的降级）
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message',function(e){
      if(e.data&&e.data.type==='CS2_SW_RELOAD')location.reload();
    });
  }
})();
</script>

let undoStack=[];
/* scope=要还原的集合数组（如 ['places']）；不传=全部。保护机制：撤区域只动 places，不碰道具 */
function pushUndo(scope){

/* 在删除道具/点位前把其 IndexedDB 图片快照存进当前 undo 条目，
   使 undo 能真正恢复图片（否则数据回来了但三张图永久丢失 → "已撤销"是假成功） */
async function stashImgsForUndo(ids){
  if(!undoStack.length)return;
  const top=undoStack[undoStack.length-1];
  try{
    if(!top.imgs)top.imgs={};
    for(const id of ids){for(const slot of ['stand','aim','effect']){const k=imgKey(id,slot);if(top.imgs[k])continue;const b=await imgGet(k);if(b)top.imgs[k]=b;}}
  }catch(e){}
}
window.undoLast=function(){
  if(!undoStack.length){if(typeof flashToast==='function')flashToast('没有可撤销的操作');return;}
  const ent=undoStack.pop();let o;try{o=JSON.parse(ent.snap);}catch(e){return;}
  const sc=ent.scope;
  if(!sc||sc.includes('data'))data=o.data||[];
  if(!sc||sc.includes('spots'))spots=o.spots||[];
  if(!sc||sc.includes('spawns'))spawns=o.spawns||{};
  if(!sc||sc.includes('places'))places=o.places||{};
  if(!sc||sc.includes('walls'))walls=o.walls||{};
  /* 恢复删除时一起被清掉的图片（撤销删除才完整可用） */
  if(ent.imgs){(async()=>{let n=0;for(const k in ent.imgs){try{await imgPut(k,ent.imgs[k]);imgInvalidate(k);n++;}catch(e){}}if(n&&typeof flashToast==='function')flashToast('已撤销 · 图片已恢复');})();}
  save();saveSpots();saveSpawns();savePlaces();saveWalls();
  if(scene){clearDrawPreview();drawing=null;$('placeHint')&&$('placeHint').classList.remove('show');renderDots3D();renderPlaces();renderSpawns();renderWalls();}
  renderIdlePanel();
  if(typeof flashToast==='function')flashToast('已撤销');
};

function _saveImgDirty(){try{localStorage.setItem(IMGD_K,JSON.stringify({d:[..._imgDirty],g:[..._imgGone]}));}catch(e){}}
function imgMarkDirty(k){if(!k)return;_imgDirty.add(k);_imgGone.delete(k);_saveImgDirty();}
function imgMarkGone(k){if(!k)return;_imgGone.add(k);_imgDirty.delete(k);_saveImgDirty();}

/* ═══ 图片增量同步 ═══════════════════════════════════════════════════════
   旧版把 255 张图 base64 塞进一个 80MB 的 JSON 整包 PUT/GET：改一张图要重传
   全部，base64 还额外撑大 33%，已经顶到 nginx 对 /cs2/sync/ 的 100m 上限。
   现在服务端一图一文件，客户端先拉 ~17KB 的索引比对，只传差异，且走二进制。 */
function imgUrl(k){return SYNC_BASE+'/imgs/'+encodeURIComponent(k);}
/* 本地索引 key -> 字节数。Blob.size 是元数据、不解码内容，255 张也很快 */
function imgIndexLocal(){
  return idbOpen().then(db=>new Promise(res=>{
    const out={};
    const rq=db.transaction('imgs').objectStore('imgs').openCursor();
    rq.onsuccess=e=>{const c=e.target.result;if(!c){res(out);return;}out[c.key]=(c.value&&c.value.size)||0;c.continue();};
    rq.onerror=()=>res(out);
  })).catch(()=>({}));
}
async function syncFetchIndex(){
  try{const r=await fetch(SYNC_BASE+'/imgs/index',{cache:'no-store'});
      if(!r.ok)return null;const j=await r.json();return (j&&j.imgs)||{};}catch(e){return null;}
}
async function syncPutOne(k){
  const b=await imgGet(k);
  if(!b){_imgDirty.delete(k);return true;}   // 本地已经没有了，别再推
  const r=await fetch(imgUrl(k),{method:'PUT',
    headers:{'Content-Type':'application/octet-stream','X-Sync-At':String(_syncAt)},body:b});
  if(r.ok)_imgDirty.delete(k);
  return r.ok;
}
async function syncGetOne(k){
  const r=await fetch(imgUrl(k),{cache:'no-store'});
  if(!r.ok)return false;
  const b=await r.blob();
  _applyingRemote=true;                       // 下行写盘别再把自己标脏
  try{await imgPut(k,b);}finally{_applyingRemote=false;}
  try{imgInvalidate(k);}catch(e){}
  return true;
}
/* 推：只发脏的那几张 + 删掉的那几张 */
async function syncPushImgs(){
  if(!syncOn)return 0;
  let n=0;
  for(const k of [..._imgGone]){
    try{const r=await fetch(imgUrl(k),{method:'DELETE'});if(r.ok){_imgGone.delete(k);n++;}}catch(e){}
  }
  for(const k of [..._imgDirty]){
    try{if(await syncPutOne(k))n++;}catch(e){}
  }
  _saveImgDirty();
  return n;
}
/* 双向对齐：索引才 17KB，每次开页比一次不心疼。
   旧版那个 cs2_imgs_ok「核对过就再也不查」的兜底标记因此可以彻底删掉。 */
async function syncAlignImgs(){
  if(!syncOn)return {up:0,down:0};
  const srv=await syncFetchIndex();
  if(!srv)return {up:0,down:0};
  const loc=await imgIndexLocal();
  let down=0;
  for(const k in srv){
    if(_imgDirty.has(k)||_imgGone.has(k))continue;      // 本地有未推的改动，以本地为准
    if(loc[k]===undefined||loc[k]!==srv[k].sz){
      try{if(await syncGetOne(k))down++;}catch(e){}
    }
  }
  // 本地有、云端没有 → 待上传。但只推「还有主」的图：
  // 删道具时旧版没清理 IndexedDB，会留下一堆孤儿图；不设这道门槛的话，
  // 某台还存着老数据的设备一同步就会把已删道具的图全部复活，而且再也删不掉。
  const ownedKeys=new Set();
  for(const d of data){const im=d.imgs||{};for(const sl of ['stand','aim','effect'])if(im[sl]==='idb')ownedKeys.add(imgKey(d.id,sl));}
  for(const k in loc){ if(!(k in srv) && !_imgGone.has(k) && ownedKeys.has(k)) _imgDirty.add(k); }
  _saveImgDirty();
  const up=await syncPushImgs();
  return {up,down};
}
async function syncPush(){
  if(!syncOn)return;
  try{
    if(_metaDirty){await fetch(SYNC_BASE+'/',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({updatedAt:_syncAt,data,spots,places,spawns,walls,favs,tags:tagDefs})});_metaDirty=false;}
    await syncPushImgs();
    setSyncUI('已云同步','ok');
  }catch(e){setSyncUI('同步失败·本地已存','err');}
}
/* 关键：页面卸载（刷新/关闭/切后台）前，把还没推送的改动用 keepalive 立即发出，
   防止"刚加的道具还在 1 秒防抖里就被刷新 → 没推上去 → 重新加载被服务器旧数据覆盖" */
function syncFlush(){
  if(!syncOn||!_metaDirty)return;
  try{
    fetch(SYNC_BASE+'/',{method:'PUT',headers:{'Content-Type':'application/json'},keepalive:true,
      body:JSON.stringify({updatedAt:_syncAt,data,spots,places,spawns,walls,favs,tags:tagDefs})});
    _metaDirty=false;
  }catch(e){}
}
/* 任意浏览器随时保持最新：切回这个标签/窗口时，从云端拉一次最新数据。
   单人使用，冲突很简单——服务器更新更晚就采用它；本地有没推送的改动(_metaDirty)或正在编辑时不拉，避免覆盖。 */
let _pulling=false,_lastPull=0;
async function syncPull(){
  if(!syncOn||_pulling||_applyingRemote||_metaDirty||editTarget)return;
  if(Date.now()-_lastPull<3000)return; // 节流，避免每次聚焦都打服务器
  _lastPull=Date.now();_pulling=true;
  try{
    const meta=await (await fetch(SYNC_BASE+'/',{cache:'no-store'})).json();
    const serverAt=(meta&&+meta.updatedAt)||0;
    if(serverAt>_syncAt && meta && (meta.data||meta.places)){
      _applyingRemote=true;
      data=meta.data||[];spots=meta.spots||[];places=meta.places||{};spawns=meta.spawns||{};walls=meta.walls||{};favs=meta.favs||[];if(Array.isArray(meta.tags))tagDefs=meta.tags;
      save();saveSpots();savePlaces();saveSpawns();saveWalls();saveTags();try{localStorage.setItem(FK,JSON.stringify(favs))}catch(e){}
      try{await syncAlignImgs();}catch(e){}
      _syncAt=serverAt;try{localStorage.setItem('cs2_sync_at',String(_syncAt));}catch(e){}
      _applyingRemote=false;
      renderLanding();
      if($('gameView')&&$('gameView').classList.contains('active')){renderDots3D();renderPlaces();renderSpawns();renderWalls();renderIdlePanel();}
      setSyncUI('已从云端拉取','ok');
    }
  }catch(e){_applyingRemote=false;}
  finally{_pulling=false;}
}
window.addEventListener('pagehide',syncFlush);
window.addEventListener('focus',syncPull);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')syncFlush();else syncPull();});
async function initSync(){
  try{
    const h=await fetch(SYNC_BASE+'/health',{cache:'no-store'});
    if(!h||!h.ok)return;
    let hj=null;try{hj=await h.json();}catch(e){return;} // 静态回退返回HTML→解析失败→纯本地
    if(!hj||!hj.ok)return;
    syncOn=true;
    let meta=null;try{meta=await (await fetch(SYNC_BASE+'/',{cache:'no-store'})).json();}catch(e){}
    const serverAt=(meta&&+meta.updatedAt)||0;
    const serverHasData=!!(meta&&((meta.data&&meta.data.length)||(meta.places&&Object.keys(meta.places).length))); // 服务器是否已有真实数据
    if(serverAt>_syncAt && meta && (meta.data||meta.places)){
      _applyingRemote=true;
      data=meta.data||[];spots=meta.spots||[];places=meta.places||{};spawns=meta.spawns||{};walls=meta.walls||{};favs=meta.favs||[];if(Array.isArray(meta.tags))tagDefs=meta.tags;
      save();saveSpots();savePlaces();saveSpawns();saveWalls();saveTags();try{localStorage.setItem(FK,JSON.stringify(favs))}catch(e){}
      try{await syncAlignImgs();}catch(e){}
      _syncAt=serverAt;try{localStorage.setItem('cs2_sync_at',String(_syncAt));}catch(e){}
      _applyingRemote=false;
      renderLanding();
      if($('gameView')&&$('gameView').classList.contains('active')){renderDots3D();renderPlaces();renderSpawns();renderWalls();renderIdlePanel();}
      setSyncUI('已从云端拉取','ok');
    }else if(_syncAt>serverAt || (!serverHasData && ((data&&data.length) || Object.keys(places||{}).length || Object.keys(spawns||{}).length))){
      // 仅在「本地确实更新」或「服务器尚无数据(首次种子)」时才推送；原条件含无条件 data.length → 每次开页都全量重传(meta+~数十MB图)=同步失败/卡顿主因，已收紧
      _syncAt=Math.max(Date.now(),_syncAt+1);try{localStorage.setItem('cs2_sync_at',String(_syncAt));}catch(e){} // 种子推送用真实时间戳，别的设备才认为更新
      _metaDirty=true;
      // 首次种子：把本地所有图都标成待传，之后由 syncPushImgs 逐张推
      imgIndexLocal().then(loc=>{for(const k in loc)_imgDirty.add(k);_saveImgDirty();syncPush();});
    }else{setSyncUI('已云同步','ok');}
    // 启动时图片对齐：后台跑，不阻塞渲染。
    // 索引才 ~17KB，每次开页都比一次，所以旧版 cs2_imgs_ok 那个
    //「核对过就再也不查」的兜底标记已经不需要了（它当年是为了躲开每次下 80MB 整包）。
    (async()=>{
      if(!syncOn)return;
      try{
        const {up,down}=await syncAlignImgs();
        if(down){
          renderLanding();
          if($('gameView')&&$('gameView').classList.contains('active'))renderDots3D();
          setSyncUI('已补齐 '+down+' 张图','ok');
        }else if(up){
          setSyncUI('已上传 '+up+' 张图','ok');
        }
        try{localStorage.removeItem('cs2_imgs_ok');}catch(_e){}  // 清掉不再使用的旧标记
      }catch(e){}
    })();
  }catch(e){syncOn=false;}
  finally{_initializing=false;}
}
let _spotSeq=0;
function newSpotId(){_spotSeq++;return 'sp_'+Date.now().toString(36)+_spotSeq}
/* 把没有 spotId 的道具按 (地图,阵营,名称) 归并成点位 */
function migrateSpots(){
  const byKey={};
  data.forEach(d=>{
    if(d.spotId&&spots.some(s=>s.id===d.spotId))return;
    const key=d.map+'|'+d.side+'|'+(d.target||'未命名');
    (byKey[key]=byKey[key]||[]).push(d);
  });
  Object.keys(byKey).forEach(key=>{
    const items=byKey[key],sid=newSpotId(),d0=items[0];
    const x=items.reduce((a,d)=>a+d.mapX,0)/items.length;
    const y=items.reduce((a,d)=>a+d.mapY,0)/items.length;
    spots.push({id:sid,map:d0.map,side:d0.side,x:+x.toFixed(4),y:+y.toFixed(4),size:1.4,name:d0.target||'点位',util:d0.util});
    items.forEach(d=>d.spotId=sid);
  });
  spots=spots.filter(s=>s._manual||data.some(d=>d.spotId===s.id)); // 清理空点位（手建的保留）
}

  ['uf_','tf_'].forEach(pfx=>{const el=$(pfx+type);if(el){el.classList.toggle('active',window.activeFilters[type]);if('aria-pressed'in el)el.setAttribute('aria-pressed',window.activeFilters[type]?'true':'false');}});

};
function curSpots(){
  // 点位可见性按「点内任一道具类型是否通过筛选」判定，而非点位自身单一 util；
  // 否则共用同一点位的其它类型道具(如同点的火)会被某个类型(如烟)的筛选连带隐藏。
  return spots.filter(s=>{
    if(s.map!==curMap||s.side!==curFaction)return false;
    const th=data.filter(d=>d.spotId===s.id);
    return th.length?th.some(d=>window.activeFilters[utilCls(d.util)]):!!window.activeFilters[utilCls(s.util)];
  });
}
function spotThrows(sid){return data.filter(d=>d.spotId===sid)}

function mapItems(){return data.filter(d=>d.map===curMap)}
function utilCls(u){
  u=u||'';
  if(u.includes('烟'))return'smoke';
  if(u.includes('闪'))return'flash';
  if(u.includes('火')||u.includes('燃')||u.includes('molly')||u.includes('火焰'))return'fire';
  if(u.includes('雷')||u.includes('爆')||u.includes('HE')||u.includes('手雷'))return'he';
  return'smoke';
}
function utilColor(u){const c=utilCls(u);return c==='smoke'?0x2563eb:c==='flash'?0xca8a04:c==='he'?0xdc2626:0xea580c}
function utilColorCSS(u){const c=utilCls(u);return c==='he'?'var(--red)':'var(--'+c+')'}

/* ===== 地图加载与清理 ===== */
function disposeObj(o){
  const shared=u=>u&&u.userData&&u.userData.shared; // 共享几何/材质(如小人)不释放，避免误删别的实例
  const killMap=m=>{if(m.map&&!shared(m.map))m.map.dispose()};
  const killG=g=>{if(g&&!shared(g))g.dispose()};
  const killM=m=>{if(m){killMap(m);if(!shared(m))m.dispose()}};
  o.traverse?o.traverse(c=>{killG(c.geometry);killM(c.material)}):0;
  killG(o.geometry);killM(o.material);
}
function clearDots(){
  if(activePlay){
    [activePlay.grenade,activePlay.arc,activePlay.landFx,activePlay.man].forEach(o=>{if(o){scene.remove(o);disposeObj(o)}});
    activePlay=null;selPlayId=null;
  }
  spotMeshes.forEach(s=>{[s.mark,s.prox].forEach(o=>{if(o){scene.remove(o);disposeObj(o)}})});
  spotMeshes=[];
  fxItems.forEach(f=>{
    [f.landMark,f.man,f.landProx,f.standProx].forEach(o=>{if(o){scene.remove(o);disposeObj(o)}});
  });
  fxItems=[];hitProxies=[];hoveredHit=null;

/* 雷达图 -> 亮色矢量风贴图 + 高度场（墙体拔高成 3D 模型感） */
const TERRAIN_H=.55;     // 墙体最大高度（场景单位）
const FLOOR_H=.05;       // 可行走地面抬升
let heightGrid=null,heightN=0;

/* 离线 height.png -> heightGrid(0..1)；resolve 是否成功 */
function loadHeight(name){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const N=256;heightN=N;
      const c=document.createElement('canvas');c.width=c.height=N;
      const g=c.getContext('2d');g.drawImage(img,0,0,N,N);
      const dd=g.getImageData(0,0,N,N).data;
      const h=new Float32Array(N*N);
      for(let i=0;i<N*N;i++)h[i]=dd[i*4]/255;
      heightGrid=h;res(true);
    };
    img.onerror=()=>{heightGrid=null;heightN=0;res(false)};
    img.src='maps/'+name+'.height.png?_a='+ASSET_VER;
  });
}

/* fallback：未离线预处理的地图，运行时反色+洪泛生成贴图与高度 */
function processMap(img){
  // 1) 合成到白底，过暗则反色 -> 永远是亮色地图
  const S=1024;
  const cc=document.createElement('canvas');cc.width=cc.height=S;
  const g=cc.getContext('2d');
  g.fillStyle='#ffffff';g.fillRect(0,0,S,S);
  g.drawImage(img,0,0,S,S);
  let d=g.getImageData(0,0,S,S);
  let sum=0;
  for(let i=0;i<d.data.length;i+=4*97)sum+=(d.data[i]+d.data[i+1]+d.data[i+2])/3;
  const avg=sum/(d.data.length/(4*97));
  if(avg<118){ // 暗色雷达 -> 反色成亮色
    const a=d.data;
    for(let i=0;i<a.length;i+=4){a[i]=255-a[i];a[i+1]=255-a[i+1];a[i+2]=255-a[i+2]}
    g.putImageData(d,0,0);
    d=g.getImageData(0,0,S,S);
  }
  // 轻微提亮 + 青色调和（矢量沙盘感）
  const a=d.data;
  for(let i=0;i<a.length;i+=4){
    const l=(a[i]+a[i+1]+a[i+2])/3;
    if(l>235){a[i]=248;a[i+1]=250;a[i+2]=253}     // 高亮区 -> 纸白
    else{a[i]=Math.min(255,a[i]*.96+18);a[i+1]=Math.min(255,a[i+1]*.98+20);a[i+2]=Math.min(255,a[i+2]+24)} // 偏冷
  }
  g.putImageData(d,0,0);

  // 2) 高度场：从边缘洪泛找“地图外”，内部白=建筑(高)，灰=地面(低)
  const N=176;heightN=N;
  const hc=document.createElement('canvas');hc.width=hc.height=N;
  const hg=hc.getContext('2d');
  hg.fillStyle='#fff';hg.fillRect(0,0,N,N);
  hg.drawImage(img,0,0,N,N);
  let hd=hg.getImageData(0,0,N,N).data;
  const lum=new Float32Array(N*N);
  for(let i=0;i<N*N;i++){
    let l=(hd[i*4]+hd[i*4+1]+hd[i*4+2])/765;
    if(avg<118)l=1-l;
    lum[i]=l;
  }
  const WHITE=.92;
  const outside=new Uint8Array(N*N);
  const stack=[];
  for(let i=0;i<N;i++){stack.push(i,(N-1)*N+i,i*N,i*N+N-1)}
  while(stack.length){
    const p=stack.pop();
    if(outside[p]||lum[p]<WHITE)continue;
    outside[p]=1;
    const x=p%N,y=(p/N)|0;
    if(x>0)stack.push(p-1);
    if(x<N-1)stack.push(p+1);
    if(y>0)stack.push(p-N);
    if(y<N-1)stack.push(p+N);
  }
  let h=new Float32Array(N*N);
  for(let i=0;i<N*N;i++){
    h[i]=outside[i]?0:(lum[i]>=WHITE?1:FLOOR_H/TERRAIN_H);
  }
  // 两次box blur让墙体边缘柔和
  for(let pass=0;pass<2;pass++){
    const o=new Float32Array(N*N);
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      let s=0,c=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>=N||ny>=N)continue;
        s+=h[ny*N+nx];c++;
      }
      o[y*N+x]=s/c;
    }
    h=o;
  }
  heightGrid=h;
  const colorTex=new THREE.CanvasTexture(cc);
  colorTex.colorSpace=THREE.SRGBColorSpace;
  colorTex.anisotropy=8;
  return colorTex;
}

function getHeightAt(mx,my){
  if(!heightGrid)return 0;
  const N=heightN;
  const x=Math.min(N-1,Math.max(0,Math.round(mx*(N-1))));
  const y=Math.min(N-1,Math.max(0,Math.round(my*(N-1))));
  return heightGrid[y*N+x]*TERRAIN_H;
}

/* ============================================================
   地图纹理重绘引擎：把雷达图重绘成 Apple 地图「简约标准」浅色风
   —— 全部像素运算放进 Web Worker，主线程不卡；成品纹理 LRU 缓存
   ============================================================ */
/* Apple 浅色调色板（克制低饱和：墨蓝结构 → 暖纸地面 → 冷中性外场 + 锐利描边）
   2026-07 精修：结构色加深、过渡灰拉开、描边更锐 —— 解决大屏上「白茫茫一片」的观感 */
const APPLE={
  whiteThresh:216, outsideMix:0.80,
  outside:[228,232,240],                 // 外场（不可行走区）冷中性，向后递退，让可玩区浮现
  ramp:[                                 // 亮度 → 颜色渐变（暗=结构，亮=地面）
    {at:0.00,c:[47,59,76]},              // 墙体/结构  #2F3B4C 深墨蓝（原 #3A4858，加深一档）
    {at:0.32,c:[126,136,152]},           // 过渡冷灰（拉开与地面的明度差）
    {at:0.58,c:[204,200,190]},           // 暖浅灰
    {at:0.80,c:[236,233,226]},           // 暖纸
    {at:1.00,c:[248,246,241]}            // 纸白  #F8F6F1
  ],
  edge:[34,46,60], edgeThr:26, edgeStrength:1.45  // 描边墨色/阈值/强度（更深、更低阈、更锐）
};
/* —— 三个纯函数：既在主线程兜底直接调用，又 toString() 拼进 Worker 源码（零重复）—— */
function _rampLUT(stops){
  var lut=new Uint8Array(768),i,s;
  for(i=0;i<256;i++){
    var t=i/255,a=stops[0],b=stops[stops.length-1];
    for(s=0;s<stops.length-1;s++){if(t>=stops[s].at&&t<=stops[s+1].at){a=stops[s];b=stops[s+1];break;}}
    var span=(b.at-a.at)||1,k=(t-a.at)/span; if(k<0)k=0; if(k>1)k=1;
    lut[i*3]=a.c[0]+(b.c[0]-a.c[0])*k; lut[i*3+1]=a.c[1]+(b.c[1]-a.c[1])*k; lut[i*3+2]=a.c[2]+(b.c[2]-a.c[2])*k;
  }
  return lut;
}
function _boxBlur1(src,w,h){ // 可分离 3 抽头模糊：抹掉雷达噪点/块状，得到 Apple 那种顺滑填充
  var tmp=new Float32Array(w*h),out=new Float32Array(w*h),i,x,y;
  for(y=0;y<h;y++)for(x=0;x<w;x++){i=y*w+x;var l=x>0?src[i-1]:src[i],r=x<w-1?src[i+1]:src[i];tmp[i]=(l+src[i]+r)/3;}
  for(y=0;y<h;y++)for(x=0;x<w;x++){i=y*w+x;var u=y>0?tmp[i-w]:tmp[i],d=y<h-1?tmp[i+w]:tmp[i];out[i]=(u+tmp[i]+d)/3;}
  return out;
}
function _appleTransform(data,w,h,P){
  var n=w*h,i,lum=new Float32Array(n),o;
  for(i=0;i<n;i++){o=i*4;lum[i]=0.299*data[o]+0.587*data[o+1]+0.114*data[o+2];}
  // 2%/98.5% 百分位对比拉伸：两类源图（冷灰矢量 / cs2util 全彩）都归一到一致明度域
  var hist=new Uint32Array(256);for(i=0;i<n;i++)hist[lum[i]|0]++;
  var lo=0,hi=255,acc=0,loC=n*0.02,hiC=n*0.985,v;
  for(v=0;v<256;v++){acc+=hist[v];if(acc>=loC){lo=v;break;}}
  acc=0;for(v=0;v<256;v++){acc+=hist[v];if(acc>=hiC){hi=v;break;}}
  if(hi<=lo)hi=lo+1; var inv=1/(hi-lo);
  // 对比拉伸后的「清晰」亮度(不模糊) → 专供求边：线条锐利，且两类源图量纲一致
  var clum=new Float32Array(n);
  for(i=0;i<n;i++){var ts=(lum[i]-lo)*inv; clum[i]=(ts<0?0:ts>1?1:ts)*255;}
  // 从四边洪泛找“地图外”（亮且连到边界）→ 外场递退，聚焦可玩区
  var WH=P.whiteThresh,outside=new Uint8Array(n),st=[],x,y,p;
  for(x=0;x<w;x++){st.push(x,(h-1)*w+x);} for(y=0;y<h;y++){st.push(y*w,y*w+w-1);}
  while(st.length){p=st.pop();if(outside[p]||lum[p]<WH)continue;outside[p]=1;x=p%w;y=(p/w)|0;
    if(x>0)st.push(p-1);if(x<w-1)st.push(p+1);if(y>0)st.push(p-w);if(y<h-1)st.push(p+w);}
  var slum=_boxBlur1(lum,w,h),LUT=_rampLUT(P.ramp),OUT=P.outside,out=new Uint8ClampedArray(n*4);
  for(i=0;i<n;i++){
    var t=(slum[i]-lo)*inv; if(t<0)t=0; else if(t>1)t=1;
    var li=(t*255)|0,r=LUT[li*3],g=LUT[li*3+1],b=LUT[li*3+2];
    if(outside[i]){var k=P.outsideMix;r=OUT[0]*k+r*(1-k);g=OUT[1]*k+g*(1-k);b=OUT[2]*k+b*(1-k);}
    o=i*4;out[o]=r;out[o+1]=g;out[o+2]=b;out[o+3]=255;
  }
  // Sobel 边缘 → 叠加锐利墨线（克制路网：只描真实结构轮廓）
  // ★ 关键修复：在「未模糊」的清晰亮度 clum 上求边（之前误用模糊版 slum → 线条发虚发糊）
  var E=P.edge,thr=P.edgeThr,str=P.edgeStrength;
  for(y=1;y<h-1;y++)for(x=1;x<w-1;x++){
    i=y*w+x;
    var gx=-clum[i-w-1]-2*clum[i-1]-clum[i+w-1]+clum[i-w+1]+2*clum[i+1]+clum[i+w+1];
    var gy=-clum[i-w-1]-2*clum[i-w]-clum[i-w+1]+clum[i+w-1]+2*clum[i+w]+clum[i+w+1];
    var mag=Math.sqrt(gx*gx+gy*gy)*0.25; // /4 把 Sobel 核增益归一回 0~255 量纲
    if(mag>thr){var a=(mag-thr)/thr*str; if(a>1)a=1; o=i*4;
      out[o]=E[0]*a+out[o]*(1-a);out[o+1]=E[1]*a+out[o+1]*(1-a);out[o+2]=E[2]*a+out[o+2]*(1-a);}
  }
  return out;
}
/* —— Worker 装配（失败/不支持时回退主线程，绝不阻断功能）—— */
function getStyleWorker(){
  if(_styleWorker!==null)return _styleWorker; // false=已判定不可用
  try{
    if(typeof Worker==='undefined'||!self.URL||!URL.createObjectURL)throw 0;
    var src=_rampLUT.toString()+"\n"+_boxBlur1.toString()+"\n"+_appleTransform.toString()+"\n"+
      "self.onmessage=function(e){var d=e.data;var data=new Uint8ClampedArray(d.buf);var out=_appleTransform(data,d.w,d.h,d.P);self.postMessage({id:d.id,buf:out.buffer},[out.buffer]);};";
    var url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
    _styleWorker=new Worker(url);
    _styleWorker.onmessage=function(e){var cb=_workerJobs.get(e.data.id);if(cb){_workerJobs.delete(e.data.id);cb(e.data.buf);}};
    _styleWorker.onerror=function(){_styleWorker=false;};
  }catch(err){_styleWorker=false;}
  return _styleWorker;
}
function runStyleWorker(srcData,w,h){
  return new Promise(function(resolve){
    var wk=getStyleWorker(),settled=false;
    var done=function(buf){if(settled)return;settled=true;resolve(buf);};
    if(wk){
      var id=++_workerSeq; _workerJobs.set(id,done);
      var copy=new Uint8ClampedArray(srcData);              // 传可转移副本，原 ImageData 不失效
      wk.postMessage({id:id,buf:copy.buffer,w:w,h:h,P:APPLE},[copy.buffer]);
      setTimeout(function(){if(!settled){_workerJobs.delete(id);var c=new Uint8ClampedArray(srcData);done(_appleTransform(c,w,h,APPLE).buffer);}},4000); // 看门狗
    }else{
      var c=new Uint8ClampedArray(srcData); done(_appleTransform(c,w,h,APPLE).buffer);
    }
  });
}
/* —— 自适应纹理分辨率：按设备内存/DPR 取档，省显存又不糊 —— */
function pickTexSize(){
  var dpr=Math.min(window.devicePixelRatio||1,2),mem=navigator.deviceMemory||4;
  if(mem<=2||dpr<1.25)return 1024;
  if(mem>=8&&dpr>=2)return 2048;
  return 1536;
}
function makeTexFromCanvas(cv){
  var t=new THREE.CanvasTexture(cv);
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=(renderer&&renderer.capabilities&&renderer.capabilities.getMaxAnisotropy)?renderer.capabilities.getMaxAnisotropy():8;
  t.userData={shared:true};                 // 受缓存托管，disposeObj 不擅自释放
  return t;
}
/* 解码后的源雷达图缓存（一次网络/解码，多风格复用） */
function getSrcImg(map){
  return new Promise(function(resolve,reject){
    var c=srcImgCache.get(map); if(c){resolve(c);return;}
    var im=new Image();
    im.onload=function(){srcImgCache.set(map,im);resolve(im);};
    im.onerror=function(){reject(new Error('map 404: '+map));};
    im.src='maps/'+map+'.webp?_a='+ASSET_VER;
  });
}
function texKey(map,style){return map+'|'+style+'|'+pickTexSize();}
function texCached(map,style){return texCache.has(texKey(map,style));}
function texCacheTouch(key){var v=texCache.get(key);if(v){texCache.delete(key);texCache.set(key,v);}}
function texCachePut(key,tex){
  texCache.set(key,tex);
  while(texCache.size>TEX_CACHE_MAX){
    var oldest=texCache.keys().next().value,t=texCache.get(oldest);
    var inUse=(mapPlane&&mapPlane.material&&mapPlane.material.map===t)||(styleFade&&styleFade.plane&&styleFade.plane.material.map===t)||(styleFade&&styleFade.old&&styleFade.old.material&&styleFade.old.material.map===t);
    if(inUse){texCacheTouch(oldest);break;}      // 正在显示的别释放
    texCache.delete(oldest); if(t){t.userData={};t.dispose();}  // 释放显存
  }
}
/* 核心：取（或重建）某地图某风格的成品纹理 */
async function buildMapTexture(map,img,style){
  var key=texKey(map,style),hit=texCache.get(key);
  if(hit){texCacheTouch(key);return hit;}
  var tex;
  if(style==='standard'){
    var PROC=pickTexSize();   // 与雷达同分辨率(最高 2048)，近距/缩放时线条同样锐利
    var cv=document.createElement('canvas');cv.width=cv.height=PROC;
    var g=cv.getContext('2d',{willReadFrequently:true});
    g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(img,0,0,PROC,PROC);
    var id=g.getImageData(0,0,PROC,PROC);
    var buf=await runStyleWorker(id.data,PROC,PROC);
    g.putImageData(new ImageData(new Uint8ClampedArray(buf),PROC,PROC),0,0);
    tex=makeTexFromCanvas(cv);
  }else{
    var TEX=pickTexSize();
    var cc=document.createElement('canvas');cc.width=cc.height=TEX;
    var c2=cc.getContext('2d');c2.imageSmoothingEnabled=true;c2.imageSmoothingQuality='high';c2.drawImage(img,0,0,TEX,TEX);
    tex=makeTexFromCanvas(cc);
  }
  texCachePut(key,tex);
  return tex;
}
/* —— 平面纹理交叉淡入（保持视口中心/缩放，无跳动、无白屏）—— */
function finishStyleFade(){
  var f=styleFade; if(!f)return; styleFade=null;
  if(f.plane){f.plane.material.opacity=1;f.plane.material.transparent=false;f.plane.material.depthWrite=true;f.plane.position.y=0;f.plane.renderOrder=0;}
  if(f.old&&f.old!==f.plane){scene.remove(f.old);if(f.old.material)f.old.material.dispose();if(f.old.geometry)f.old.geometry.dispose();}
}
function swapMapTexture(tex,animate){
  if(!scene||!tex)return;
  if(styleFade)finishStyleFade();
  if(!mapPlane||!animate){
    var old=mapPlane;
    var plane=new THREE.Mesh(new THREE.PlaneGeometry(MAP_SIZE,MAP_SIZE),new THREE.MeshBasicMaterial({map:tex}));
    plane.rotation.x=-Math.PI/2; scene.add(plane); mapPlane=plane;
    if(old){scene.remove(old);if(old.material)old.material.dispose();if(old.geometry)old.geometry.dispose();}
    invalidate();return;
  }
  var planeN=new THREE.Mesh(new THREE.PlaneGeometry(MAP_SIZE,MAP_SIZE),new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0,depthWrite:false}));
  planeN.rotation.x=-Math.PI/2; planeN.position.y=0.004; planeN.renderOrder=2; scene.add(planeN);
  styleFade={plane:planeN,old:mapPlane,t0:performance.now(),dur:420};
  mapPlane=planeN; invalidate();
}

/* —— 资源缺失兜底面（替代静默白屏）—— */
function buildFallbackPlane(){
  var cv=document.createElement('canvas');cv.width=cv.height=512;var g=cv.getContext('2d');
  g.fillStyle='#eef1f5';g.fillRect(0,0,512,512);g.strokeStyle='rgba(79,70,229,.16)';g.lineWidth=2;
  for(var i=0;i<=512;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i,512);g.moveTo(0,i);g.lineTo(512,i);g.stroke();}
  g.fillStyle='#64748b';g.font='600 22px -apple-system,sans-serif';g.textAlign='center';g.fillText('地图资源缺失',256,256);
  var tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;
  var plane=new THREE.Mesh(new THREE.PlaneGeometry(MAP_SIZE,MAP_SIZE),new THREE.MeshBasicMaterial({map:tex}));

}

    var other=mapStyle==='radar'?'standard':'radar';

function loadMap3D(mapName){

    const mc=document.createElement('canvas');mc.width=mc.height=1024;

function mapCoordTo3D(mx,my){

/* ===== 文字公告牌纹理 ===== */
const _labelTexCache=new Map(); // 文字标签纹理复用：同 文字+颜色 不重复建 canvas/上传 GPU（地名+报点重渲时省开销）
function textSpriteTexture(text,color){
  const key=text+'|'+(color||'');
  const cached=_labelTexCache.get(key);
  if(cached)return cached;
  // 战术 callout 风：先粗白描边(任何底色都清晰)，再填深色字 + 轻微落影 → 干净、锐利、好认
  const fs=64,padX=42,padY=32;
  const font=`800 ${fs}px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif`;
  const c=document.createElement('canvas');
  let m=c.getContext('2d');m.font=font;
  const w=Math.ceil(m.measureText(text).width)+padX*2;
  c.width=w;c.height=fs+padY*2;
  const g=c.getContext('2d');
  g.font=font;g.textAlign='center';g.textBaseline='middle';
  const cx=c.width/2,cy=c.height/2;
  g.lineJoin='round';g.miterLimit=2;
  g.strokeStyle='rgba(255,255,255,.96)';g.lineWidth=11;
  g.strokeText(text,cx,cy);                       // 白描边
  g.shadowColor='rgba(15,23,42,.22)';g.shadowBlur=5;g.shadowOffsetY=1;
  g.fillStyle=color||'#1d2a34';
  g.fillText(text,cx,cy);                          // 深色字
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.anisotropy=8;
  tex.userData={shared:true};                     // 复用纹理，disposeObj 不释放
  const r={tex,aspect:c.width/c.height};
  _labelTexCache.set(key,r);
  return r;
}

/* ===== 地名图层 ===== */
function placeList(){return places[curMap]||(places[curMap]=[])}
/* 地名可为单点 {x,y} 或多边形 {pts:[{x,y}...]}；统一取中心点（多边形=质心） */
function isPolyPlace(p){return p&&Array.isArray(p.pts)&&p.pts.length>=3}
function placeCenter(p){
  if(!p)return null;
  if(isPolyPlace(p)){let x=0,y=0;p.pts.forEach(q=>{x+=q.x;y+=q.y});return{x:x/p.pts.length,y:y/p.pts.length}}
  if(typeof p.x==='number')return{x:p.x,y:p.y};
  return null;
}
/* 道具就近命名：返回离 (x,y) 最近的"已绘制地名 或 cs2util 标准点位"名称（都带坐标，无则空串） */
function nearestPlaceName(x,y){
  if(typeof x!=='number'||typeof y!=='number')return '';
  let best=null,bn='';
  const consider=(name,cx,cy)=>{if(!name)return;const dd=Math.hypot(cx-x,cy-y);if(best===null||dd<best){best=dd;bn=name}};
  for(const p of placeList()){ if(!p||!p.name)continue; const c=placeCenter(p); if(c)consider(p.name,c.x,c.y); }
  for(const c of (PRESET_CALLOUTS[curMap]||[])) consider(c.n,c.x,c.y);
  return bn;
}
/* "站位区域"下拉选项：已绘制区域 + cs2util 标准点位(带坐标) 一起按到投掷点距离排序，最近的预选；无坐标的兜底命名垫后 */
function posOptionsHTML(d){
  const rx=(typeof d.standX==='number')?d.standX:.5, ry=(typeof d.standY==='number')?d.standY:.5;
  const pts=[];
  placeList().forEach(p=>{if(p&&p.name){const c=placeCenter(p);pts.push({name:p.name,dist:c?Math.hypot(c.x-rx,c.y-ry):99});}});
  (PRESET_CALLOUTS[curMap]||[]).forEach(c=>pts.push({name:c.n,dist:Math.hypot(c.x-rx,c.y-ry)}));
  const byName={}; pts.forEach(p=>{if(!byName[p.name]||p.dist<byName[p.name].dist)byName[p.name]=p;});
  const list=Object.values(byName).sort((a,b)=>a.dist-b.dist);
  const names=new Set(list.map(p=>p.name));
  const cur=d.pos||(list.length?list[0].name:'')||'';
  let h='';
  if(cur&&!names.has(cur))h+=`<option value="${esc(cur)}" selected>${esc(cur)}</option>`;
  if(list.length)h+=`<optgroup label="就近排序（区域 / cs2util 点位）">`+list.map((p,i)=>`<option value="${esc(p.name)}"${p.name===cur?' selected':''}>${esc(p.name)}${i===0?' · 最近':''}</option>`).join('')+`</optgroup>`;
  if(!PRESET_CALLOUTS[curMap]){ const extra=(MAP_CALLOUTS[curMap]||[]).filter(n=>!names.has(n)); if(extra.length)h+=`<optgroup label="标准点位">`+extra.map(n=>`<option value="${esc(n)}"${n===cur?' selected':''}>${esc(n)}</option>`).join('')+`</optgroup>`; }
  if(!h)h='<option value="">先在「地名管理」画区域，或选标准点位</option>';
  return h;
}
/* 线段相交（用于空气墙约束：区域边不能跨过空气墙） */
function segInt(a,b,c,d){
  const o=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);
  const d1=o(c,d,a),d2=o(c,d,b),d3=o(a,b,c),d4=o(a,b,d);
  return ((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0));
}
/* 某条线段是否跨越任一空气墙折线 */
function crossesWall(a,b){
  for(const w of wallList()){
    const pts=w.pts||[];
    for(let i=0;i<pts.length-1;i++){if(segInt(a,b,pts[i],pts[i+1]))return true}
  }
  return false;
}

/* 多边形地名区域：填充面 + 描边 + 质心文字标签，整体作为一个 group（pickLayer 用 recursive=true 命中内部填充面） */
function buildPolyPlace(p){
  const c=placeCenter(p);
  const cw=mapCoordTo3D(c.x,c.y);
  const g=new THREE.Group();
  g.position.set(cw.x,0,cw.z);
  g.userData={placeId:p.id};
  // 填充面（ShapeGeometry 在 XY 平面，rotation.x=-PI/2 落到 XZ 地面：shape y→world -z）
  const shape=new THREE.Shape();
  p.pts.forEach((q,i)=>{
    const sx=(q.x-c.x)*MAP_SIZE, sy=-((q.y-c.y)*MAP_SIZE);
    if(i===0)shape.moveTo(sx,sy);else shape.lineTo(sx,sy);
  });
  shape.closePath();
  const bop=(p.op!=null?p.op:0.16);            // 边界（填充+描边）透明度，=0 时整条边界完全隐藏，只剩文字
  const top=(p.top!=null?p.top:0.9);           // 文字透明度，独立于边界
  // 填充面始终建（边界=0 时 opacity 0，肉眼不可见，但保留点击命中以便在 3D 里选中/编辑该区域）
  const fill=new THREE.Mesh(new THREE.ShapeGeometry(shape),
    new THREE.MeshBasicMaterial({color:0x0891b2,transparent:true,opacity:bop,side:THREE.DoubleSide,depthWrite:false}));
  fill.rotation.x=-Math.PI/2;fill.position.y=.012;fill.userData={placeId:p.id};
  g.add(fill);
  if(bop>0){
    // 描边（同坐标，作为 fill 的子节点继承旋转，略抬高）；描边比填充更实，随边界透明度联动
    const op=p.pts.map(q=>new THREE.Vector3((q.x-c.x)*MAP_SIZE,-((q.y-c.y)*MAP_SIZE),0));
    op.push(op[0].clone());
    const out=new THREE.Line(new THREE.BufferGeometry().setFromPoints(op),
      new THREE.LineBasicMaterial({color:0x0891b2,transparent:true,opacity:Math.min(.95,.35+bop*2)}));
    out.position.y=.02;fill.add(out);
  }
  // 质心文字标签（平铺地面）
  if(top>0){
    const{tex,aspect}=textSpriteTexture(p.name);
    const h=.3*(p.s||0.6);
    const lbl=new THREE.Mesh(new THREE.PlaneGeometry(h*aspect,h),
      new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:top,depthWrite:false}));
    lbl.rotation.x=-Math.PI/2;lbl.position.y=.05;lbl.renderOrder=2;lbl.raycast=()=>{};
    g.add(lbl);
    placeLabelMeshes.push(lbl); // 随主视角转向（在动画循环里更新 rotation.z）
  }
  return g;
}
function renderPlaces(){
  if(!scene)return;
  placeMeshes.forEach(m=>{scene.remove(m);disposeObj(m)});placeMeshes=[];placeLabelMeshes=[];
  placeList().forEach(p=>{
    if(isPolyPlace(p)){const g=buildPolyPlace(p);scene.add(g);placeMeshes.push(g);return;}
    const{tex,aspect}=textSpriteTexture(p.name);
    const s=p.s||1;
    const h=.3*s;
    let sp;
    const labOp=(p.top!=null?p.top:window.placeOpacity);
    if(window.placeBillboard){
      sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,opacity:labOp}));
      sp.scale.set(h*aspect,h,1);
      const v=mapCoordTo3D(p.x,p.y);
      sp.position.set(v.x,getHeightAt(p.x,p.y)+.22+h*.5,v.z);
      sp.renderOrder=2;
    }else{
      sp=new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:labOp}));
      sp.scale.set(h*aspect,h,1);
      const v=mapCoordTo3D(p.x,p.y);
      sp.position.set(v.x,getHeightAt(p.x,p.y)+.01,v.z);
      sp.rotation.x=-Math.PI/2;
      placeLabelMeshes.push(sp); // 平铺文字随主视角转向
    }
    sp.userData={placeId:p.id};
    scene.add(sp);
    placeMeshes.push(sp);
  });
  renderPlaceNodes();
  invalidate();
}
/* cs2util 标准点位：只读参考标注，独立成层（不随 renderPlaces 重建）→ 仅切地图/切显隐时重渲，编辑区域时不重复建 ~50 个 mesh */

window.togglePreset=function(){ showPreset=!showPreset; try{localStorage.setItem('cs2_callouts_off',showPreset?'':'1')}catch(e){}; renderPresetCallouts(); updatePresetBtn(); };
function updatePresetBtn(){ const b=$('calloutBtn'); if(!b)return; const has=!!(typeof PRESET_CALLOUTS!=='undefined'&&PRESET_CALLOUTS[curMap]); b.style.display=has?'':'none'; b.classList.toggle('on',showPreset); }
/* 编辑模式下，给每个多边形区域的顶点加可拖动手柄（单独调整节点） */
function renderPlaceNodes(){
  placeNodeMeshes.forEach(m=>{scene.remove(m);disposeObj(m)});placeNodeMeshes=[];
  // 画图 / 加道具(点图选点) / 正在编辑某颗道具 时都不显示区域顶点，避免一堆蓝点挡操作
  if(!scene||!editMode||drawing||placingProp||editTarget)return;
  placeList().forEach(p=>{
    if(!isPolyPlace(p))return;
    p.pts.forEach((q,i)=>{
      const v=mapCoordTo3D(q.x,q.y);
      // 贴在区域平铺面上(不用 getHeightAt 抬高)→ 不悬浮、所见即所得；视觉点小、隐形命中球大（好点不挡眼）
      const ring=new THREE.Mesh(new THREE.RingGeometry(.04,.066,22),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,transparent:true,opacity:.98,depthWrite:false,depthTest:false}));
      ring.rotation.x=-Math.PI/2;ring.position.set(v.x,.07,v.z);ring.renderOrder=6;ring.userData={placeId:p.id,vIdx:i};
      const dot=new THREE.Mesh(new THREE.CircleGeometry(.034,18),new THREE.MeshBasicMaterial({color:0x0891b2,transparent:true,side:THREE.DoubleSide,depthWrite:false,depthTest:false}));
      dot.rotation.x=-Math.PI/2;dot.position.set(v.x,.072,v.z);dot.renderOrder=7;dot.userData={placeId:p.id,vIdx:i};
      // 隐形命中球：仍较大，远视角也好点中（视觉小不代表难点）
      const grab=new THREE.Mesh(new THREE.SphereGeometry(.24,10,10),new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
      grab.position.set(v.x,.1,v.z);grab.userData={placeId:p.id,vIdx:i};
      scene.add(ring,dot,grab);placeNodeMeshes.push(ring,dot,grab);
    });
  });
}

/* ===== 空气墙图层（白色边界，不相连折线） ===== */
function renderWalls(){
  if(!scene)return;
  wallMeshes.forEach(m=>{scene.remove(m);disposeObj(m)});wallMeshes=[];
  const H=.34; // 竖墙高度，斜45°俯视下清晰可见
  wallList().forEach(w=>{
    const pts=w.pts||[];if(pts.length<2)return;
    // 竖直半透明墙面（深色，在浅色地图上一眼可见）+ 白色顶边 + 顶点白球
    const verts=[],idx=[];
    pts.forEach((q,i)=>{const v=mapCoordTo3D(q.x,q.y),y0=getHeightAt(q.x,q.y)+.02;verts.push(v.x,y0,v.z, v.x,y0+H,v.z);});
    for(let i=0;i<pts.length-1;i++){const a=i*2,b=i*2+1,c=(i+1)*2,d=(i+1)*2+1;idx.push(a,b,c, b,d,c);}
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(idx);
    const panel=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x1e293b,transparent:true,opacity:.24,side:THREE.DoubleSide,depthWrite:false}));
    panel.userData={wallId:w.id};scene.add(panel);wallMeshes.push(panel);
    const top=pts.map(q=>{const v=mapCoordTo3D(q.x,q.y);return new THREE.Vector3(v.x,getHeightAt(q.x,q.y)+.02+H,v.z)});
    const topLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(top),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.95}));
    topLine.userData={wallId:w.id};scene.add(topLine);wallMeshes.push(topLine);
    const bot=pts.map(q=>{const v=mapCoordTo3D(q.x,q.y);return new THREE.Vector3(v.x,getHeightAt(q.x,q.y)+.03,v.z)});
    const botLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(bot),new THREE.LineBasicMaterial({color:0x334155,transparent:true,opacity:.8}));
    botLine.userData={wallId:w.id};scene.add(botLine);wallMeshes.push(botLine);
    pts.forEach(q=>{
      const v=mapCoordTo3D(q.x,q.y);
      const node=new THREE.Mesh(new THREE.SphereGeometry(.032,10,8),new THREE.MeshBasicMaterial({color:0xffffff}));
      node.position.set(v.x,getHeightAt(q.x,q.y)+.04,v.z);
      const halo=new THREE.Mesh(new THREE.SphereGeometry(.045,10,8),new THREE.MeshBasicMaterial({color:0x1e293b,transparent:true,opacity:.5}));
      halo.position.copy(node.position);
      node.userData={wallId:w.id};halo.userData={wallId:w.id};
      scene.add(node);scene.add(halo);wallMeshes.push(node,halo);
    });
  });
}

function clearDrawPreview(){drawMeshes.forEach(m=>{scene.remove(m);disposeObj(m)});drawMeshes=[];}

  if(!drawing)return;

  $('placeHintMsg').textContent=(drawing.mode==='place'?'画地名区域：':'画空气墙：')+'点地图加顶点（已 '+n+' 点'+(n>=need?'，可点完成':'')+'）';
  const{undo,done}=drawHintEls();
  if(undo)undo.style.display=n>0?'':'none';
  if(done)done.style.display=n>=need?'':'none';
}

function startDraw(mode){

/* 吸附：靠近已有顶点(本段或其它空气墙)就贴上去，方便端点对齐/共享，避免“两点重合乱连线” */
function findSnapPoint(p){
  const TH=0.022;let best=null,bd=TH;
  const consider=q=>{const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=q;}};
  (drawing.pts||[]).forEach(consider);
  if(drawing.mode==='wall')wallList().forEach(w=>(w.pts||[]).forEach(consider));
  return best;
}
window.addDrawPoint=function(mx,my){
  if(!drawing)return;
  let np={x:+mx.toFixed(4),y:+my.toFixed(4)};
  const snap=findSnapPoint(np);
  if(snap)np={x:snap.x,y:snap.y};
  const last=drawing.pts[drawing.pts.length-1];
  if(last&&Math.hypot(last.x-np.x,last.y-np.y)<0.006)return; // 与上一点重合 → 忽略，不生成零长边
  if(drawing.mode==='place'&&last&&crossesWall(last,np)){warnHint('这条边越过了空气墙，换个点');return;}
  drawing.pts.push(np);
  renderDrawPreview();updateDrawHint();
};
window.undoDrawPoint=function(){if(drawing&&drawing.pts.length){drawing.pts.pop();renderDrawPreview();updateDrawHint();}};
window.finishDraw=async function(){
  if(!drawing)return;
  const mode=drawing.mode, pts=drawing.pts.slice();
  if(mode==='place'){
    if(pts.length<3){warnHint('地名区域至少 3 个顶点');return;}
    if(crossesWall(pts[pts.length-1],pts[0])){warnHint('收尾边越过了空气墙');return;}
    drawing=null;clearDrawPreview();$('placeHint').classList.remove('show');setEditSub('util');
    const name=await uiPrompt('给这个区域起个地名（如：A大 / 中路 / 匪口）','','新增地名区域');
    if(name&&name.trim()){pushUndo(['places']);placeList().push({id:'pl_'+Date.now(),name:name.trim(),pts,s:0.55,op:0.16,top:0.9});savePlaces();renderPlaceListUI&&renderPlaceListUI();}
    if(scene)renderPlaces();
  }else{
    if(pts.length<2){warnHint('空气墙至少 2 个点');return;}
    pushUndo(['walls']);wallList().push({id:'wl_'+Date.now(),pts});saveWalls();renderWalls();
    drawing=null;clearDrawPreview();$('placeHint').classList.remove('show');setEditSub('util');
    if(scene)renderPlaces();
  }
};
window.cancelDraw=function(){drawing=null;clearDrawPreview();$('placeHint').classList.remove('show');setEditSub('util');if(scene)renderPlaces();};

/* ===== 道具三段式可视化：投掷点 / 轨迹 / 落地效果 ===== */
function standOf(d){
  if(typeof d.standX==='number'&&typeof d.standY==='number')return{x:d.standX,y:d.standY};
  if(d._stand)return d._stand;
  const pl=(places[d.map]||places[curMap]||[]).find(p=>p.name===d.pos);
  const c=placeCenter(pl);
  if(c)return c;
  const z=(ZONE_DEFS[curMap]||[]).find(z=>z.id===POS_ZONE[d.pos]);
  return z?{x:z.x,y:z.y}:{x:d.mapX,y:d.mapY};
}
function landY(d){return getHeightAt(d.mapX,d.mapY)+.04+(d.mapH||0)*H_SCALE}
function standY(d){const s=standOf(d);return getHeightAt(s.x,s.y)+.04+(d.standH||0)*H_SCALE}

/* ===== 特效贴图（柔和径向渐变，质感来源） ===== */
const FXTEX={};
function radialTex(stops,size=128){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  stops.forEach(([o,col])=>gr.addColorStop(o,col));
  g.fillStyle=gr;g.fillRect(0,0,size,size);
  const tex=new THREE.CanvasTexture(c);
  tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}
function fxTextures(){
  if(FXTEX.puff)return FXTEX;
  FXTEX.puff=radialTex([[0,'rgba(255,255,255,.95)'],[.45,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,0)']]);
  FXTEX.flame=radialTex([[0,'rgba(255,244,200,1)'],[.3,'rgba(255,176,64,.95)'],[.65,'rgba(255,98,28,.55)'],[1,'rgba(255,80,20,0)']]);
  FXTEX.glow=radialTex([[0,'rgba(255,150,60,.85)'],[.5,'rgba(255,110,40,.35)'],[1,'rgba(255,100,40,0)']]);
  FXTEX.spark=radialTex([[0,'rgba(255,250,230,1)'],[.25,'rgba(255,235,160,.9)'],[1,'rgba(255,220,120,0)']]);
  Object.values(FXTEX).forEach(t=>{t.userData=t.userData||{};t.userData.shared=true});
  return FXTEX;
}
function puffSprite(tint,op){
  const t=fxTextures();
  const m=new THREE.SpriteMaterial({map:t.puff,color:tint,transparent:true,opacity:op,depthWrite:false,rotation:Math.random()*Math.PI*2});
  return new THREE.Sprite(m);
}

/* 投掷抛物线（手雷飞行与虚线轨迹共用）。
   支持中途「弹点/折点」d.via=[{x,y}...] → 分段抛物线（投掷点→弹点…→爆开点），表现弹墙/折叠；
   d.arcH = 弧线高低倍率（默认 1）。返回值统一带 .getPoint/.getPoints + .v0/.v2 供飞行/流光/手柄复用。 */
function buildThrowCurve(d){
  const s=standOf(d);
  const arcH=(d.arcH!=null?d.arcH:1);
  // 地面途经点：投掷点 → via… → 爆开点
  const wp=[{x:s.x,y:s.y,h:standY(d)+.05}];
  if(Array.isArray(d.via))d.via.forEach(v=>wp.push({x:v.x,y:v.y,h:getHeightAt(v.x,v.y)+.05}));
  wp.push({x:d.mapX,y:d.mapY,h:landY(d)+.1});
  const W=wp.map(p=>{const w=mapCoordTo3D(p.x,p.y);w.y=p.h;return w;});
  const segs=[];
  for(let i=0;i<W.length-1;i++){
    const a=W[i],b=W[i+1];
    const dist=Math.hypot(b.x-a.x,b.z-a.z);
    const peak=Math.max(a.y,b.y)+Math.max(.5,dist*.42)*arcH;
    segs.push(new THREE.QuadraticBezierCurve3(a,new THREE.Vector3((a.x+b.x)/2,peak,(a.z+b.z)/2),b));
  }
  if(segs.length===1)return segs[0]; // 单段：QuadraticBezierCurve3 自带 v0/v1/v2
  const path=new THREE.CurvePath();
  segs.forEach(sg=>path.add(sg));
  path.v0=W[0];path.v2=W[W.length-1]; // 给 playThrow/buildArc 复用的起止点
  return path;
}
function buildArc(d){
  const curve=buildThrowCurve(d);
  if(curve.v0.distanceTo(curve.v2)<.2)return null;
  const geo=new THREE.BufferGeometry().setFromPoints(curve.getPoints(44));
  const mat=new THREE.LineDashedMaterial({color:utilColor(d.util),transparent:true,opacity:.5,dashSize:.05,gapSize:.04});
  const line=new THREE.Line(geo,mat);
  line.computeLineDistances();
  arcMaterials.push(mat);
  // 流光：一颗高光沿弧线滑动（弧线/手柄都在世界原点坐标系，故 comet 直接用曲线点定位）
  const comet=new THREE.Sprite(new THREE.SpriteMaterial({map:fxTextures().spark,color:utilColor(d.util),transparent:true,opacity:.95,depthWrite:false}));
  comet.scale.set(.12,.12,1);
  line.add(comet);
  line.userData.curve=curve;line.userData.comet=comet;
  arcComets.push(line);
  return line;
}

/* 投掷小人：程序化「低多边形」3D 士兵（棱角分明 flatShading + 顶点色，CT蓝/T橙，立姿端枪，朝向 +Z）
   合并成单几何 + 共享材质 → 一个 Mesh 一次 draw call，几十个点位也不卡；几何/材质按阵营缓存。 */
const MAN_GEO={}; let _manMat=null;
function manMat(){ if(!_manMat){_manMat=new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true});_manMat.userData={shared:true};} return _manMat; }
function buildSoldierGeo(side){
  /* 设计前提：这个模型在 10 单位的地图上只有 0.21 高，屏幕上很小。
     所以做法是「先保剪影、再补细节」——用 6/8 棱柱代替薄板做四肢躯干，
     远看是圆的、近看有棱；队伍色铺成大色块而不是细条，缩到 20px 也认得出阵营。 */
  const parts=[];
  const C = side==='CT'
    ? {PRIM:0x3f72d8, DEEP:0x24427f, VEST:0x2b3f63, PANT:0x39506b, ACC:0x6f9ae8, VISOR:0x121a26}
    : {PRIM:0xe08a2a, DEEP:0x8a4d12, VEST:0x6b4a24, PANT:0x7d6a45, ACC:0xf5b25c, VISOR:0x241a12};
  const GUN=0x24282f, GUNL=0x3c434c, SKIN=0xe3b087, BOOT=0x24272c, GLOVE=0x1a1d21, STRAP=0x171a1f;

  function bake(g,color){
    const c=new THREE.Color(color),n=g.attributes.position.count,a=new Float32Array(n*3);
    for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}
    g.setAttribute('color',new THREE.BufferAttribute(a,3)); parts.push(g);
  }
  const T=g=>g.index?g.toNonIndexed():g;
  function put(g,color,x,y,z,rx,ry,rz,sx,sy,sz){
    g=T(g);
    if(sx!==undefined)g.scale(sx,sy===undefined?1:sy,sz===undefined?1:sz);
    if(rz)g.rotateZ(rz); if(rx)g.rotateX(rx); if(ry)g.rotateY(ry);
    g.translate(x,y,z); bake(g,color);
  }
  function box(w,h,d,color,x,y,z,rx,ry,rz){ put(new THREE.BoxGeometry(w,h,d),color,x,y,z,rx,ry,rz) }
  // 棱柱：radial=6 时远看是圆的、近看有明确棱面，正是低多边形要的质感
  function prism(rt,rb,h,radial,color,x,y,z,rx,ry,rz,flatZ){
    const g=new THREE.CylinderGeometry(rt,rb,h,radial);
    if(flatZ)g.scale(1,1,flatZ);            // 压扁成椭圆截面，躯干才不是圆筒
    put(g,color,x,y,z,rx,ry,rz);
  }
  function dome(r,color,x,y,z,flatY){
    const g=new THREE.SphereGeometry(r,8,4,0,Math.PI*2,0,Math.PI/2);
    if(flatY)g.scale(1,flatY,1);
    put(g,color,x,y,z);
  }
  // 两端点搭一段肢体：几何长轴严格对齐连线，关节不悬空
  function limb(r,color,p0,p1,radial){
    const dir=new THREE.Vector3(p1[0]-p0[0],p1[1]-p0[1],p1[2]-p0[2]);
    const len=dir.length(); dir.normalize();
    const g=T(new THREE.CylinderGeometry(r,r*.92,len,radial||6));
    g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dir));
    g.translate((p0[0]+p1[0])/2,(p0[1]+p1[1])/2,(p0[2]+p1[2])/2);
    bake(g,color);
  }
  function joint(r,color,p){ put(new THREE.IcosahedronGeometry(r,0),color,p[0],p[1],p[2]) }

  /* ── 下盘：左脚在前、右脚在后的射击站姿，不再是两条并排的方腿 ── */
  box(.175,.075,.30, BOOT,-.105,.038,.075);            // 左靴（前）
  box(.175,.075,.26, BOOT, .105,.038,-.045);           // 右靴（后）
  limb(.072, C.PANT, [-.105,.44,.015],[-.105,.10,.055]);   // 左小腿
  limb(.072, C.PANT, [ .105,.44,-.02],[ .105,.10,-.045]);  // 右小腿
  joint(.062, C.PRIM, [-.105,.44,.015]);                   // 左护膝（队伍色，小色点）
  joint(.062, C.PRIM, [ .105,.44,-.02]);
  limb(.083, C.PANT, [-.10,.66,-.01],[-.105,.44,.015]);    // 左大腿
  limb(.083, C.PANT, [ .10,.66,-.03],[ .105,.44,-.02]);    // 右大腿

  /* ── 躯干：一条连续的收腰锥体，而不是三块宽度不一的板 ── */
  prism(.145,.175,.16,8, C.PANT, 0,.715,-.01, 0,Math.PI/8,0, undefined,undefined,undefined, .78); // 胯
  prism(.185,.145,.20,8, C.DEEP, 0,.895,0,    0,Math.PI/8,0, undefined,undefined,undefined, .74); // 腰腹→胸（收腰）
  prism(.205,.19,.20,8,  C.PRIM, 0,1.06,.005, 0,Math.PI/8,0, undefined,undefined,undefined, .72); // 战术背心（队伍色主色块）
  box(.30,.055,.035, C.DEEP, 0,1.05,.145);              // 胸前弹匣条
  box(.055,.19,.035, STRAP, -.115,1.06,.14, 0,0,.18);   // 背带
  prism(.235,.215,.085,8, C.DEEP, 0,1.185,.005, 0,Math.PI/8,0, undefined,undefined,undefined, .76); // 肩线

  /* ── 头 ── */
  box(.10,.075,.10, SKIN, 0,1.245,.01);                 // 颈
  prism(.098,.105,.155,8, SKIN, 0,1.36,.015);           // 头（八棱柱，比方块像脑袋）
  dome(.118, C.DEEP, 0,1.415,.012, .85);                // 头盔顶
  box(.225,.032,.215, C.DEEP, 0,1.418,.012);            // 盔沿
  box(.155,.05,.045, C.VISOR, 0,1.372,.115);            // 护目镜
  box(.10,.055,.05, side==='CT'?0x2b3340:0x3a2c1c, 0,1.30,.10); // 面罩

  /* ── 枪：先定枪的位置，再把手接到枪上（不是手拿枪，是枪定位手）──
       朝向 +Z，枪身略向下前压，符合端枪前进的姿态 */
  const GY=1.045, GZ=.30;
  box(.062,.10,.115, GUN,  .055,GY+.012,GZ-.20);        // 枪托
  box(.052,.055,.075,GUN,  .055,GY-.03, GZ-.10);        // 托腮板
  box(.105,.125,.20, GUN,  .055,GY,     GZ);            // 机匣
  box(.05,.062,.10,  GUN,  .055,GY+.088,GZ+.01);        // 瞄具座
  box(.03,.038,.13,  GUNL, .055,GY+.125,GZ+.01);        // 瞄具筒
  box(.05,.115,.05,  GUN,  .055,GY-.10, GZ-.045);       // 手枪握把
  box(.068,.175,.10, GUN,  .055,GY-.115,GZ+.055, .18);  // 弹匣（微前倾）
  prism(.045,.045,.30,6, GUNL, .055,GY-.005,GZ+.245, Math.PI/2); // 护木
  prism(.021,.021,.13,6, GUN,  .055,GY-.005,GZ+.455, Math.PI/2); // 枪管
  prism(.032,.028,.055,6,GUN,  .055,GY-.005,GZ+.53,  Math.PI/2); // 枪口制退器
  box(.032,.075,.038, GUN,  .05, GY-.075,GZ+.20);       // 竖直前握把

  /* ── 手臂接到枪上 ── */
  const RH=[.055,GY-.055,GZ-.04], LH=[.05,GY-.075,GZ+.205];
  limb(.062, C.PRIM, [.185,1.175,-.01],[.115,1.02,.10]);  // 右上臂
  joint(.055, C.DEEP, [.115,1.02,.10]);                    // 右肘
  limb(.052, C.PRIM, [.115,1.02,.10],RH);                  // 右前臂 → 扳机手
  joint(.048, GLOVE, RH);
  limb(.062, C.PRIM, [-.185,1.175,-.01],[-.115,1.00,.16]); // 左上臂
  joint(.055, C.DEEP, [-.115,1.00,.16]);                   // 左肘
  limb(.052, C.PRIM, [-.115,1.00,.16],LH);                 // 左前臂 → 前握把
  joint(.048, GLOVE, LH);

  const m=BufferGeometryUtils.mergeGeometries(parts,false);
  m.scale(.145,.145,.145);        // 总高约 1.47 → 缩到 0.213，与旧版占位一致
  m.computeVertexNormals();
  m.userData={shared:true};
  return m;
}
function soldierGeo(side){ const k=side==='T'?'T':'CT'; if(!MAN_GEO[k])MAN_GEO[k]=buildSoldierGeo(k); return MAN_GEO[k]; }
function isPlayableMapPos(x, z){
  if(!window.mapPixels) return true;
  const mx = x / MAP_SIZE + 0.5;
  const my = z / MAP_SIZE + 0.5;
  if(mx<0||mx>1||my<0||my>1) return false;
  const px = Math.floor(mx*1024), py = Math.floor(my*1024);
  const i = (py*1024+px)*4;
  const r = window.mapPixels[i], g = window.mapPixels[i+1], b = window.mapPixels[i+2];
  return !(r>240 && g>240 && b>240); // not playable if white background
}

/* fx 动画推进（落地特效，intro=入场扩散 0..1） */
function animateFx(fxg,time,intro){
  const fx=fxg.userData&&fxg.userData._fx;
  if(!fx)return;
  const baseScale=fx.type==='smoke'?0.50:0.58; // 烟雾整体更小一点
  fxg.scale.setScalar(Math.max(intro,.001)*baseScale); // 落地/爆炸特效整体缩小，避免盖住大片地图
  if(fx.type==='smoke'){
    fx.puffs.forEach(sp=>{
      sp.rotation.y+=sp.userData._spin*.004;            // 棱面缓慢翻转 → 体积/锯齿感更足
      sp.rotation.x+=sp.userData._spin*.0024;
      const a=sp.userData._a+Math.sin(time*.25+sp.userData._ph)*.06; // 整体轻微环绕飘移
      sp.position.x=Math.cos(a)*sp.userData._r;
      sp.position.z=Math.sin(a)*sp.userData._r;
      sp.position.y=sp.userData._y+Math.sin(time*.7+sp.userData._ph)*.012;
      sp.visible=isPlayableMapPos(fxg.position.x+sp.position.x,fxg.position.z+sp.position.z); // 墙外裁剪
    });
  }else if(fx.type==='fire'){
    // 烧灼范围：地面火盘 + 边界火环 跳动，火苗铺满整片
    fx.glow.material.opacity=(.66+Math.sin(time*7)*.18+Math.sin(time*13.7)*.07)*intro;
    if(fx.edge)fx.edge.material.opacity=(.42+Math.sin(time*9+1.3)*.26)*intro;
    fx.flames.forEach(sp=>{
      const ph=(time*.9+sp.userData._ph)%1;
      sp.position.y=.06+ph*.30;
      sp.position.x=sp.userData._x+Math.sin(time*6+sp.userData._ph*9)*.02;
      sp.position.z=sp.userData._z+Math.cos(time*5.4+sp.userData._ph*12)*.02;
      sp.scale.setScalar(sp.userData._s*(1.32-ph));
      let op = (1-ph)*intro;
      if(!isPlayableMapPos(fxg.position.x + sp.position.x, fxg.position.z + sp.position.z)) op=0;
      sp.material.opacity=op;
    });
    fx.smokes.forEach(sp=>{
      const ph=(time*.22+sp.userData._ph)%1;
      sp.position.y=.18+ph*.8;
      sp.scale.setScalar(.4+ph*.9);
      let op = (1-ph)*.35*intro;
      if(!isPlayableMapPos(fxg.position.x + sp.position.x, fxg.position.z + sp.position.z)) op=0;
      sp.material.opacity=op;
      sp.material.rotation+=.002;
    });
  }else if(fx.type==='flash'){
    const ph=(time+fx.phase)%2.8;
    if(ph<.45){const k=ph/.45;
      fx.core.scale.setScalar(.42*(1+k*2.4));fx.core.material.opacity=.98*(1-k)*intro;
      fx.halo.scale.setScalar(.7*(1+k*2.6));fx.halo.material.opacity=.55*(1-k)*intro;
      if(fx.spikes)fx.spikes.forEach(sp=>{
        const L=sp.userData._len*k;
        sp.scale.set(1,Math.max(L,.001),1);
        sp.position.set(Math.cos(sp.userData._ang)*L*.5,.025,Math.sin(sp.userData._ang)*L*.5);
        sp.material.opacity=(1-k)*intro;
      });
    }else{fx.core.scale.setScalar(.42);fx.core.material.opacity=.9*intro;
      fx.halo.scale.setScalar(.7);fx.halo.material.opacity=.38*intro;
      if(fx.spikes)fx.spikes.forEach(sp=>sp.material.opacity=0);}
  }else if(fx.type==='he'){
    // 爆点：核心瞬间爆闪 + 冲击波环快速外扩 + 火星四射，然后归于一点
    const ph=(time+fx.phase)%2.0;
    if(ph<.55){const k=ph/.55;
      const cs=.5*(1+k*2.6);fx.core.scale.set(cs,cs,1);fx.core.material.opacity=(1-k)*intro;
      fx.ring.scale.setScalar(1+k*5.5);fx.ring.material.opacity=.9*(1-k)*intro;
      if(fx.sparks)fx.sparks.forEach(sp=>{
        const dd=k*.55;
        sp.position.x=Math.cos(sp.userData._a)*dd;
        sp.position.z=Math.sin(sp.userData._a)*dd;
        sp.position.y=.1+Math.sin(k*Math.PI)*.18;
        const ss=.12*(1-k);sp.scale.set(ss,ss,1);
        let op=(1-k)*intro;
        if(!isPlayableMapPos(fxg.position.x+sp.position.x,fxg.position.z+sp.position.z))op=0;
        sp.material.opacity=op;
      });
      if(fx.debris)fx.debris.forEach(db=>{
        const dd=k*.62; // 比火星飞得稍远、稍慢消失，看着有分量
        db.position.x=Math.cos(db.userData._a)*dd;
        db.position.z=Math.sin(db.userData._a)*dd;
        db.position.y=.08+Math.sin(k*Math.PI)*.22;
        db.rotation.x=db.userData._rx+k*8; db.rotation.y=db.userData._ry+k*6;
        let op=(1-k*.7)*intro;
        if(!isPlayableMapPos(fxg.position.x+db.position.x,fxg.position.z+db.position.z))op=0;
        db.material.opacity=op;
      });
    }else{
      fx.core.scale.set(.34,.34,1);fx.core.material.opacity=.14*intro;
      fx.ring.material.opacity=0;
      if(fx.sparks)fx.sparks.forEach(sp=>sp.material.opacity=0);
      if(fx.debris)fx.debris.forEach(db=>db.material.opacity=0);
    }
  }
}

/* 飞行中的道具：程序化低多边形手雷模型(参照 imgs/icon_{smoke,flash,fire,he}.png 重建外形/配色)，
   一眼看清扔的是什么、还会跟着抛物线翻滚，而不是一张永远正对镜头的贴图。
   合并成单几何+共享材质(同 buildSoldierGeo 套路)，四种类型各缓存一份。 */
const GREN_GEO={}; let _grenMat=null;
function grenMat(){ if(!_grenMat){_grenMat=new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true});_grenMat.userData={shared:true};} return _grenMat; }
function buildGrenadeGeo(cls){
  const parts=[];
  function add(g,color,x,y,z,rx,ry,rz){
    if(g.index)g=g.toNonIndexed();
    if(rx)g.rotateX(rx); if(ry)g.rotateY(ry); if(rz)g.rotateZ(rz);
    g.translate(x,y,z);
    const c=new THREE.Color(color),n=g.attributes.position.count,a=new Float32Array(n*3);
    for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}
    g.setAttribute('color',new THREE.BufferAttribute(a,3)); parts.push(g);
  }
  /* 识别色带一律用 UI 里的数据色本色，跟右栏圆点 / 图标 / 3D 轨迹同色，
     飞在空中只看一眼也能对上是哪一类。 */
  const U_SMOKE=0x2563eb, U_FLASH=0xca8a04, U_FIRE=0xea580c, U_HE=0xdc2626;
  const STEEL=0x9aa0a6, DARKSTEEL=0x6d747c;
  // 拉环 + 压把是四种手雷共有的特征，抽出来复用，保证四个模型是一家人
  function pinAndSpoon(topY, r, color){
    // 环压在引信座上而不是浮在半空：topY+.020 刚好搭住座顶
    add(new THREE.TorusGeometry(r,.0065,5,10), color, .004,topY+.020,.016, Math.PI*.44,0,.28);
    add(new THREE.BoxGeometry(.014,.072,.015), color, r+.014,topY-.016,0, 0,0,-.20);
  }
  if(cls==='smoke'){
    add(new THREE.CylinderGeometry(.046,.046,.135,10), 0x2f343c, 0,.0675,0);              // 罐体
    add(new THREE.CylinderGeometry(.0495,.0495,.03,10), U_SMOKE, 0,.042,0);               // 蓝色识别带（=UI 烟雾色）
    add(new THREE.CylinderGeometry(.0495,.0495,.012,10), DARKSTEEL, 0,.10,0);             // 上加强环
    add(new THREE.CylinderGeometry(.0495,.0495,.012,10), DARKSTEEL, 0,.012,0);            // 下加强环
    add(new THREE.CylinderGeometry(.034,.046,.028,10), 0x262a31, 0,.149,0);               // 收口顶盖
    add(new THREE.CylinderGeometry(.021,.021,.016,8), STEEL, 0,.171,0);                   // 引信座
    pinAndSpoon(.171,.024,STEEL);
  } else if(cls==='flash'){
    add(new THREE.CylinderGeometry(.044,.044,.115,10), 0x17181c, 0,.0575,0);              // 黑弹身
    add(new THREE.CylinderGeometry(.0475,.0475,.028,10), U_FLASH, 0,.095,0);              // 黄铜识别带（=UI 闪光色）
    // 出光孔：三条竖槽，比光板弹身有信息量
    for(let i=0;i<3;i++){
      const a=i*Math.PI*2/3;
      add(new THREE.BoxGeometry(.012,.055,.012), 0x3a3d43, Math.cos(a)*.045,.048,Math.sin(a)*.045);
    }
    add(new THREE.CylinderGeometry(.032,.044,.026,10), 0x2a2c30, 0,.128,0);               // 顶盖
    add(new THREE.CylinderGeometry(.02,.02,.016,8), STEEL, 0,.148,0);                     // 引信座
    pinAndSpoon(.148,.023,STEEL);
  } else if(cls==='fire'){
    /* 燃烧瓶：酒瓶 + 瓶里的燃油液面 + 塞在瓶口的布捻 + 布捻上偏烧的火。
       旧版顶上那个左右对称的锥体读起来像火箭头，这版改成歪斜的两片火苗。 */
    add(new THREE.CylinderGeometry(.052,.058,.115,10), 0x35471f, 0,.0575,0);              // 瓶身（墨绿玻璃）
    add(new THREE.CylinderGeometry(.0535,.0535,.062,10), 0x6b3f14, 0,.031,0);             // 瓶内燃油液面（琥珀，只到下半截）
    add(new THREE.CylinderGeometry(.062,.062,.038,10), U_FIRE, 0,.072,0);                 // 橙色标签环（=UI 火焰色）
    add(new THREE.CylinderGeometry(.021,.052,.042,10), 0x35471f, 0,.136,0);               // 瓶肩收口
    add(new THREE.CylinderGeometry(.019,.019,.042,8), 0x35471f, 0,.178,0);                // 瓶颈
    add(new THREE.CylinderGeometry(.023,.023,.012,8), 0x2a3718, 0,.202,0);                // 瓶口唇
    add(new THREE.BoxGeometry(.026,.055,.02), 0xd8cdb4, .012,.228,0, 0,0,-.30);           // 布捻（歪着塞出瓶口）
    add(new THREE.ConeGeometry(.026,.062,7), U_FIRE, .028,.272,.004, 0,0,-.34);           // 火苗主体（偏斜）
    add(new THREE.ConeGeometry(.014,.042,6), 0xffc043, .040,.309,.006, 0,0,-.42);         // 火苗尖（亮黄，再偏一点）
  } else {
    /* 高爆雷：detail=0 的二十面体，20 个大棱面才像老式菠萝弹；
       压扁成蛋形，比正球更有「握在手里」的形状。 */
    const body=new THREE.IcosahedronGeometry(.062,0);
    body.scale(1,1.18,1);
    add(body, 0x54633a, 0,.073,0);
    add(new THREE.CylinderGeometry(.0285,.0285,.014,8), U_HE, 0,.142,0);                  // 红色识别带（=UI 高爆色）
    add(new THREE.CylinderGeometry(.024,.028,.026,8), 0x1e2126, 0,.162,0);                // 引信座
    pinAndSpoon(.162,.023,STEEL);
  }
  const m=BufferGeometryUtils.mergeGeometries(parts,false); m.computeVertexNormals();
  m.userData={shared:true};
  return m;
}
function grenadeGeo(cls){ if(!GREN_GEO[cls])GREN_GEO[cls]=buildGrenadeGeo(cls); return GREN_GEO[cls]; }

function buildLandFx(d){
  const cls=utilCls(d.util);
  const color=utilColor(d.util);
  const t=fxTextures();
  const g=new THREE.Group();
  // 精确落点环
  const ring=new THREE.Mesh(
    new THREE.RingGeometry(.05,.1,24),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:.75,side:THREE.DoubleSide,depthWrite:false}));
  ring.rotation.x=-Math.PI/2;ring.position.y=.02;
  g.add(ring);

  if(cls==='smoke'){
    // 低多边形「体积云」：多个 IcosahedronGeometry(顶点轻抖动)+flatShading 簇成穹顶，棱角分明（圣安地列斯建模风），顶亮底暗有体积
    const puffs=[];
    const N=20, R=.40, H=.44;
    for(let i=0;i<N;i++){
      const u=(i+.5)/N, yy=.10+Math.pow(u,.5)*H;
      const domeR=R*Math.sqrt(Math.max(.12,1-Math.pow((yy-.10)/H,1.7)));
      const ang=i*2.399, rad=domeR*(.30+((i*7)%6)/6*.62);              // 黄金角铺开+重叠成团
      const lit=Math.min(1,(yy-.10)/H+.15);
      const col=new THREE.Color().setHSL(.60,.07,.50+lit*.34);          // 底暗顶亮、微冷灰
      const br=(.22+((i*3)%5)/5*.10)*(1.16-lit*.34);
      const ico=new THREE.IcosahedronGeometry(br,1), p=ico.attributes.position;
      for(let k=0;k<p.count;k++){const f=.90+((k*37)%22)/22*.16;p.setXYZ(k,p.getX(k)*f,p.getY(k)*f,p.getZ(k)*f);} // 轻抖动→不规则块面
      ico.computeVertexNormals();
      const sp=new THREE.Mesh(ico,new THREE.MeshLambertMaterial({color:col,flatShading:true})); // 实心棱面
      sp.position.set(Math.cos(ang)*rad,yy,Math.sin(ang)*rad);
      sp.rotation.set(i*1.1,i*.7,i*1.7);
      sp.userData._a=ang;sp.userData._r=rad;sp.userData._y=yy;sp.userData._ph=i*.7;sp.userData._spin=(i%2?1:-1);
      puffs.push(sp);g.add(sp);
    }
    const shadow=new THREE.Mesh(
      new THREE.CircleGeometry(R*1.05,24),
      new THREE.MeshBasicMaterial({color:0x44515f,transparent:true,opacity:.22,depthWrite:false}));
    shadow.rotation.x=-Math.PI/2;shadow.position.y=.02;
    g.add(shadow);
    g.userData._fx={type:'smoke',puffs};
  }else if(cls==='fire'){
    // 燃烧弹：明显的"烧灼范围" —— 地面火盘 + 边界火环 + 满范围跳动火苗 + 烟尾
    const R=.58;
    const glow=new THREE.Mesh(
      new THREE.CircleGeometry(R,32),
      new THREE.MeshBasicMaterial({map:t.glow,transparent:true,opacity:1,depthWrite:false}));
    glow.rotation.x=-Math.PI/2;glow.position.y=.03;
    g.add(glow);
    const edge=new THREE.Mesh(
      new THREE.RingGeometry(R*.8,R,44),
      new THREE.MeshBasicMaterial({color:0xff6a22,transparent:true,opacity:.6,side:THREE.DoubleSide,depthWrite:false}));
    edge.rotation.x=-Math.PI/2;edge.position.y=.038;
    g.add(edge);
    const flames=[];
    for(let i=0;i<16;i++){
      const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t.flame,transparent:true,depthWrite:false,opacity:.95}));
      const ang=Math.random()*Math.PI*2,rad=Math.sqrt(Math.random())*R*.92; // 均匀铺满整个圆盘
      sp.position.set(Math.cos(ang)*rad,.12,Math.sin(ang)*rad);
      sp.scale.set(.2+Math.random()*.14,.28+Math.random()*.2,1);
      sp.userData._ph=Math.random();
      sp.userData._x=sp.position.x;sp.userData._z=sp.position.z;
      sp.userData._s=sp.scale.x;
      flames.push(sp);g.add(sp);
    }
    const smokes=[];
    for(let i=0;i<4;i++){
      const sp=puffSprite(0x6f7681,.28);
      sp.scale.set(.42,.42,1);
      sp.position.set((Math.random()-.5)*R,.5+i*.13,(Math.random()-.5)*R);
      sp.userData._ph=Math.random();
      smokes.push(sp);g.add(sp);
    }
    g.userData._fx={type:'fire',glow,edge,flames,smokes};
  }else if(cls==='flash'){
    // 闪光：核心光斑 + 光晕 + 低多边形放射尖刺(躺平辐射，像经典闪光图标)，周期爆闪
    const core=new THREE.Sprite(new THREE.SpriteMaterial({map:t.spark,transparent:true,depthWrite:false,opacity:1}));
    core.scale.set(.42,.42,1);core.position.y=.32;
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:t.puff,color:0xffd84d,transparent:true,depthWrite:false,opacity:.4}));
    halo.scale.set(.7,.7,1);halo.position.y=.32;
    const spikes=[];
    const SPN=8;
    for(let i=0;i<SPN;i++){
      const spike=new THREE.Mesh(new THREE.ConeGeometry(.05,1,3),new THREE.MeshBasicMaterial({color:0xfff2c0,transparent:true,opacity:0}));
      spike.rotation.z=-Math.PI/2; // 锥尖转成水平朝外
      spike.rotation.y=-(i/SPN*Math.PI*2+(i%2?.18:0));
      spike.position.y=.025;
      spike.userData._ang=i/SPN*Math.PI*2+(i%2?.18:0); spike.userData._len=(i%2)?.30:.42;
      spikes.push(spike);g.add(spike);
    }
    g.add(core,halo);
    g.userData._fx={type:'flash',core,halo,spikes,phase:Math.random()*3};
  }else{
    // 高爆雷：一个明确的"爆点" —— 橙红爆闪核心 + 快速冲击波环 + 四射火星 + 低多边形焦黑碎屑
    const core=new THREE.Sprite(new THREE.SpriteMaterial({map:t.spark,color:0xffb060,transparent:true,depthWrite:false,opacity:1}));
    core.scale.set(.5,.5,1);core.position.y=.18;
    const ring=new THREE.Mesh(new THREE.RingGeometry(.05,.11,36),new THREE.MeshBasicMaterial({color:0xff5530,transparent:true,opacity:.9,side:THREE.DoubleSide,depthWrite:false}));
    ring.rotation.x=-Math.PI/2;ring.position.y=.04;
    const sparks=[];
    const SN=10;
    for(let i=0;i<SN;i++){
      const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t.spark,color:0xffae54,transparent:true,depthWrite:false,opacity:0}));
      sp.scale.set(.1,.1,1);sp.position.set(0,.1,0);
      sp.userData._a=i/SN*Math.PI*2+Math.random()*.4;
      sparks.push(sp);g.add(sp);
    }
    const debris=[];
    const DN=8;
    for(let i=0;i<DN;i++){
      const deb=new THREE.Mesh(new THREE.TetrahedronGeometry(.035+((i*3)%3)*.008),new THREE.MeshLambertMaterial({color:0x2a2018,flatShading:true,transparent:true,opacity:0}));
      deb.userData._a=i/DN*Math.PI*2+((i*5)%3)*.3; deb.userData._rx=i*1.7; deb.userData._ry=i*1.1;
      debris.push(deb);g.add(deb);
    }
    g.add(core,ring);
    g.userData._fx={type:'he',core,ring,sparks,debris,phase:Math.random()*2};
  }
  return g;
}



/* ===== 选中播放：手雷从投掷点飞到落点 + 落地特效（一次只演一个） ===== */
function stopPlay(){
  if(!activePlay)return;
  if(activePlay.hiddenSpot)activePlay.hiddenSpot.mark.visible=true; // 恢复被隐藏的点位圈
  [activePlay.grenade,activePlay.arc,activePlay.landFx,activePlay.man].forEach(o=>{if(o){scene.remove(o);disposeObj(o)}});
  activePlay=null;selPlayId=null;
  invalidate();
}
function playThrow(d){
  stopPlay();
  selPlayId=d.id;
  const curve=buildThrowCurve(d);
  const arc=buildArc(d);
  if(arc)scene.add(arc);
  const gren=makeGrenade(d);
  gren.position.copy(curve.v0);
  scene.add(gren);
  // 临时投掷点小人（仅在投掷点和落点有距离时才有意义）
  let man=null;
  if(curve.v0.distanceTo(curve.v2)>.5){const fa=Math.atan2(curve.v2.x-curve.v0.x,curve.v2.z-curve.v0.z);man=makeManSprite(d.side,fa);man.position.copy(curve.v0);scene.add(man)}
  // 播放时隐藏该点位自己的圈：弧线+落点特效已经标了落点，避免"红圈+小人"重复
  const hiddenSpot=spotMeshes.find(s=>s.spot.id===d.spotId)||null;
  if(hiddenSpot)hiddenSpot.mark.visible=false;
  activePlay={d,curve,arc,grenade:gren,man,landFx:null,t0:performance.now(),dur:780,phase:'fly',landT0:0,hiddenSpot};
}
window.selectUtil=function(id,openDet){
  const d=data.find(x=>x.id===id);if(!d)return;
  playThrow(d);
  if(openDet)openDetail(id);
  if($('utilPanel')&&$('utilPanel').classList.contains('open'))renderUtilPanel();
};

window.deleteSpot=async function(spotId){
  const sp=spotById(spotId);
  if(!sp)return;
  const throws=spotThrows(sp.id);
  if(!await uiConfirm('彻底删除点位「'+spotLabel(sp)+'」及其 '+throws.length+' 颗道具？','删除点位'))return;
  pushUndo(['data','spots']);
  await stashImgsForUndo(throws.map(d=>d.id));
  data=data.filter(x=>x.spotId!==sp.id);
  spots=spots.filter(x=>x.id!==sp.id);
  throws.forEach(d=>IMG_SLOTS.forEach(([slot])=>{imgInvalidate(imgKey(d.id,slot));imgDel(imgKey(d.id,slot))}));
  save();saveSpots();
  if(selSpot===sp.id){selSpot=null;closeSpotPanel();}
  renderDots3D();
  if($('utilPanel')&&$('utilPanel').classList.contains('open'))renderUtilPanel();
  renderIdlePanel();
};

function onCanvasDrop(e){

/* 点位圈标记（大小=spot.size，颜色=spot.util；一个圈 = 一个投掷点位，挂多颗道具） */
function makeSpotMark(spot){
  const color=utilColor(spot.util);
  const g=new THREE.Group();
  const r=.052*(spot.size||1);
  const fill=new THREE.Mesh(new THREE.CircleGeometry(r*.72,24),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:.14,side:THREE.DoubleSide,depthWrite:false}));
  fill.rotation.x=-Math.PI/2;fill.position.y=.03;
  const ring=new THREE.Mesh(new THREE.RingGeometry(r*.72,r,32),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8,side:THREE.DoubleSide,depthWrite:false}));
  ring.rotation.x=-Math.PI/2;ring.position.y=.035;
  const th0=spotThrows(spot.id)[0]; // 朝向该点位首颗道具的投掷方向
  const fa=(th0&&typeof th0.standX==='number'&&typeof th0.mapX==='number')?Math.atan2(th0.mapX-th0.standX,th0.mapY-th0.standY):0;
  const man=makeManSprite(spot.side,fa);man.position.y=.002;
  g.add(fill,ring,man);g.userData={ring,fill};
  return g;
}

function renderDots3D(){
  if(!scene)return;
  clearDots();
  const list=curSpots();
  $('empty3d').classList.remove('show'); // 空状态提示已按要求移除
  list.forEach(spot=>{
    const th=spotThrows(spot.id);
    // 投掷点位置：该点位首颗道具的 standX/Y（投掷点），回退 spot.x/y
    const s0=th[0];
    const sx=(s0&&typeof s0.standX==='number')?s0.standX:spot.x;
    const sy=(s0&&typeof s0.standY==='number')?s0.standY:spot.y;
    if(sx===undefined||sy===undefined)return;
    const v=mapCoordTo3D(sx,sy);
    const y0=getHeightAt(sx,sy)+.04;
    const mark=makeSpotMark(spot);
    mark.position.set(v.x,y0,v.z);
    if(selSpot===spot.id){mark.userData.ring.material.opacity=1;mark.userData.fill.material.opacity=.30}
    scene.add(mark);
    const prox=new THREE.Mesh(
      new THREE.SphereGeometry(.36,8,8),
      new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
    prox.position.set(v.x,y0+.2,v.z);
    prox.userData={spotId:spot.id,util:spot.util,name:spotLabel(spot),count:th.length};
    scene.add(prox);hitProxies.push(prox);
    spotMeshes.push({spot,mark,prox});
  });
  if(selPlayId&&!data.some(d=>d.id===selPlayId)){activePlay=null;selPlayId=null}
  renderStratBar();
  updateTopTag();
  renderUtilPanel();
  invalidate();
}
