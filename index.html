<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F8FB">
<title>CS2 战术沙盘</title>
<link rel="manifest" href="manifest.json">
<!-- 零远程字体。原来这里挂着 fonts.googleapis.com 的渲染阻塞样式表，
     该域名在国内被墙：浏览器要等它失败(约 0.5s)才继续渲染，
     失败后字体又从系统栈换成 DM Sans —— 这就是「先闪旧样式再刷新」的根因。
     中文本来也用不上 DM Sans/Inter，去掉后首帧即终态。 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="image" href="imgs/zs_deck.webp?v=1" media="(min-width:761px)">
<link rel="preload" as="image" href="imgs/zs_deck_s.webp?v=1" media="(max-width:760px)">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   TACTICAL DECK v1 · CS2 战术沙盘设计系统
   单层样式表，无覆盖层、无 !important 堆叠。所有取值来自下面的 token 表，
   表外数值一律视为 bug。规范总 Demo：_design/demo.html
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  /* ── 字体：零远程字体。拉丁在前、中文在后，Segoe/SF 管西文，苹方/雅黑管汉字 ── */
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
         "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,monospace;
  /* 字号梯度：14px 基准，向上 1.200 小三度 */
  /* 字号：苹果式舒适档。基准 15px（原 14 偏挤），整条阶梯上移一档 */
  --fs-micro:11.5px;--fs-caption:12.5px;--fs-small:13.5px;--fs-body:15px;
  --fs-lead:17px;--fs-h4:21px;--fs-h3:25px;--fs-h2:30px;--fs-h1:38px;--fs-display:46px;
  /* 行高整体放宽一档：中文比西文更吃行距，1.7 才读得松 */
  --lh-tight:1.12;--lh-title:1.25;--lh-snug:1.5;--lh-body:1.7;--lh-loose:1.9;
  /* 字重：苹果的大标题是 600–700 配紧字距，不是 800。
     且 Windows 上雅黑没有 500/600 实体字重，写 800 只会被合成得又粗又糊。 */
  --fw-body:400;--fw-med:500;--fw-bold:600;--fw-display:700;
  /* 字距做光学补偿：字越大收得越紧，全大写小标签放开但别放到散架 */
  --ls-tight:-.024em;--ls-wide:.04em;--ls-caps:.12em;

  /* ── 中性：单一冷石墨蓝色相(hue≈214)，杜绝灰色打架 ── */
  --ink-0:#FFFFFF;--ink-50:#F6F8FB;--ink-100:#EDF1F6;--ink-150:#E3E9F1;
  --ink-200:#D5DEE9;--ink-300:#B3C0D1;--ink-400:#8496AE;--ink-500:#5F7189;
  --ink-600:#46586F;--ink-700:#33445A;--ink-800:#1E2C3F;--ink-900:#121C2B;
  /* ── 铬色强调：全站唯一强调色(青绿)，刻意避开四个道具数据色 ── */
  --acc-50:#E8F5F8;--acc-100:#CDEAF1;--acc-300:#4FB3C9;
  --acc-500:#0D7C99;--acc-600:#0A6580;--acc-700:#08505F;
  /* ── 数据色：填充用，锁死，与 3D 顶点色一致；当文字用必须换 -ink 变体 ── */
  --u-smoke:#2563EB;--u-flash:#CA8A04;--u-fire:#EA580C;--u-he:#DC2626;
  --u-smoke-ink:#1D4ED8;--u-flash-ink:#8A6100;--u-fire-ink:#C2410C;--u-he-ink:#DC2626;
  --ct:#2563EB;--t:#D97706;--ct-ink:#1D4ED8;--t-ink:#B45309;
  --ok:#0E9F6E;--warn:#D97706;--danger:#DC2626;
  --ok-ink:#047857;--warn-ink:#B45309;--danger-ink:#DC2626;
  /* 兼容 JS 里 utilColorCSS() 生成的 var(--smoke/--flash/--fire) */
  --smoke:var(--u-smoke);--flash:var(--u-flash);--fire:var(--u-fire);--he:var(--u-he);
  --red:var(--danger);--orange:var(--u-fire);--green:var(--ok);--accent:var(--acc-500);

  /* ── 语义别名：页面里只写这些，不写色号 ── */
  --bg:var(--ink-50);--surface:var(--ink-0);--surface-2:var(--ink-100);--surface-3:var(--ink-150);
  --line:rgba(18,28,43,.09);--line-strong:rgba(18,28,43,.16);
  /* 三级文字实测全过 AA：16.1 / 7.3 / 5.0。ink-400 及更浅只准描边/禁用/图标 */
  --text:var(--ink-900);--text-2:var(--ink-600);--text-3:var(--ink-500);--text-inv:#EAF1F8;

  /* ── 阴影：5 档 + 2 专用，投影一律冷色 ── */
  --sh-1:0 1px 2px rgba(18,28,43,.04);
  --sh-2:0 1px 3px rgba(18,28,43,.03),0 6px 18px rgba(18,28,43,.05);
  --sh-3:0 2px 8px rgba(18,28,43,.04),0 16px 40px rgba(18,28,43,.08);
  --sh-4:0 8px 26px rgba(18,28,43,.06),0 34px 76px rgba(18,28,43,.11);
  --sh-5:0 16px 48px rgba(18,28,43,.09),0 56px 120px rgba(18,28,43,.17);
  --sh-acc:0 8px 24px rgba(13,124,153,.22);

  /* ── 圆角：嵌套时内层 = 外层 − padding，保持同心 ── */
  --r-xs:7px;--r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:28px;--r-full:999px;
  /* ── 间距：4px 基网格 ── */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;
  --sp-8:32px;--sp-10:40px;--sp-12:48px;--sp-16:64px;--sp-20:80px;

  /* ── 动效：曲线各有职责，时长 5 档 ── */
  --e-out:cubic-bezier(.22,1,.36,1);       /* 进入/出场，强减速 */
  --e-in:cubic-bezier(.55,0,1,.45);        /* 离场 */
  --e-both:cubic-bezier(.65,0,.35,1);      /* 往返位移 */
  --e-spring:cubic-bezier(.34,1.56,.64,1); /* 弹性强调，轻微过冲 */
  --e-glide:cubic-bezier(.16,1,.3,1);      /* 抽屉/面板长滑 */
  --e-snap:cubic-bezier(.3,.9,.2,1);       /* hover / press */
  --t-1:120ms;--t-2:180ms;--t-3:260ms;--t-4:380ms;--t-5:560ms;
  /* 旧变量名兼容（JS 与遗留声明里仍在引用） */
  --ease:var(--e-out);--ease2:var(--e-both);

  /* ── 玻璃与遮罩：模糊度实测取值。>30px 集显掉帧，<8px 压不住前景 ── */
  --blur-1:blur(10px) saturate(1.3);
  --blur-2:blur(18px) saturate(1.4);
  --blur-3:blur(26px) saturate(1.5);
  --glass:rgba(255,255,255,.72);
  --glass-line:rgba(255,255,255,.70);
  --scrim-1:rgba(18,28,43,.30);
  --scrim-2:rgba(18,28,43,.44);
  --scrim-3:rgba(10,16,25,.80);

  --gutter:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --panel-w:clamp(320px,30vw,460px);
}
@media(max-width:1180px){:root{--gutter:32px}}
@media(max-width:760px){
  :root{--gutter:20px;--panel-w:0px;
    --blur-2:blur(12px) saturate(1.35);--blur-3:blur(16px) saturate(1.4)}
}
@media(min-width:2000px){:root{--panel-w:clamp(340px,26vw,520px)}}

/* ══ 复位 ══ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);font-size:var(--fs-body);font-weight:var(--fw-body);
  line-height:var(--lh-body);color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;font-optical-sizing:auto;font-variant-numeric:tabular-nums}
/* 标题不留孤字、正文不留孤行——苹果文案永远不会有一个词单独掉到最后一行 */
.land-title,.rh-title,.ds-title,.op-title,.idle-title,.um-title,.e3-title{text-wrap:balance}
.land-sub,.op-sub,.idle-sub,.um-msg,.op-hint,.eh-tip,.ds-desc{text-wrap:pretty}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--acc-500);outline-offset:2px;border-radius:var(--r-xs)}
:focus:not(:focus-visible){outline:none}
::selection{background:rgba(13,124,153,.20)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ink-200);border-radius:var(--r-full);
  border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-300);background-clip:content-box}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* ══ 出场动画：加载即叙事 ══ */
@keyframes riseIn{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes flagIn{from{opacity:0;transform:translateZ(30px) translateY(6px) scale(.8)}
  to{opacity:1;transform:translateZ(30px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes drawerIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes secIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:140% 0}to{background-position:-40% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(14,159,110,.5)}
  70%{box-shadow:0 0 0 7px rgba(14,159,110,0)}100%{box-shadow:0 0 0 0 rgba(14,159,110,0)}}

/* ══════════════════════════════════════════════════════════════════════════
   加载页 — 首帧即终态。底色/字体/字号与着陆页一致，
   loader 淡出时不会出现「换了一套设计」的观感。
   ══════════════════════════════════════════════════════════════════════════ */
.loading{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:var(--sp-4);
  background:var(--bg);
  /* 首帧即终态：loader 起手 opacity:0，延迟 400ms 才淡入。
     正常启动(约 30ms)在它现身之前就 .done 了，用户从头到尾看不到加载屏，
     不会出现「先闪一版再换一版」。只有启动真卡住/模块解析失败时它才浮出来兜底。 */
  opacity:0;animation:ldReveal var(--t-3) var(--e-out) 400ms forwards;
  transition:opacity var(--t-3) var(--e-out),visibility 0s linear var(--t-3)}
@keyframes ldReveal{to{opacity:1}}
.loading.done{opacity:0;visibility:hidden;pointer-events:none;animation:none}
.ld-logo{font-size:var(--fs-lead);font-weight:var(--fw-display);letter-spacing:var(--ls-caps);
  color:var(--ink-800)}
.ld-bar{width:132px;height:3px;border-radius:var(--r-full);background:var(--ink-150);overflow:hidden}
.ld-fill{height:100%;border-radius:var(--r-full);
  background:linear-gradient(90deg,var(--acc-300),var(--acc-500));
  transition:width var(--t-3) var(--e-out)}
.ld-text{font-size:var(--fs-micro);color:var(--text-3);letter-spacing:var(--ls-wide)}
/* 救援 UI：原来是一堆内联硬编码色的「未设计」状态，现在也走同一套 token */
#ldRescue{display:none;margin-top:var(--sp-6);text-align:center}
.ld-rescue-t{margin:0 0 var(--sp-3);font-size:var(--fs-caption);color:var(--text-3)}
.ld-rescue-b{display:block;width:220px;height:44px;margin:0 auto var(--sp-2);
  border-radius:var(--r-md);cursor:pointer;font-family:inherit;
  font-size:var(--fs-small);font-weight:var(--fw-bold);color:var(--text-2);
  background:#fff;border:1px solid var(--line-strong);transition:all var(--t-2) var(--e-snap)}
.ld-rescue-b:hover{border-color:var(--ink-300);color:var(--text)}
.ld-rescue-b.primary{color:#fff;border-color:transparent;
  background:linear-gradient(135deg,var(--acc-500),var(--acc-700));box-shadow:var(--sh-acc)}
.ld-rescue-b.primary:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(13,124,153,.38)}
#ldErrMsg{max-width:280px;margin:var(--sp-3) auto 0;word-break:break-all;
  font-size:var(--fs-micro);line-height:var(--lh-body);color:var(--text-3)}

/* ══════════════════════════════════════════════════════════════════════════
   台面背景 — 三层：冷光渐变 → 测绘网格 → grsai 蚀刻纹理。
   图没到也完整成立，首帧不依赖图片。
   ══════════════════════════════════════════════════════════════════════════ */
#landing{position:fixed;inset:0;z-index:100;display:block;
  overflow-y:auto;overflow-x:hidden;color:var(--text);
  transition:opacity var(--t-5) var(--e-out),transform var(--t-5) var(--e-out)}
#landing.hidden{pointer-events:none;opacity:0;transform:scale(1.015)}
.land-bg{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 90% at 12% 8%,rgba(255,255,255,.92),rgba(255,255,255,0) 55%),
    radial-gradient(90% 80% at 88% 18%,rgba(205,234,241,.55),rgba(205,234,241,0) 60%),
    radial-gradient(100% 100% at 50% 110%,rgba(30,44,63,.16),rgba(30,44,63,0) 62%),
    linear-gradient(168deg,#F8FAFD 0%,#EAF0F6 42%,#DCE5EF 100%)}
.land-bg::before{content:'';position:absolute;inset:0;opacity:.5;
  background-image:
    linear-gradient(rgba(30,44,63,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(30,44,63,.045) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(130% 110% at 20% 0%,#000 18%,transparent 72%);
  mask-image:radial-gradient(130% 110% at 20% 0%,#000 18%,transparent 72%)}
.land-bg::after{content:'';position:absolute;inset:0;
  background:url('imgs/zs_deck.webp?v=1') center/cover no-repeat;
  opacity:.9;mix-blend-mode:multiply}
@media(max-width:760px){.land-bg::after{background-image:url('imgs/zs_deck_s.webp?v=1')}}
.land-grid{display:none}

.land-content{position:relative;z-index:2;max-width:1760px;margin:0 auto;min-height:100vh;
  padding:var(--gutter);display:flex;flex-wrap:wrap;align-items:flex-start;
  gap:var(--sp-16) var(--sp-16)}
.land-left{flex:0 0 clamp(360px,28vw,440px);min-width:0;position:sticky;top:var(--gutter)}
.land-right{flex:1 1 620px;min-width:0}

/* ── 简报卡：全站唯一的深色锚点 ── */
.lcard{position:relative;overflow:hidden;border-radius:var(--r-xl);
  padding:var(--sp-12) var(--sp-10) var(--sp-10);color:var(--text-inv);
  background:linear-gradient(158deg,#1B283A 0%,#121C2B 52%,#0D1622 100%);
  box-shadow:var(--sh-4),inset 0 1px 0 rgba(255,255,255,.10);
  --mx:50%;--my:50%;--rx:0deg;--ry:0deg;
  transform:perspective(1100px) rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform var(--t-4) var(--e-out);
  /* 必须是 backwards 不能是 both：both 的填充帧会把 transform:none 永久钉住，
     magnet() 写的倾角就再也生效不了（backwards 只在延迟期填充，播完即释放） */
  animation:riseIn var(--t-5) var(--e-out) backwards}
/* 冷光斜切：是「灯打在简报板上」，不是渐变装饰 */
.lcard::before{content:'';position:absolute;top:-40%;left:-25%;width:85%;height:150%;
  pointer-events:none;transform:rotate(18deg);filter:blur(28px);
  background:linear-gradient(90deg,rgba(79,179,201,.16),rgba(79,179,201,0) 70%)}
/* 底部蚀刻网格，呼应台面 */
.lcard::after{content:'';position:absolute;left:0;right:0;bottom:0;height:170px;
  pointer-events:none;opacity:.5;
  background-image:linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:26px 100%;
  -webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.lcard>*{position:relative;z-index:1}

.land-tag{display:flex;align-items:center;gap:var(--sp-3);margin:0 0 var(--sp-6);
  font-size:var(--fs-micro);font-weight:var(--fw-bold);letter-spacing:var(--ls-caps);
  color:var(--acc-300)}
.land-tag::before{content:'';width:24px;height:2px;border-radius:1px;
  background:linear-gradient(90deg,var(--acc-300),rgba(79,179,201,.15))}
.land-title{margin:0 0 var(--sp-5);font-size:var(--fs-h1);line-height:var(--lh-tight);
  font-weight:var(--fw-display);letter-spacing:var(--ls-tight)}
.land-sub{margin:0 0 var(--sp-10);font-size:var(--fs-body);line-height:var(--lh-loose);
  color:rgba(234,241,248,.66);max-width:32ch}
.deploy-wrap{margin:0}

/* ── 主 CTA ── */
.deploy-btn{position:relative;overflow:hidden;width:100%;height:56px;
  display:flex;align-items:center;justify-content:center;gap:var(--sp-2);
  border:0;border-radius:var(--r-lg);cursor:pointer;font-family:inherit;
  font-size:var(--fs-lead);font-weight:var(--fw-bold);color:#fff;
  background:linear-gradient(135deg,var(--acc-500),var(--acc-700));
  box-shadow:var(--sh-acc),inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform var(--t-2) var(--e-snap),box-shadow var(--t-2) var(--e-snap),
             opacity var(--t-2) var(--e-snap)}
.deploy-btn::after{content:'';position:absolute;inset:0 auto 0 -70%;width:45%;
  pointer-events:none;transform:skewX(-18deg);
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.42),transparent);
  transition:left var(--t-5) var(--e-out)}
.deploy-btn:hover:not(:disabled){transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(13,124,153,.40),inset 0 1px 0 rgba(255,255,255,.22)}
.deploy-btn:hover:not(:disabled)::after{left:135%}
.deploy-btn:active:not(:disabled){transform:translateY(0) scale(.985)}
.deploy-btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.deploy-btn .dp-sep{opacity:.45}
.deploy-btn .dp-arrow{display:inline-block;transition:transform var(--t-2) var(--e-snap)}
.deploy-btn:hover:not(:disabled) .dp-arrow{transform:translateX(4px)}

.backup-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);margin-top:var(--sp-3)}
.bk-btn{height:44px;border-radius:var(--r-md);cursor:pointer;font-family:inherit;
  font-size:var(--fs-small);font-weight:var(--fw-bold);
  background:rgba(255,255,255,.06);color:rgba(234,241,248,.82);
  border:1px solid rgba(255,255,255,.13);
  transition:background var(--t-2) var(--e-snap),border-color var(--t-2) var(--e-snap),
             color var(--t-2) var(--e-snap),transform var(--t-1) var(--e-snap)}
.bk-btn:hover{background:rgba(255,255,255,.11);color:#fff;border-color:rgba(79,179,201,.45)}
.bk-btn:active{transform:scale(.97)}
.bk-btn.ghost{color:rgba(234,241,248,.62)}
.compress-chip{margin-top:var(--sp-3);display:inline-flex;align-items:center;gap:var(--sp-2);
  height:34px;padding:0 var(--sp-4);border-radius:var(--r-full);cursor:pointer;font-family:inherit;
  font-size:var(--fs-caption);font-weight:var(--fw-med);
  background:rgba(255,255,255,.05);color:rgba(234,241,248,.55);
  border:1px solid rgba(255,255,255,.10);transition:background var(--t-2) var(--e-snap)}
.compress-chip::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--acc-300)}
.compress-chip:hover{background:rgba(255,255,255,.10)}
.backup-note{margin:var(--sp-8) 0 0;padding-top:var(--sp-5);
  border-top:1px solid rgba(255,255,255,.09);display:flex;gap:var(--sp-2);
  font-size:var(--fs-caption);line-height:var(--lh-body);color:rgba(234,241,248,.50);max-width:36ch}
.backup-note b{color:rgba(234,241,248,.78);font-weight:var(--fw-bold)}

/* ── 右栏：区块头 + 地图网格 ── */
.rhead{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-5);flex-wrap:wrap}
.rh-l{display:flex;align-items:center;gap:var(--sp-3)}
.rh-no{width:26px;height:26px;border-radius:var(--r-xs);flex:none;display:grid;place-items:center;
  background:var(--ink-900);color:var(--text-inv);
  font-size:var(--fs-caption);font-weight:var(--fw-bold);box-shadow:var(--sh-2)}
.rh-title{font-size:var(--fs-h4);font-weight:var(--fw-bold);
  line-height:var(--lh-title);letter-spacing:var(--ls-tight);color:var(--text)}
.rh-guide{font-size:var(--fs-small);color:var(--text-3);margin-left:auto}

.map-grid{display:grid;gap:var(--sp-5);margin-top:var(--sp-3);perspective:1100px;
  grid-template-columns:repeat(auto-fill,minmax(clamp(164px,15vw,228px),1fr))}
/* 智能感应模块：--mx/--my 是鼠标在卡内的百分比，--rx/--ry 是倾角，均由 JS 的 magnet() 写入 */
.map-card{position:relative;display:flex;flex-direction:column;gap:var(--sp-3);
  padding:var(--sp-4);border-radius:var(--r-lg);cursor:pointer;
  background:rgba(255,255,255,.74);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:var(--blur-1);backdrop-filter:var(--blur-1);
  box-shadow:var(--sh-2);transform-style:preserve-3d;
  --mx:50%;--my:50%;--rx:0deg;--ry:0deg;
  transform:perspective(1100px) rotateX(var(--rx)) rotateY(var(--ry));
  transition:transform var(--t-4) var(--e-out),box-shadow var(--t-3) var(--e-out),
             border-color var(--t-3) var(--e-out);
  animation:cardIn var(--t-5) var(--e-out) backwards}
.map-card.no-anim{animation:none}
.map-card::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  opacity:0;transition:opacity var(--t-3) var(--e-out);
  background:radial-gradient(circle 220px at var(--mx) var(--my),
             rgba(13,124,153,.20),rgba(13,124,153,0) 68%)}
.map-card::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  opacity:0;transition:opacity var(--t-3) var(--e-out);mix-blend-mode:overlay;
  background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 42%)}
/* .hot 由 magnet() 加：进入时 transform 走线性即时跟手，离开回正才用缓动 */
.map-card.hot{box-shadow:var(--sh-3),0 0 0 1px rgba(13,124,153,.22);
  border-color:rgba(79,179,201,.5);
  transition:transform var(--t-1) linear,box-shadow var(--t-3) var(--e-out),
             border-color var(--t-3) var(--e-out)}
.map-card.hot::before,.map-card.hot::after{opacity:1}

.mc-radar{position:relative;aspect-ratio:4/3;border-radius:var(--r-md);overflow:hidden;
  background:linear-gradient(135deg,var(--ink-100),var(--ink-200));transform:translateZ(22px)}
.mc-radar img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform var(--t-5) var(--e-out)}
.map-card.hot .mc-radar img{transform:scale(1.07)}
.mc-radar img.mc-logo{position:absolute;top:8px;left:8px;width:46px;height:46px;
  object-fit:contain;z-index:2;pointer-events:none;
  filter:drop-shadow(0 3px 8px rgba(18,28,43,.45));
  transition:transform var(--t-4) var(--e-spring)}
.map-card.hot .mc-radar img.mc-logo{transform:scale(1.08) rotate(-4deg)}
.mc-count{position:absolute;top:8px;right:8px;height:23px;padding:0 var(--sp-2);
  display:flex;align-items:center;border-radius:var(--r-xs);z-index:2;
  background:rgba(18,28,43,.86);color:var(--text-inv);
  font-size:var(--fs-micro);font-weight:var(--fw-bold);
  transition:transform var(--t-3) var(--e-out)}
.map-card.hot .mc-count{transform:translateY(-2px)}
.map-card.no-data .mc-radar img{filter:grayscale(.55);opacity:.75}
.map-card.no-data .mc-radar img.mc-logo{opacity:.55;
  filter:grayscale(.4) drop-shadow(0 2px 5px rgba(18,28,43,.2))}
.map-card.no-data .mc-count{background:rgba(255,255,255,.9);color:var(--text-3);
  border:1px solid var(--line)}
.mc-nrow{display:flex;align-items:center;gap:var(--sp-2);
  padding:0 var(--sp-1) var(--sp-1);transform:translateZ(14px)}
.mc-name{flex:1;min-width:0;font-size:var(--fs-body);font-weight:var(--fw-bold);
  color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-go{flex:none;font-size:var(--fs-caption);font-weight:var(--fw-bold);color:var(--acc-500);
  opacity:0;transform:translateX(-4px);
  transition:opacity var(--t-2) var(--e-out),transform var(--t-2) var(--e-out)}
.map-card.hot .mc-go{opacity:1;transform:none}
/* 选中态：实心描边 + 顶标，不用常驻呼吸动画（常驻动画=噪音） */
.mc-sel-ring{position:absolute;inset:-1px;border-radius:var(--r-lg);pointer-events:none;
  border:2px solid var(--acc-500);box-shadow:0 0 0 3px rgba(13,124,153,.14)}
.mc-sel-tag{position:absolute;top:-9px;left:var(--sp-4);height:22px;padding:0 var(--sp-2);
  display:flex;align-items:center;border-radius:var(--r-xs);z-index:3;
  background:var(--acc-500);color:#fff;box-shadow:var(--sh-acc);
  font-size:var(--fs-micro);font-weight:var(--fw-display);
  transform:translateZ(30px);animation:flagIn var(--t-4) var(--e-spring) both}

.land-cloud{position:fixed;left:var(--gutter);bottom:var(--sp-6);z-index:3;
  display:inline-flex;align-items:center;gap:var(--sp-2);height:34px;padding:0 var(--sp-4);
  border-radius:var(--r-full);font-size:var(--fs-caption);font-weight:var(--fw-med);color:var(--text-3);
  background:rgba(255,255,255,.80);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:var(--blur-1);backdrop-filter:var(--blur-1);box-shadow:var(--sh-2)}
.land-cloud::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok);
  animation:pulseRing 2.6s var(--e-out) infinite}

/* ── 着陆页搜索触发条 ── */
.sp-trigger{display:flex;align-items:center;gap:var(--sp-3);width:100%;height:48px;
  padding:0 var(--sp-4);border-radius:var(--r-md);cursor:pointer;font-family:inherit;
  font-size:var(--fs-body);font-weight:var(--fw-med);color:var(--text-3);
  background:rgba(255,255,255,.68);border:1px solid var(--line);
  -webkit-backdrop-filter:var(--blur-1);backdrop-filter:var(--blur-1);box-shadow:var(--sh-1);
  transition:border-color var(--t-2) var(--e-snap),box-shadow var(--t-2) var(--e-snap),
             background var(--t-2) var(--e-snap)}
.sp-trigger:hover{background:#fff;border-color:var(--acc-300);box-shadow:var(--sh-2)}
.sp-trigger>svg{width:17px;height:17px;color:var(--acc-500);flex:none}

/* ══ 平板：简报卡转顶部横条，地图区独立滚动，单屏不溢出 ══ */
@media(min-width:761px) and (max-width:1180px){
  .land-content{flex-wrap:nowrap;height:100dvh;min-height:0;overflow:hidden;
    padding:var(--sp-5) var(--gutter);gap:var(--sp-5)}
  .land-left{flex:0 0 250px;position:static}
  .land-right{flex:1 1 auto;max-height:calc(100dvh - 40px);overflow-y:auto;padding-right:6px}
  .lcard{padding:var(--sp-5) var(--sp-4) var(--sp-4);border-radius:var(--r-lg)}
  .lcard::after{display:none}
  .land-tag{margin-bottom:var(--sp-2);font-size:10px;letter-spacing:.16em}
  .land-title{font-size:var(--fs-h3);margin-bottom:var(--sp-2)}
  .land-sub,.backup-note,.compress-chip{display:none}
  .deploy-btn{height:46px;font-size:var(--fs-body)}
  .bk-btn{height:38px;font-size:var(--fs-caption)}
  .map-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--sp-3)}
  .mc-radar{aspect-ratio:16/11}
  .mc-logo{width:36px;height:36px}
  .rh-guide{display:none}
  .land-cloud{display:none}
}
/* ══ 手机：重排而非压缩 —— 简报信息先收起，地图两列优先 ══ */
@media(max-width:760px){
  .land-content{padding:var(--sp-5) var(--gutter) var(--sp-16);gap:var(--sp-8)}
  .land-left{flex-basis:100%;position:static}
  .lcard{padding:var(--sp-6) var(--sp-5) var(--sp-5);border-radius:var(--r-lg)}
  .land-title{font-size:var(--fs-h2)}
  .land-sub{font-size:var(--fs-small);margin-bottom:var(--sp-5);max-width:none}
  .backup-note{display:none}
  .map-grid{grid-template-columns:repeat(2,1fr);gap:var(--sp-3)}
  .mc-radar{aspect-ratio:16/11}
  .mc-radar img.mc-logo{width:34px;height:34px}
  .rh-guide{flex-basis:100%;margin-left:0;font-size:var(--fs-caption)}
  .land-cloud{left:var(--gutter);bottom:var(--sp-3)}
}

/* ══════════════════════════════════════════════════════════════════════════
   战术视图
   ══════════════════════════════════════════════════════════════════════════ */
#gameView{position:fixed;inset:0;display:block;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity var(--t-4) var(--e-out),visibility 0s linear var(--t-4);
  background:
    radial-gradient(ellipse 1050px 680px at 40% 40%,rgba(255,255,255,.60),transparent 62%),
    radial-gradient(90% 80% at 88% 12%,rgba(205,234,241,.42),rgba(205,234,241,0) 62%),
    linear-gradient(168deg,#F8FAFD 0%,#EAF0F6 45%,#DEE6F0 100%)}
#gameView.active{opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity var(--t-4) var(--e-out),visibility 0s}
#mapCanvas{position:absolute;inset:0;height:100%;display:block;width:calc(100vw - var(--panel-w))}
#labels3d{width:calc(100vw - var(--panel-w));right:var(--panel-w)}
/* 赛博 HUD 装饰按新体系移除 */
.hud-corner,.scan-line,.status-bar{display:none}

/* ── 顶栏：悬浮玻璃工具条，只盖地图区不压右侧面板 ── */
.top-bar{position:fixed;top:10px;left:12px;right:calc(var(--panel-w) + 12px);z-index:20;
  display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-2);padding:var(--sp-2) 10px;
  border-radius:var(--r-lg);pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.84));
  border:1px solid var(--glass-line);box-shadow:var(--sh-3);
  -webkit-backdrop-filter:var(--blur-3);backdrop-filter:var(--blur-3)}
.top-bar>*{pointer-events:auto}
.back-btn{width:36px;height:36px;border-radius:var(--r-md);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--text-2);
  transition:color var(--t-2) var(--e-snap),border-color var(--t-2) var(--e-snap),
             background var(--t-2) var(--e-snap),transform var(--t-1) var(--e-snap)}
.back-btn:hover{border-color:var(--acc-300);color:var(--acc-500);background:#fff}
.back-btn:active{transform:scale(.92)}
.back-btn svg{width:18px;height:18px}
.top-title{font-size:var(--fs-body);font-weight:var(--fw-display);letter-spacing:var(--ls-tight);
  color:var(--text)}
.top-tag{font-size:var(--fs-micro);font-weight:var(--fw-med);color:var(--text-3);margin-top:1px}
.tb-btn{height:36px;padding:0 var(--sp-3);border-radius:var(--r-md);
  display:flex;align-items:center;gap:var(--sp-1);cursor:pointer;
  font-size:var(--fs-caption);font-weight:var(--fw-bold);color:var(--text-2);
  background:rgba(255,255,255,.66);border:1px solid var(--glass-line);box-shadow:var(--sh-1);
  transition:all var(--t-2) var(--e-snap)}
.tb-btn:hover{background:#fff;color:var(--acc-500);border-color:var(--acc-300);box-shadow:var(--sh-2)}
.tb-btn.on{background:linear-gradient(135deg,var(--acc-500),var(--acc-700));color:#fff;
  border-color:transparent;box-shadow:var(--sh-acc)}
.tb-btn:active{transform:scale(.94)}
.tb-btn svg{width:14px;height:14px}
.tb-search{display:flex;align-items:center;justify-content:center;width:36px;height:36px;
  flex:none;margin-right:var(--sp-1);border-radius:var(--r-md);cursor:pointer;
  color:var(--acc-500);background:rgba(255,255,255,.66);border:1px solid var(--glass-line);
  transition:all var(--t-2) var(--e-snap)}
.tb-search:hover{background:var(--acc-50);border-color:var(--acc-300)}
.tb-search:active{transform:scale(.94)}
.tb-search>svg{width:18px;height:18px}
/* 桌面：容器不参与布局，孩子直接排进顶栏 flex 行（与改造前逐像素一致） */
.tb-scroll{display:contents}

/* 道具类型筛选：激活态用白底 + 品牌描边，不再是「灰图标消失术」 */
.type-filter{display:flex;gap:3px;align-items:center;padding:3px;border-radius:var(--r-md);
  background:rgba(18,28,43,.04);border:1px solid transparent}
.tf-btn{width:38px;height:38px;padding:0;border:0;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:transparent;opacity:.4;filter:grayscale(.5);
  transition:all var(--t-2) var(--e-snap)}
.tf-btn:hover{opacity:.85;filter:none;background:rgba(255,255,255,.75)}
.tf-btn.active{opacity:1;filter:none;background:#fff;
  box-shadow:0 0 0 1.5px rgba(13,124,153,.38),var(--sh-1)}
.tf-btn:active{transform:scale(.92)}
.tf-btn img{width:21px;height:21px;pointer-events:none}

/* 分段切换：阵营 / 楼层 / 地图风格，同一套形状，靠颜色区分语义 */
.faction-tog{display:flex;padding:3px;gap:2px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--line)}
.faction-btn{padding:6px var(--sp-3);border:0;border-radius:var(--r-sm);cursor:pointer;
  background:none;font-family:inherit;font-size:var(--fs-caption);font-weight:var(--fw-bold);
  color:var(--text-3);transition:all var(--t-2) var(--e-snap)}
.faction-btn:hover{color:var(--text)}
.faction-btn.ct-on{color:var(--ct-ink);background:#fff;box-shadow:var(--sh-1),inset 0 0 0 1px rgba(37,99,235,.22)}
.faction-btn.t-on{color:var(--t-ink);background:#fff;box-shadow:var(--sh-1),inset 0 0 0 1px rgba(217,119,6,.26)}
.faction-btn.lv-on{color:var(--acc-600);background:#fff;box-shadow:var(--sh-1),inset 0 0 0 1px rgba(13,124,153,.24)}
.faction-btn.sty-on{color:var(--acc-600);background:#fff;box-shadow:var(--sh-1),inset 0 0 0 1px rgba(13,124,153,.24)}
.faction-btn[disabled]{opacity:.45;cursor:default}
.faction-btn:not([disabled]):active{transform:scale(.94)}

/* 地图重绘占位 */
.map-loading{position:fixed;top:0;left:0;height:100%;width:calc(100vw - var(--panel-w));
  z-index:8;pointer-events:none;opacity:0;display:flex;align-items:center;justify-content:center;
  transition:opacity var(--t-3) var(--e-out)}
.map-loading.show{opacity:1}
.map-loading::before{content:"";position:absolute;inset:0;background-size:220% 100%;
  background:linear-gradient(110deg,rgba(246,248,251,0) 30%,rgba(255,255,255,.55) 50%,rgba(246,248,251,0) 70%);
  animation:shimmer 1.25s var(--e-out) infinite}
.ml-chip{display:flex;align-items:center;gap:var(--sp-2);padding:9px var(--sp-4);
  border-radius:var(--r-md);font-size:var(--fs-caption);font-weight:var(--fw-bold);color:var(--text-2);
  background:rgba(255,255,255,.82);border:1px solid var(--glass-line);box-shadow:var(--sh-2);
  -webkit-backdrop-filter:var(--blur-2);backdrop-filter:var(--blur-2)}
.ml-spin{width:15px;height:15px;border-radius:50%;
  border:2px solid var(--acc-100);border-top-color:var(--acc-500);animation:spin .7s linear infinite}
@media(prefers-reduced-motion:reduce){.map-loading::before{animation:none}.ml-spin{animation-duration:1.4s}}

/* ── 面板折叠拉手 + 拖宽把手 ── */
#panelEdgeBtn{position:fixed;top:50%;right:var(--panel-w);transform:translateY(-50%);z-index:18;
  width:24px;height:64px;border-radius:var(--r-md) 0 0 var(--r-md);cursor:pointer;
  display:none;align-items:center;justify-content:center;color:var(--text-2);
  background:rgba(255,255,255,.94);border:1px solid var(--glass-line);border-right:0;
  box-shadow:-4px 0 18px rgba(18,28,43,.14);
  -webkit-backdrop-filter:var(--blur-1);backdrop-filter:var(--blur-1);
  transition:right var(--t-3) var(--e-out),color var(--t-2) var(--e-snap),
             background var(--t-2) var(--e-snap)}
#panelEdgeBtn:hover{color:var(--acc-500);background:#fff}
#panelEdgeBtn svg{width:16px;height:16px;transition:transform var(--t-3) var(--e-out)}
#panelEdgeBtn.collapsed svg{transform:rotate(180deg)}
#panelGrip{position:fixed;top:60px;bottom:0;right:var(--panel-w);width:20px;z-index:17;
  transform:translateX(50%);cursor:col-resize;display:none;touch-action:none}
#panelGrip::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;
  transform:translateX(-50%);background:var(--ink-200);transition:background var(--t-2) var(--e-snap)}
#panelGrip::after{content:"";position:absolute;top:50%;left:50%;width:4px;height:32px;
  transform:translate(-50%,-50%);border-radius:2px;background:var(--ink-300);
  box-shadow:-4px 0 0 var(--ink-300),4px 0 0 var(--ink-300);
  transition:background var(--t-2) var(--e-snap),box-shadow var(--t-2) var(--e-snap)}
#panelGrip:hover::before,#panelGrip.drag::before{background:var(--acc-500)}
#panelGrip:hover::after,#panelGrip.drag::after{background:var(--acc-500);
  box-shadow:-4px 0 0 var(--acc-500),4px 0 0 var(--acc-500)}
body.panel-collapsed #detailOv{display:none}

/* ══════════════════════════════════════════════════════════════════════════
   右侧操作栏（使用 / 编辑）—— 常驻侧栏，不打断视焦
   ══════════════════════════════════════════════════════════════════════════ */
.detail-ov{position:fixed;inset:auto;top:0;right:0;bottom:0;width:var(--panel-w);height:100%;
  z-index:16;display:block;pointer-events:auto;background:none}
.detail-bg,.ds-handle{display:none}
.detail-sheet{position:absolute;inset:0;width:100%;height:100%;overflow-y:auto;
  padding:var(--sp-4) var(--sp-4) calc(var(--sp-5) + var(--safe-b));
  border:0;border-left:1px solid var(--glass-line);
  background:linear-gradient(180deg,rgba(255,255,255,.90),rgba(247,250,254,.82));
  -webkit-backdrop-filter:var(--blur-3);backdrop-filter:var(--blur-3);
  box-shadow:-14px 0 44px rgba(18,28,43,.10)}
.edit-ov{position:fixed;inset:0;z-index:50;display:none;pointer-events:none}
.edit-ov.open{display:block}
.edit-sheet.detail-sheet{position:fixed;inset:auto;top:0;right:0;bottom:0;left:auto;
  width:var(--panel-w);height:100%;z-index:50;pointer-events:auto;
  padding:var(--sp-4) var(--sp-5) calc(var(--sp-4) + var(--safe-b));
  background:linear-gradient(180deg,rgba(255,255,255,.93),rgba(247,250,254,.86));
  box-shadow:-16px 0 48px rgba(18,28,43,.13);
  animation:sheetIn var(--t-3) var(--e-out)}

.op-head{padding:0 2px var(--sp-3);border-bottom:1px solid var(--line);margin-bottom:var(--sp-3)}
.op-head .op-title{font-size:var(--fs-lead);font-weight:var(--fw-bold);
  letter-spacing:var(--ls-tight);color:var(--text)}
.op-head .op-sub{font-size:var(--fs-caption);color:var(--text-3);margin-top:2px}
.op-toggle{display:flex;gap:3px;padding:3px;margin-bottom:var(--sp-2);
  border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.op-toggle button{flex:1;padding:7px 0;border:0;border-radius:var(--r-sm);cursor:pointer;
  background:none;font-size:var(--fs-caption);font-weight:var(--fw-bold);color:var(--text-3);
  transition:all var(--t-2) var(--e-snap)}
.op-toggle button:hover{color:var(--text)}
.op-toggle button.on{background:#fff;color:var(--acc-600);box-shadow:var(--sh-1)}
/* 编辑区分块：玻璃圆角卡，错峰入场 */
.op-sec{margin-bottom:var(--sp-3);padding:var(--sp-4);border-radius:var(--r-lg);
  background:rgba(255,255,255,.58);border:1px solid var(--glass-line);box-shadow:var(--sh-1);
  -webkit-backdrop-filter:var(--blur-1);backdrop-filter:var(--blur-1);
  animation:secIn var(--t-4) var(--e-out) both}
.op-sec:nth-child(2){animation-delay:50ms}
.op-sec:nth-child(3){animation-delay:120ms}
.op-sec:nth-child(4){animation-delay:190ms}
.op-sec-h{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-1);
  margin-bottom:var(--sp-2);font-size:var(--fs-small);font-weight:var(--fw-bold);color:var(--text)}
.op-sec-h>span{display:flex;gap:var(--sp-1)}
.op-add{padding:7px var(--sp-3);border-radius:var(--r-md);cursor:pointer;white-space:nowrap;
  border:1px solid transparent;font-size:var(--fs-caption);font-weight:var(--fw-bold);color:#fff;
  background:linear-gradient(135deg,var(--acc-500),var(--acc-700));box-shadow:var(--sh-acc);
  transition:transform var(--t-2) var(--e-snap),box-shadow var(--t-2) var(--e-snap)}
.op-add:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(13,124,153,.40)}
.op-add:active{transform:scale(.95)}
.op-add.ghost{background:rgba(255,255,255,.8);color:var(--text-2);
  border-color:var(--line-strong);box-shadow:var(--sh-1)}
.op-add.ghost:hover{color:var(--acc-500);border-color:var(--acc-300)}
.op-batch{display:flex;gap:var(--sp-1);margin-bottom:var(--sp-2);flex-wrap:wrap}
.op-batch button{padding:6px 10px;border-radius:var(--r-sm);cursor:pointer;
  border:1px solid var(--line-strong);background:#fff;
  font-size:var(--fs-micro);font-weight:var(--fw-bold);color:var(--text-2);
  transition:all var(--t-2) var(--e-snap)}
.op-batch button:hover{border-color:var(--warn);color:var(--warn-ink);transform:translateY(-1px)}
.op-batch button.on{background:rgba(217,119,6,.12);border-color:var(--warn);color:var(--warn-ink)}
.op-batch button.ghost{color:var(--text-3)}
.op-empty{padding:var(--sp-4);text-align:center;font-size:var(--fs-caption);color:var(--text-3);
  line-height:var(--lh-body);border:1px dashed var(--line-strong);border-radius:var(--r-md)}
.op-hint{margin:2px 0 9px;padding:8px 10px;border-radius:var(--r-sm);
  font-size:var(--fs-micro);line-height:var(--lh-snug);color:var(--text-3);background:var(--surface-2)}
.op-hint b{color:var(--acc-600);font-weight:var(--fw-display)}
.op-grouplabel{display:flex;align-items:center;gap:var(--sp-1);margin:var(--sp-3) 2px var(--sp-1);
  font-size:var(--fs-micro);font-weight:var(--fw-display);letter-spacing:var(--ls-wide);
  color:var(--text-3)}
.op-grouplabel i{width:9px;height:9px;border-radius:50%;display:inline-block}

.edit-tabs{display:flex;gap:var(--sp-1);padding:4px;margin-bottom:var(--sp-3);
  border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.edit-tabs .etab{flex:1;display:flex;align-items:center;justify-content:center;gap:var(--sp-1);
  padding:9px 6px;border:0;border-radius:var(--r-sm);cursor:pointer;white-space:nowrap;
  background:transparent;font-size:var(--fs-small);font-weight:var(--fw-bold);color:var(--text-3);
  transition:all var(--t-2) var(--e-snap)}
.edit-tabs .etab i{font-style:normal;min-width:18px;height:18px;padding:0 4px;
  display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-xs);
  font-size:var(--fs-micro);font-weight:var(--fw-display);
  background:var(--ink-200);color:var(--text-3)}
.edit-tabs .etab:hover{color:var(--text)}
.edit-tabs .etab.on{background:#fff;color:var(--acc-600);box-shadow:var(--sh-1)}
.edit-tabs .etab.on i{background:var(--acc-500);color:#fff}

/* 空闲态：统计条 + 道具瓷片 */
.idle-hero{padding:2px 2px var(--sp-3)}
.idle-tag{font-family:var(--mono);font-size:var(--fs-micro);letter-spacing:var(--ls-wide);
  font-weight:var(--fw-bold);color:var(--acc-500)}
.idle-title{margin-top:var(--sp-1);font-size:var(--fs-h4);font-weight:var(--fw-bold);
  letter-spacing:var(--ls-tight);color:var(--text)}
.idle-sub{margin-top:5px;font-size:var(--fs-caption);line-height:var(--lh-snug);color:var(--text-3)}
.idle-statrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:var(--sp-2) var(--sp-3);margin-bottom:9px;border-radius:var(--r-md);
  background:rgba(255,255,255,.66);border:1px solid var(--glass-line);box-shadow:var(--sh-1)}
.ist{font-size:var(--fs-caption);font-weight:var(--fw-med);color:var(--text-2);white-space:nowrap}
.ist b{margin-right:3px;font-family:var(--mono);font-size:var(--fs-lead);
  font-weight:var(--fw-display);color:var(--text);letter-spacing:-.5px}
.ist-sep{width:1px;height:20px;background:var(--line-strong)}
.ist-utils{display:flex;gap:11px;margin-left:auto;flex-wrap:wrap}
.ist-u{display:flex;align-items:center;gap:5px;font-size:var(--fs-caption);
  font-weight:var(--fw-bold);color:var(--text-2)}
.ist-u i{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.idle-list-h{margin:var(--sp-1) 0 var(--sp-2);font-size:var(--fs-micro);
  font-weight:var(--fw-bold);letter-spacing:var(--ls-wide);color:var(--text-3)}
.idle-list{display:grid;gap:var(--sp-2);margin-bottom:2px;
  grid-template-columns:repeat(auto-fill,minmax(138px,1fr))}
.idle-item{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-1);
  min-height:70px;padding:var(--sp-3);border-radius:var(--r-md);cursor:pointer;
  background:rgba(255,255,255,.76);border:1px solid var(--glass-line);
  --mx:50%;--my:50%;
  transition:transform var(--t-2) var(--e-snap),box-shadow var(--t-2) var(--e-snap),
             border-color var(--t-2) var(--e-snap),background var(--t-2) var(--e-snap)}
/* 瓷片只做光晕不做倾角：128px 的小块上做 3D 倾角读起来是抖动不是质感 */
.idle-item::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  opacity:0;transition:opacity var(--t-3) var(--e-out);
  background:radial-gradient(circle 150px at var(--mx) var(--my),
             rgba(13,124,153,.16),rgba(13,124,153,0) 70%)}
.idle-item.hot::after{opacity:1}
.idle-item:hover{background:#fff;border-color:rgba(13,124,153,.4);
  box-shadow:0 9px 22px rgba(13,124,153,.14);transform:translateY(-3px)}
.idle-item:active{transform:scale(.97)}
.idle-item .ii-ic{width:25px;height:25px;flex-shrink:0;object-fit:contain;
  filter:drop-shadow(0 1px 2px rgba(18,28,43,.18))}
.idle-item .ii-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.idle-item .ii-name{width:100%;font-size:var(--fs-small);font-weight:var(--fw-bold);
  line-height:1.28;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.idle-item .ii-tag{display:inline-block;margin:2px 4px 0 0;padding:1px 6px;
  border-radius:var(--r-xs);vertical-align:middle;
  font-size:10px;font-weight:var(--fw-bold);color:var(--acc-600);background:var(--acc-50)}
.idle-item .ii-n{margin-top:auto;padding:2px var(--sp-2);border-radius:var(--r-xs);
  font-size:10px;font-weight:var(--fw-bold);color:var(--text-2);background:var(--surface-2)}
.idle-item .ii-del{position:absolute;top:6px;right:6px;width:22px;height:22px;opacity:0;
  display:flex;align-items:center;justify-content:center;border-radius:var(--r-xs);cursor:pointer;
  font-size:var(--fs-micro);color:var(--text-3);
  background:rgba(255,255,255,.9);border:1px solid var(--line-strong);
  transition:all var(--t-1) var(--e-snap)}
.idle-item:hover .ii-del{opacity:1}
.idle-item .ii-del:hover{background:rgba(220,38,38,.1);border-color:var(--danger);color:var(--danger)}
.idle-item .nu-btn{margin-top:6px;align-self:stretch;text-align:center}
.idle-empty{padding:var(--sp-8) var(--sp-4);text-align:center;
  font-size:var(--fs-small);line-height:var(--lh-body);color:var(--text-3);
  border:1px dashed var(--line-strong);border-radius:var(--r-lg)}
.idle-collapse{position:absolute;top:14px;right:16px;z-index:2;height:26px;padding:0 10px;
  border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-micro);font-weight:var(--fw-bold);
  color:var(--text-2);background:rgba(255,255,255,.7);border:1px solid var(--glass-line);
  transition:all var(--t-2) var(--e-snap)}
.idle-collapse:hover{color:var(--acc-500);border-color:var(--acc-300)}
.panel-reopen{position:fixed;right:14px;bottom:78px;z-index:19;height:34px;padding:0 14px;
  border-radius:var(--r-md);cursor:pointer;align-items:center;
  font-size:var(--fs-caption);font-weight:var(--fw-display);color:var(--acc-600);
  background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--sh-2);
  -webkit-backdrop-filter:var(--blur-2);backdrop-filter:var(--blur-2)}
.panel-reopen:hover{background:#fff;transform:translateY(-1px)}

/* 需更新标记 */
.nu-btn{flex-shrink:0;padding:3px 9px;border-radius:var(--r-xs);cursor:pointer;white-space:nowrap;
  font-size:10px;font-weight:var(--fw-bold);color:var(--text-3);
  background:#fff;border:1px solid var(--line-strong);transition:all var(--t-2) var(--e-snap)}
.nu-btn:hover{border-color:var(--warn);color:var(--warn-ink)}
.nu-btn.on{background:rgba(217,119,6,.12);border-color:var(--warn);color:var(--warn-ink)}
.nu-banner{margin:0 0 var(--sp-3);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);
  font-size:var(--fs-caption);font-weight:var(--fw-bold);color:var(--warn-ink);
  background:rgba(217,119,6,.10);border:1px solid rgba(217,119,6,.3)}

/* ══════════════════════════════════════════════════════════════════════════
   详情内容
   ══════════════════════════════════════════════════════════════════════════ */
.ds-title{font-size:var(--fs-h4);font-weight:var(--fw-bold);
  letter-spacing:var(--ls-tight);margin-bottom:var(--sp-1)}
.ds-badges{display:flex;gap:var(--sp-1);margin-bottom:var(--sp-3);flex-wrap:wrap}
.ds-badge{padding:3px 10px;border-radius:var(--r-xs);
  font-size:var(--fs-micro);font-weight:var(--fw-bold)}
.ds-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.ds-cell{padding:10px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line)}
.ds-cell-label{font-size:var(--fs-micro);color:var(--text-3);letter-spacing:.02em}
.ds-cell-val{margin-top:3px;font-size:var(--fs-small);font-weight:var(--fw-bold)}
.ds-desc{padding:var(--sp-2) 0;border-top:1px solid var(--line);
  font-size:var(--fs-small);line-height:var(--lh-body);color:var(--text-2)}
.ds-desc b{color:var(--acc-600);font-weight:var(--fw-bold)}
.ds-actions{display:flex;gap:7px;align-items:center;flex-shrink:0}
.ds-act-sep{width:1px;height:20px;flex-shrink:0;margin:0 1px;background:var(--line-strong)}
.icon-btn{width:28px;height:28px;border-radius:var(--r-sm);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-body);
  background:#fff;border:1px solid var(--line-strong);color:var(--text-2);
  transition:all var(--t-2) var(--e-snap)}
.icon-btn:hover{border-color:var(--acc-300);color:var(--acc-500)}
.icon-btn:active{transform:scale(.92)}
.ds-actions .icon-btn{width:33px;height:33px;border-radius:var(--r-md)}
.ds-actions .icon-btn svg{width:15px;height:15px}
.icon-btn.ib-edit{background:linear-gradient(135deg,var(--acc-500),var(--acc-700));
  border-color:transparent;color:#fff;box-shadow:var(--sh-acc)}
.icon-btn.ib-edit:hover{filter:brightness(1.08);color:#fff;
  box-shadow:0 8px 22px rgba(13,124,153,.36)}
.icon-btn.ib-del{color:var(--danger);border-color:rgba(220,38,38,.34)}
.icon-btn.ib-del:hover{background:rgba(220,38,38,.1);border-color:var(--danger);color:var(--danger)}

.throw-banner{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;
  margin:0 0 var(--sp-3);padding:10px var(--sp-4);border-radius:var(--r-md);color:#fff;
  background:linear-gradient(135deg,var(--acc-500),var(--acc-700));box-shadow:var(--sh-acc)}
.throw-banner::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:rgba(255,255,255,.35)}
.throw-banner .tb-k{font-size:var(--fs-micro);font-weight:var(--fw-bold);opacity:.85;
  letter-spacing:var(--ls-wide)}
.throw-banner .tb-v{margin-left:auto;font-size:var(--fs-lead);font-weight:var(--fw-display)}

.prop-switch{display:flex;gap:var(--sp-1);flex-wrap:wrap;margin:0 0 var(--sp-3)}
.prop-switch button{display:flex;align-items:center;gap:var(--sp-1);
  padding:6px var(--sp-3);border-radius:var(--r-md);cursor:pointer;
  font-size:var(--fs-small);font-weight:var(--fw-bold);color:var(--text-2);
  background:#fff;border:1px solid var(--line-strong);transition:all var(--t-2) var(--e-snap)}
.prop-switch button i{width:9px;height:9px;border-radius:50%;display:inline-block}
.prop-switch button:hover{border-color:var(--acc-300);color:var(--acc-500)}
.prop-switch button.on{background:linear-gradient(135deg,var(--acc-500),var(--acc-700));
  color:#fff;border-color:transparent;box-shadow:var(--sh-acc)}
.prop-switch button.on i{box-shadow:0 0 0 2px rgba(255,255,255,.6)}

/* 详情图：3 张大图，完整显示不裁切（实战描点用） */
.ds-imgs{display:grid;grid-template-columns:1fr;gap:var(--sp-3);margin:10px 0 var(--sp-1)}
.ds-img{position:relative;aspect-ratio:16/9;overflow:hidden;cursor:zoom-in;
  border-radius:var(--r-md);border:1px solid var(--line);box-shadow:var(--sh-1);
  background:linear-gradient(110deg,var(--ink-100) 30%,var(--ink-50) 50%,var(--ink-100) 70%);
  background-size:220% 100%;animation:shimmer 1.3s var(--e-out) infinite;
  transition:border-color var(--t-3) var(--e-out),box-shadow var(--t-3) var(--e-out)}
.ds-img:hover{border-color:var(--acc-300);box-shadow:var(--sh-2)}
.ds-img img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;
  transition:opacity var(--t-4) var(--e-out),transform var(--t-5) var(--e-out)}
.ds-img img.loaded{opacity:1}
.ds-img.loaded{animation:none;background:var(--ink-800)}
.ds-img.loaded:hover img{transform:scale(1.03)}
.ds-img.img-fail{animation:none;cursor:default;background:var(--ink-100)}
.ds-img.img-fail::after{content:'图片加载失败';position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);font-size:var(--fs-caption)}
.ds-img.img-fail img{display:none}
.ds-img .di-label{position:absolute;top:8px;left:8px;padding:4px 10px;border-radius:var(--r-xs);
  pointer-events:none;font-size:var(--fs-micro);font-weight:var(--fw-bold);
  letter-spacing:var(--ls-wide);color:#fff;background:rgba(18,28,43,.74)}
.ds-img .di-throw{position:absolute;top:8px;right:8px;padding:5px 11px;border-radius:var(--r-sm);
  pointer-events:none;font-size:var(--fs-small);font-weight:var(--fw-display);color:#fff;
  background:linear-gradient(135deg,var(--acc-500),var(--acc-700));box-shadow:var(--sh-2)}
.ds-noimg{margin:6px 0;padding:var(--sp-8);text-align:center;
  font-size:var(--fs-caption);color:var(--text-3);
  border:1px dashed var(--line-strong);border-radius:var(--r-md)}

/* ══════════════════════════════════════════════════════════════════════════
   表单 —— 原生控件全部重绘
   ══════════════════════════════════════════════════════════════════════════ */
.eh-tip{margin:0 0 var(--sp-3);padding:9px 11px;border-radius:var(--r-sm);
  font-size:var(--fs-micro);line-height:var(--lh-snug);color:var(--text-2);
  background:var(--surface-2);border:1px solid var(--line)}
.eh-tip b{color:var(--acc-600)}
.eh-tip .eh-land{color:var(--u-fire-ink)}
.ef-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ef-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.ef-field.full{grid-column:1/-1}
.ef-label{font-size:var(--fs-caption);font-weight:var(--fw-bold);color:var(--text-2)}
.ef-input,.ef-select{width:100%;height:42px;padding:0 var(--sp-3);border-radius:var(--r-sm);
  font-size:var(--fs-body);font-weight:var(--fw-med);outline:none;
  background:var(--surface);border:1.5px solid var(--line-strong);color:var(--text);
  transition:border-color var(--t-2) var(--e-snap),box-shadow var(--t-2) var(--e-snap)}
.ef-input::placeholder{color:var(--text-3);font-weight:var(--fw-body)}
.ef-input:hover,.ef-select:hover{border-color:var(--ink-300)}
.ef-input:focus,.ef-select:focus{border-color:var(--acc-500);box-shadow:0 0 0 3px var(--acc-50)}
.ef-input.ef-err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.10)}
.ef-row{display:flex;gap:var(--sp-2);margin-top:var(--sp-4)}
.ef-save{flex:1;padding:12px;border-radius:var(--r-md);cursor:pointer;border:0;
  font-family:inherit;font-size:var(--fs-body);font-weight:var(--fw-bold);color:#fff;
  background:linear-gradient(135deg,var(--acc-500),var(--acc-700));box-shadow:var(--sh-acc);
  transition:transform var(--t-2) var(--e-snap),box-shadow var(--t-2) var(--e-snap)}
.ef-save:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(13,124,153,.38)}
.ef-save:active{transform:scale(.98)}
.ef-del{padding:12px var(--sp-4);border-radius:var(--r-md);cursor:pointer;font-family:inherit;
  font-size:var(--fs-small);font-weight:var(--fw-bold);color:var(--danger);
  background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.3);
  transition:all var(--t-2) var(--e-snap)}
.ef-del:hover{background:rgba(220,38,38,.12);border-color:var(--danger)}

/* —— 下拉重绘：原生 select 留在 DOM（.value / change 不变），外壳由 JS 生成 —— */
.sel-wrap{position:relative}
.sel-wrap>select.ef-select{position:absolute;inset:0;width:100%;height:100%;
  opacity:0;pointer-events:none;-webkit-appearance:none;appearance:none}
.sel-btn{display:flex;align-items:center;gap:var(--sp-2);width:100%;height:42px;
  padding:0 var(--sp-3);border-radius:var(--r-sm);cursor:pointer;text-align:left;
  font-size:var(--fs-body);font-weight:var(--fw-med);color:var(--text);
  background:var(--surface);border:1.5px solid var(--line-strong);
  transition:border-color var(--t-2) var(--e-snap),box-shadow var(--t-2) var(--e-snap)}
.sel-btn:hover{border-color:var(--ink-300)}
.sel-btn .sel-val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-btn .sel-caret{flex:none;width:16px;height:16px;color:var(--text-3);
  transition:transform var(--t-2) var(--e-out)}
.sel-wrap.open .sel-btn{border-color:var(--acc-500);box-shadow:0 0 0 3px var(--acc-50)}
.sel-wrap.open .sel-caret{transform:rotate(180deg);color:var(--acc-500)}
.sel-list{position:absolute;z-index:60;left:0;right:0;top:calc(100% + 6px);display:none;
  max-height:260px;overflow-y:auto;padding:5px;border-radius:var(--r-md);
  background:rgba(255,255,255,.95);border:1px solid var(--line);box-shadow:var(--sh-4);
  -webkit-backdrop-filter:var(--blur-2);backdrop-filter:var(--blur-2)}
.sel-wrap.open .sel-list{display:block;animation:popIn var(--t-2) var(--e-out)}
.sel-wrap.up .sel-list{top:auto;bottom:calc(100% + 6px)}
.sel-opt{display:flex;align-items:center;gap:var(--sp-2);padding:9px var(--sp-3);
  border-radius:var(--r-sm);cursor:pointer;
  font-size:var(--fs-small);font-weight:var(--fw-med);color:var(--text);
  transition:background var(--t-1) linear}
.sel-opt:hover,.sel-opt.cur{background:var(--surface-2)}
.sel-opt.on{background:var(--acc-50);color:var(--acc-600);font-weight:var(--fw-bold)}
.sel-opt .tick{margin-left:auto;opacity:0;color:var(--acc-500);font-weight:var(--fw-bold)}
.sel-opt.on .tick{opacity:1}
.sel-group{padding:9px var(--sp-3) 4px;font-size:var(--fs-micro);font-weight:var(--fw-bold);
  letter-spacing:var(--ls-wide);color:var(--text-3)}

/* —— 滑杆重绘：轨道 / 已填 / 滑块三段自绘，Chrome + Firefox 双写 —— */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;
  background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:var(--r-full);
  background:linear-gradient(90deg,var(--acc-500) 0 var(--fill,50%),var(--ink-150) var(--fill,50%) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
  margin-top:-5.5px;border-radius:50%;background:#fff;border:1.5px solid var(--acc-500);
  box-shadow:0 1px 4px rgba(18,28,43,.22);
  transition:transform var(--t-1) var(--e-snap),box-shadow var(--t-1) var(--e-snap)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.05);
  box-shadow:0 0 0 6px rgba(13,124,153,.16)}
input[type=range]::-moz-range-track{height:5px;border-radius:var(--r-full);background:var(--ink-150)}
input[type=range]::-moz-range-progress{height:5px;border-radius:var(--r-full);background:var(--acc-500)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;
  border:1.5px solid var(--acc-500);box-shadow:0 1px 4px rgba(18,28,43,.22)}

/* 轨迹编辑 */
.ef-traj{padding:var(--sp-3);border-radius:var(--r-md);
  background:var(--acc-50);border:1px solid rgba(13,124,153,.16)}
.traj-sl{display:flex;align-items:center;gap:9px;margin-bottom:10px;
  font-size:var(--fs-micro);font-weight:var(--fw-bold);color:var(--text-2)}
.traj-sl input[type=range]{flex:1}
.traj-sl b{min-width:34px;text-align:right;font-family:var(--mono);color:var(--acc-600)}
.traj-via{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.traj-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:var(--r-sm);
  font-size:var(--fs-caption);font-weight:var(--fw-bold);color:#fff;
  background:linear-gradient(135deg,var(--acc-300),var(--acc-600));box-shadow:var(--sh-1)}
.traj-chip i{font-style:normal;cursor:pointer;opacity:.85;font-size:var(--fs-micro);padding:0 1px;
  transition:transform var(--t-1) var(--e-snap)}
.traj-chip i:hover{opacity:1;transform:scale(1.2)}
.ef-hint{margin-top:9px;font-size:var(--fs-micro);line-height:var(--lh-snug);color:var(--text-3)}
.ef-hint b{font-weight:var(--fw-display)}

/* 标签 */
.tag-pick{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tag-chip{display:inline-flex;align-items:center;gap:3px;padding:5px var(--sp-3);
  border-radius:var(--r-sm);cursor:pointer;-webkit-user-select:none;user-select:none;
  font-size:var(--fs-caption);font-weight:var(--fw-bold);color:var(--text-2);
  background:var(--surface-2);border:1px solid transparent;
  transition:all var(--t-2) var(--e-snap)}
.tag-chip:hover{background:var(--surface-3)}
.tag-chip.on{color:#fff;border-color:transparent;
  background:linear-gradient(135deg,var(--acc-500),var(--acc-700));box-shadow:var(--sh-1)}
.tag-chip.act{color:var(--acc-600);background:var(--acc-50);
  border:1px dashed rgba(13,124,153,.45)}
.tag-chip.act.ghost{color:var(--text-3);background:transparent;border-color:var(--line-strong)}
.tag-chip.mng{color:var(--text);background:var(--surface-3)}
.tag-chip.mng i{font-style:normal;opacity:.55;font-size:var(--fs-micro)}
.tag-empty{font-size:var(--fs-caption);color:var(--text-3)}

/* 图片上传槽 */
.img-drop{position:relative;overflow:hidden;outline:none;aspect-ratio:16/10;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-1);
  border:1px dashed var(--line-strong);border-radius:var(--r-md);background:var(--surface-2);
  transition:all var(--t-2) var(--e-snap)}
.img-drop:hover,.img-drop:focus{border-color:var(--acc-500);background:var(--acc-50)}
.img-drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img-drop .id-x{position:absolute;top:5px;right:5px;z-index:2;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;border-radius:var(--r-xs);cursor:pointer;
  font-size:var(--fs-micro);color:var(--text-2);
  background:rgba(255,255,255,.92);border:1px solid var(--line-strong)}
.img-drop .id-x:hover{color:var(--danger);border-color:var(--danger)}
.img-drop .id-t{position:relative;z-index:1;font-size:var(--fs-micro);color:var(--text-3);
  letter-spacing:.02em}

/* ══════════════════════════════════════════════════════════════════════════
   地名 / 区域 / 出生点 列表
   ══════════════════════════════════════════════════════════════════════════ */
.pl-item2{margin-bottom:7px;padding:var(--sp-2) 9px;border-radius:var(--r-md);
  background:rgba(255,255,255,.64);border:1px solid var(--glass-line);
  animation:secIn var(--t-3) var(--e-out) both}
.pl-top{display:flex;align-items:center;gap:var(--sp-1)}
.pl-name{flex:1;min-width:0;padding:6px var(--sp-2);border-radius:var(--r-sm);outline:none;
  font-size:var(--fs-small);font-family:inherit;color:var(--text);
  background:#fff;border:1px solid var(--line-strong);
  transition:border-color var(--t-2) var(--e-snap),box-shadow var(--t-2) var(--e-snap)}
.pl-name:focus{border-color:var(--acc-500);box-shadow:0 0 0 3px var(--acc-50)}
.pl-tag{flex-shrink:0;padding:2px 7px;border-radius:var(--r-xs);
  font-size:10px;font-weight:var(--fw-display);color:var(--acc-600);background:var(--acc-50)}
.pl-del{flex-shrink:0;padding:6px 10px;border-radius:var(--r-sm);cursor:pointer;
  font-size:var(--fs-micro);font-weight:var(--fw-med);color:var(--text-3);
  background:#fff;border:1px solid var(--line-strong);transition:all var(--t-2) var(--e-snap)}
.pl-del:hover{border-color:var(--danger);color:var(--danger);background:rgba(220,38,38,.06)}
.pl-adj{flex-shrink:0;width:26px;height:26px;border-radius:var(--r-sm);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-micro);
  color:var(--text-3);background:#fff;border:1px solid var(--line-strong);
  transition:all var(--t-2) var(--e-snap)}
.pl-adj:hover{border-color:var(--acc-300);color:var(--acc-500)}
.pl-item2.expanded .pl-adj{transform:rotate(180deg);color:var(--acc-500);border-color:var(--acc-300)}
.pl-count{margin:0 2px var(--sp-2);font-size:var(--fs-micro);font-weight:var(--fw-med);color:var(--text-3)}
.pl-sliders{display:none;flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);margin-top:var(--sp-2);padding:0 2px}
.pl-item2.expanded .pl-sliders{display:flex}
.pl-sl{display:flex;align-items:center;gap:6px;flex:1 1 42%;min-width:104px;
  font-size:10px;font-weight:var(--fw-bold);color:var(--text-3)}
.pl-sl input[type=range]{flex:1}
.pl-batch{margin-bottom:var(--sp-3);padding:10px 11px;border-radius:var(--r-md);
  background:var(--acc-50);border:1px solid rgba(13,124,153,.18)}
.pl-batch-h{margin-bottom:var(--sp-2);font-size:var(--fs-micro);
  font-weight:var(--fw-display);color:var(--acc-700)}
.pl-batch .pl-sl{margin-bottom:6px}
.pl-batch-btns{display:flex;gap:7px;margin-top:var(--sp-1)}
.pl-batch-btns button{flex:1;padding:7px var(--sp-2);border-radius:var(--r-sm);cursor:pointer;
  font-size:var(--fs-micro);font-weight:var(--fw-bold);color:var(--acc-700);
  background:#fff;border:1px solid rgba(13,124,153,.3);transition:all var(--t-2) var(--e-snap)}
.pl-batch-btns button:hover{background:var(--acc-500);color:#fff;border-color:var(--acc-500)}
.place-list{max-height:220px;overflow-y:auto}

/* ══════════════════════════════════════════════════════════════════════════
   3D 场景上的浮层：区域标签 / 悬浮提示 / 空态
   ══════════════════════════════════════════════════════════════════════════ */
.zone-label-3d{position:absolute;padding:5px var(--sp-3);border-radius:var(--r-sm);
  pointer-events:auto;cursor:pointer;white-space:nowrap;-webkit-user-select:none;user-select:none;
  transform:translate(-50%,-50%);
  font-size:var(--fs-micro);font-weight:var(--fw-bold);color:var(--text);
  background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh-1);
  -webkit-backdrop-filter:var(--blur-1);backdrop-filter:var(--blur-1);
  transition:border-color var(--t-2) var(--e-snap),color var(--t-2) var(--e-snap),
             box-shadow var(--t-2) var(--e-snap)}
.zone-label-3d:hover{border-color:var(--acc-300);color:var(--acc-500);box-shadow:var(--sh-2)}
.zone-label-3d.sel{border-color:var(--acc-500);color:var(--acc-600);
  box-shadow:0 0 0 1px var(--acc-500),var(--sh-2)}
.zone-label-3d .zl-count{margin-left:5px;font-family:var(--mono);font-size:10px;color:var(--acc-500)}
.dot-tip{position:absolute;z-index:12;padding:6px var(--sp-3);border-radius:var(--r-sm);
  pointer-events:none;white-space:nowrap;opacity:0;transform:translate(-50%,-100%);
  font-size:var(--fs-caption);font-weight:var(--fw-med);color:var(--text-inv);
  background:rgba(18,28,43,.94);box-shadow:var(--sh-3);
  transition:opacity var(--t-2) var(--e-out),transform var(--t-2) var(--e-out)}
.dot-tip.show{opacity:1;transform:translate(-50%,-118%)}
.dot-tip .tt-type{opacity:.6;font-size:10px;margin-right:4px}
.empty-3d{position:fixed;inset:0;z-index:8;display:none;
  align-items:center;justify-content:center;pointer-events:none}
.empty-3d.show{display:flex}
.empty-3d .e3-box{padding:var(--sp-6) var(--sp-10);text-align:center;border-radius:var(--r-lg);
  background:rgba(255,255,255,.86);border:1px solid var(--glass-line);box-shadow:var(--sh-3);
  -webkit-backdrop-filter:var(--blur-2);backdrop-filter:var(--blur-2);
  animation:popIn var(--t-4) var(--e-out)}
.empty-3d .e3-title{margin-bottom:6px;font-size:var(--fs-body);font-weight:var(--fw-bold);color:var(--text-2)}
.empty-3d .e3-sub{font-size:var(--fs-micro);color:var(--text-3);letter-spacing:.02em}

/* ══════════════════════════════════════════════════════════════════════════
   浮层与模态 —— 定位逻辑：需要打断的居中+模糊，不该打断的跟随触点
   ══════════════════════════════════════════════════════════════════════════ */
/* 灯箱：全屏沉浸，遮罩最深 */
.lightbox{position:fixed;inset:0;z-index:300;display:none;cursor:zoom-out;
  align-items:center;justify-content:center;background:var(--scrim-3);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.lightbox.open{display:flex;animation:fadeIn var(--t-2) var(--e-out)}
.lightbox img{max-width:94vw;max-height:92vh;border-radius:var(--r-md);
  box-shadow:0 0 80px rgba(0,0,0,.55);animation:lbIn var(--t-4) var(--e-out)}
@keyframes lbIn{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
.lightbox .lb-cap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  font-size:var(--fs-micro);color:var(--ink-300);letter-spacing:var(--ls-wide)}
.lb-nav{position:absolute;top:50%;z-index:301;width:44px;height:44px;border-radius:50%;
  transform:translateY(-50%);cursor:pointer;-webkit-user-select:none;user-select:none;
  display:flex;align-items:center;justify-content:center;font-size:var(--fs-h3);color:#fff;
  background:rgba(18,28,43,.6);transition:all var(--t-2) var(--e-snap)}
.lb-nav:hover{background:rgba(18,28,43,.9);transform:translateY(-50%) scale(1.1)}
.lb-prev{left:20px}
.lb-next{right:20px}

/* 右键菜单：跟随触发点，从触发角展开，不打断心流 */
.ctx-menu{position:fixed;z-index:120;display:none;flex-direction:column;min-width:150px;padding:5px;
  transform-origin:top left;border-radius:var(--r-md);
  background:rgba(255,255,255,.95);border:1px solid var(--line);box-shadow:var(--sh-4);
  -webkit-backdrop-filter:var(--blur-2);backdrop-filter:var(--blur-2)}
.ctx-menu.open{display:flex;animation:ctxIn var(--t-2) var(--e-out)}
@keyframes ctxIn{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:none}}
.cm-title{max-width:200px;padding:4px 10px 6px;margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:var(--fs-micro);color:var(--text-3);border-bottom:1px solid var(--line)}
.cm-btn{display:flex;align-items:center;gap:var(--sp-2);padding:8px 10px;border:0;
  border-radius:var(--r-sm);cursor:pointer;text-align:left;background:none;font-family:inherit;
  font-size:var(--fs-small);font-weight:var(--fw-med);color:var(--text);
  transition:background var(--t-1) linear,color var(--t-1) linear}
.cm-btn:hover{background:var(--surface-2)}
.cm-btn.primary{color:var(--acc-600);font-weight:var(--fw-display)}
.cm-btn.primary::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0;
  background:var(--acc-500)}
.cm-btn.primary:hover{background:var(--acc-50)}
.cm-btn.danger{color:var(--danger)}
.cm-btn.danger:hover{background:rgba(220,38,38,.08)}

/* 网页内对话框：需要打断，视口居中 + 背景模糊 */
.ui-modal-ov{position:fixed;inset:0;z-index:200;display:none;padding:var(--sp-4);
  align-items:center;justify-content:center;background:var(--scrim-2);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ui-modal-ov.open{display:flex;animation:fadeIn var(--t-2) var(--e-out)}
.ui-modal{width:min(420px,100%);padding:var(--sp-6);border-radius:var(--r-xl);
  background:rgba(255,255,255,.96);border:1px solid var(--glass-line);box-shadow:var(--sh-5);
  -webkit-backdrop-filter:var(--blur-3);backdrop-filter:var(--blur-3);
  animation:modalIn var(--t-4) var(--e-out)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.um-title{margin-bottom:var(--sp-2);font-size:var(--fs-lead);font-weight:var(--fw-bold);color:var(--text)}
.um-msg{margin-bottom:var(--sp-4);white-space:pre-wrap;
  font-size:var(--fs-small);line-height:var(--lh-body);color:var(--text-2)}
.um-input{width:100%;height:44px;padding:0 var(--sp-3);margin-bottom:var(--sp-4);
  border-radius:var(--r-sm);outline:none;font-size:var(--fs-body);font-family:inherit;color:var(--text);
  background:#fff;border:1.5px solid var(--line-strong)}
.um-input:focus{border-color:var(--acc-500);box-shadow:0 0 0 3px var(--acc-50)}
.um-row{display:flex;gap:var(--sp-2);justify-content:flex-end}
.um-btn{height:42px;padding:0 var(--sp-5);border-radius:var(--r-md);cursor:pointer;
  font-family:inherit;font-size:var(--fs-small);font-weight:var(--fw-bold);
  border:1px solid var(--line-strong);transition:all var(--t-2) var(--e-snap)}
.um-cancel{background:#fff;color:var(--text-2)}
.um-cancel:hover{color:var(--text);border-color:var(--ink-300)}
.um-ok{background:linear-gradient(135deg,var(--acc-500),var(--acc-700));color:#fff;
  border-color:transparent;box-shadow:var(--sh-acc)}
.um-ok:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(13,124,153,.4)}

/* 放置地名提示条：跟随任务状态的常驻提示，不遮当前视焦 */
.place-hint{position:fixed;top:86px;left:50%;transform:translateX(-50%);z-index:40;display:none;
  align-items:center;gap:var(--sp-3);padding:10px var(--sp-4);border-radius:var(--r-md);
  font-size:var(--fs-small);font-weight:var(--fw-bold);color:#fff;
  background:linear-gradient(135deg,var(--acc-500),var(--acc-700));
  box-shadow:0 10px 30px rgba(13,124,153,.35);animation:popIn var(--t-3) var(--e-out)}
.place-hint.show{display:flex}
.place-hint button{padding:6px var(--sp-4);border:0;border-radius:var(--r-sm);cursor:pointer;
  font-family:inherit;font-weight:var(--fw-bold);
  background:rgba(255,255,255,.94);color:var(--acc-700)}
.place-hint button:hover{background:#fff}

/* 云同步徽章 */
.sync-badge{position:fixed;left:14px;bottom:14px;z-index:120;display:none;
  align-items:center;gap:7px;padding:6px var(--sp-3);border-radius:var(--r-full);
  font-size:var(--fs-micro);font-weight:var(--fw-bold);color:var(--text-2);
  background:rgba(255,255,255,.9);border:1px solid var(--glass-line);box-shadow:var(--sh-2);
  -webkit-backdrop-filter:var(--blur-1);backdrop-filter:var(--blur-1)}
.sync-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.sync-badge.ok{color:var(--ok-ink)}
.sync-badge.wait{color:var(--acc-600)}
.sync-badge.err{color:var(--danger)}
/* 在首页时用首页自己的「云端状态」胶囊，避免左下角两个胶囊重叠 */
body:has(#landing:not(.hidden)) .sync-badge{display:none}

/* ══════════════════════════════════════════════════════════════════════════
   极速检索命令面板 —— 需要打断，视口居中 + 背景模糊
   ══════════════════════════════════════════════════════════════════════════ */
#searchPal{position:fixed;inset:0;z-index:120;display:none;background:var(--scrim-1);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#searchPal.open{display:block;animation:fadeIn var(--t-2) var(--e-out)}
.sp-box{position:absolute;left:50%;top:11vh;transform:translateX(-50%);width:min(640px,92vw);
  overflow:hidden;border-radius:var(--r-xl);
  background:rgba(255,255,255,.97);border:1px solid var(--glass-line);box-shadow:var(--sh-5);
  -webkit-backdrop-filter:var(--blur-3);backdrop-filter:var(--blur-3)}
#searchPal.open .sp-box{animation:spPop var(--t-4) var(--e-out)}
@keyframes spPop{from{opacity:0;transform:translate(-50%,-12px) scale(.97)}
  to{opacity:1;transform:translate(-50%,0) scale(1)}}
.sp-inwrap{display:flex;align-items:center;gap:10px;padding:var(--sp-3) var(--sp-4);
  border-bottom:1px solid var(--line)}
.sp-inwrap>svg{width:20px;height:20px;color:var(--acc-500);flex:none}
#spInput{flex:1;border:0;outline:0;background:transparent;font-family:inherit;
  font-size:var(--fs-lead);font-weight:var(--fw-med);color:var(--text)}
#spInput::placeholder{color:var(--text-3);font-weight:var(--fw-body)}
.sp-kbd{padding:4px 7px;border-radius:var(--r-xs);font-family:var(--mono);
  font-size:var(--fs-micro);font-weight:var(--fw-med);color:var(--text-3);
  background:var(--surface-2);border:1px solid var(--line);box-shadow:0 1px 0 var(--ink-200)}
.sp-results{max-height:56vh;overflow:auto;padding:6px}
.sp-row{display:flex;align-items:center;gap:11px;padding:10px var(--sp-3);
  border-radius:var(--r-sm);cursor:pointer;scroll-margin:8px;
  transition:background var(--t-1) linear}
.sp-row:hover{background:var(--surface-2)}
.sp-row.cur{background:var(--acc-50)}
.sp-ic{width:26px;height:26px;flex:none;border-radius:var(--r-xs);
  display:flex;align-items:center;justify-content:center;background:var(--surface-2)}
.sp-ic img{width:17px;height:17px}
.sp-main{flex:1;min-width:0}
.sp-name{font-size:var(--fs-body);font-weight:var(--fw-bold);color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-name b{padding:0 2px;border-radius:3px;color:var(--acc-600);background:var(--acc-50)}
.sp-meta{margin-top:2px;display:flex;gap:5px;flex-wrap:wrap;
  font-size:var(--fs-caption);color:var(--text-3)}
.sp-meta i{font-style:normal;color:var(--text-2);font-weight:var(--fw-med)}
.sp-side{flex:none;padding:3px 6px;border-radius:var(--r-xs);
  font-family:var(--mono);font-size:var(--fs-micro);font-weight:var(--fw-bold)}
.sp-side.ct{background:rgba(37,99,235,.12);color:var(--ct-ink)}
.sp-side.t{background:rgba(217,119,6,.14);color:var(--t-ink)}
.sp-nu{flex:none;font-size:var(--fs-micro);font-weight:var(--fw-bold);color:var(--warn-ink)}
.sp-empty{padding:var(--sp-8) var(--sp-4);text-align:center;
  font-size:var(--fs-body);line-height:var(--lh-loose);color:var(--text-3)}
.sp-empty b{color:var(--acc-600);font-weight:var(--fw-bold)}
.sp-foot{display:flex;gap:var(--sp-4);padding:9px var(--sp-4);border-top:1px solid var(--line);
  font-size:var(--fs-micro);color:var(--text-3)}
.sp-foot b{color:var(--text-2);font-weight:var(--fw-bold)}

/* ══════════════════════════════════════════════════════════════════════════
   遗留组件：侧栏抽屉 / 道具面板 / 战术套餐条（功能已收敛，样式同步到新体系）
   ══════════════════════════════════════════════════════════════════════════ */
.side-panel{position:fixed;top:74px;right:12px;bottom:80px;width:330px;z-index:15;
  overflow-y:auto;padding:var(--sp-4);border-radius:var(--r-lg);
  transform:translateX(calc(100% + 16px));
  background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--sh-4);
  -webkit-backdrop-filter:var(--blur-3);backdrop-filter:var(--blur-3);
  transition:transform var(--t-5) var(--e-glide)}
.side-panel.open{transform:none}
.sp-head{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3);
  padding-bottom:var(--sp-3);border-bottom:1px solid var(--line)}
.sp-title{flex:1;font-size:var(--fs-small);font-weight:var(--fw-display)}
.sp-close{width:28px;height:28px;border-radius:var(--r-sm);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:none;border:1px solid var(--line-strong);color:var(--text-3);
  transition:all var(--t-2) var(--e-snap)}
.sp-close:hover{border-color:var(--danger);color:var(--danger)}
.util-list{display:flex;flex-direction:column;gap:var(--sp-1)}
.util-item{display:flex;align-items:center;gap:10px;padding:10px var(--sp-3);
  border-radius:var(--r-md);cursor:pointer;
  background:#fff;border:1px solid var(--line);
  transition:all var(--t-2) var(--e-snap);animation:sheetIn var(--t-4) var(--e-out) backwards}
.util-item:nth-child(1){animation-delay:20ms}.util-item:nth-child(2){animation-delay:50ms}
.util-item:nth-child(3){animation-delay:80ms}.util-item:nth-child(4){animation-delay:110ms}
.util-item:nth-child(5){animation-delay:140ms}.util-item:nth-child(6){animation-delay:170ms}
.util-item:nth-child(7){animation-delay:200ms}.util-item:nth-child(n+8){animation-delay:230ms}
.util-item:hover{border-color:var(--acc-300);background:var(--acc-50);transform:translateX(-2px)}
.util-item:active{transform:scale(.98)}
.ui-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 5px currentColor}
.ui-info{flex:1;min-width:0}
.ui-name{font-size:var(--fs-caption);font-weight:var(--fw-med);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ui-meta{margin-top:1px;font-size:10px;color:var(--text-3)}
.pa-badge{flex-shrink:0;white-space:nowrap;padding:2px 7px;border-radius:var(--r-xs);
  font-size:10px;font-weight:var(--fw-bold);color:var(--text-2);
  background:var(--surface-2);border:1px solid var(--line)}
.pa-badge.me{background:var(--acc-50);color:var(--acc-600);border-color:var(--acc-300)}

.util-panel{position:fixed;top:74px;left:12px;bottom:80px;width:272px;z-index:16;
  display:flex;flex-direction:column;border-radius:var(--r-lg);transform:translateX(calc(-100% - 16px));
  background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--sh-4);
  -webkit-backdrop-filter:var(--blur-3);backdrop-filter:var(--blur-3);
  transition:transform var(--t-5) var(--e-glide)}
.util-panel.open{transform:none}
.up-head{display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line)}
.up-title{flex:1;font-size:var(--fs-small);font-weight:var(--fw-display)}
.up-sub{padding:var(--sp-2) var(--sp-4) 0;font-size:10px;color:var(--text-3)}
.up-templates{display:flex;flex-wrap:wrap;gap:6px;padding:var(--sp-2) var(--sp-4) var(--sp-3);
  border-bottom:1px solid var(--line)}
.up-tpl{padding:6px 11px;border-radius:var(--r-sm);cursor:grab;
  font-size:var(--fs-micro);font-weight:var(--fw-bold);
  background:#fff;border:1px dashed var(--line-strong);transition:all var(--t-2) var(--e-snap)}
.up-tpl:active{cursor:grabbing;opacity:.6}
.up-filters{display:flex;gap:var(--sp-1);padding:0 var(--sp-3) 10px;margin-bottom:var(--sp-1);
  border-bottom:1px solid var(--line)}
.uf-btn{flex:1;padding:5px 0;border-radius:var(--r-xs);cursor:pointer;font-size:var(--fs-micro);
  background:var(--surface-2);border:1px solid var(--line);color:var(--text-3);
  transition:all var(--t-2) var(--e-snap)}
.uf-btn.active{background:var(--acc-500);color:#fff;border-color:var(--acc-500)}
.up-list{flex:1;overflow-y:auto;padding:6px 10px var(--sp-4)}
.up-group{display:flex;gap:6px;align-items:center;padding:11px 6px 5px;
  font-size:10px;font-weight:var(--fw-bold);letter-spacing:var(--ls-wide);color:var(--text-3)}
.up-group span{font-family:var(--mono);opacity:.7}
.up-item{display:flex;align-items:center;gap:var(--sp-2);padding:8px 10px;
  border-radius:var(--r-sm);cursor:grab;border:1px solid transparent;
  transition:background var(--t-2) var(--e-snap),border-color var(--t-2) var(--e-snap)}
.up-item:hover{background:var(--surface-2);border-color:var(--line)}
.up-item.sel{background:var(--acc-50);border-color:var(--acc-300)}
.up-item:active{cursor:grabbing}
.up-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;
  background:currentColor;box-shadow:0 0 4px currentColor}
.up-name{flex:1;font-size:var(--fs-caption);font-weight:var(--fw-med);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-pos{flex-shrink:0;font-size:10px;color:var(--text-3)}
.up-del{padding:2px 4px;border-radius:var(--r-xs);cursor:pointer;
  font-size:var(--fs-micro);color:var(--text-3);transition:all var(--t-2) var(--e-snap)}
.up-del:hover{background:rgba(220,38,38,.1);color:var(--danger)}
.up-empty{padding:var(--sp-6) var(--sp-3);text-align:center;
  font-size:var(--fs-micro);line-height:var(--lh-loose);color:var(--text-3)}

.strat-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:0 var(--sp-4) calc(var(--sp-3) + var(--safe-b))}
.strat-bar>*{pointer-events:auto}
.strat-row{display:flex;gap:6px;overflow-x:auto;padding:var(--sp-2) 0;-webkit-overflow-scrolling:touch}
.strat-row::-webkit-scrollbar{display:none}
.strat-chip{flex-shrink:0;white-space:nowrap;padding:10px var(--sp-4);border-radius:var(--r-lg);
  cursor:pointer;font-family:inherit;font-size:var(--fs-caption);font-weight:var(--fw-bold);
  color:var(--text-2);background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--sh-2);
  -webkit-backdrop-filter:var(--blur-2);backdrop-filter:var(--blur-2);
  transition:all var(--t-3) var(--e-snap)}
.strat-chip:hover{color:var(--text);transform:translateY(-2px);box-shadow:var(--sh-3)}
.strat-chip.active{color:#fff;border-color:transparent;
  background:linear-gradient(135deg,var(--acc-500),var(--acc-700));box-shadow:var(--sh-acc)}
.strat-chip .sc-tag{display:block;margin-top:2px;font-family:var(--mono);
  font-size:10px;color:var(--text-3)}
/* 编辑工具条（功能已并入右栏，保留选择器兜底） */
.edit-bar{position:fixed;top:74px;left:50%;transform:translate(-50%,-8px);z-index:21;
  display:none;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;max-width:94vw;
  padding:6px var(--sp-2);border-radius:var(--r-lg);opacity:0;
  background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--sh-3);
  -webkit-backdrop-filter:var(--blur-2);backdrop-filter:var(--blur-2);
  transition:opacity var(--t-4) var(--e-out),transform var(--t-4) var(--e-out)}
.edit-bar.on{display:flex;opacity:1;transform:translate(-50%,0)}
