function updateLabelPositions(){
  const cw=(renderer&&renderer.domElement.clientWidth)||stageW(),ch=(renderer&&renderer.domElement.clientHeight)||window.innerHeight;
  const hw=cw/2,hh=ch/2;
  labelEls.forEach(el=>{
    const zx=+el.dataset.zx,zy=+el.dataset.zy;
    const pos3d=mapCoordTo3D(zx,zy);
    pos3d.y=getHeightAt(zx,zy)+.35;
    const v=pos3d.project(camera);
    el.style.left=(v.x*hw+hw)+'px';
    el.style.top=(-v.y*hh+hh)+'px';
    el.style.display=v.z>1?'none':'';
  });
}

/* ===== 战术套餐 ===== */
function derivePackages(items){
  const pkgs=[];
  Object.keys(PKG_NAMES).forEach(k=>{
    const ids=k.split(',').map(Number);
    const matches=ids.filter(id=>items.some(d=>d.id===id));
    if(matches.length===ids.length)pkgs.push({key:k,ids,name:PKG_NAMES[k],desc:PKG_DESC[k]||''});
  });
  return pkgs;
}
function getStratItems(key){
  const ids=key.split(',').map(Number);
  return data.filter(d=>d.map===curMap&&d.side===curFaction&&ids.includes(d.id));
}
function updateTopTag(){
  const sp=spots.filter(s=>s.map===curMap&&s.side===curFaction).length; // 标题=该图该阵营总览(不随类型筛选变)，与「颗道具」总数口径一致，避免「2点位·6道具」自相矛盾
  const n=mapItems().filter(d=>d.side===curFaction).length;
  const f=curFaction==='CT'?'CT方':'T方';
  $('topTag').textContent=`${f} · ${sp} 个点位 · ${n} 颗道具`;
  if($('statusText'))$('statusText').textContent=`${f} · ${sp} 个点位`;
}
function renderStratBar(){
  if(!$('stratRow'))return; // 战术套餐条已移除
  const items=mapItems().filter(d=>d.side===curFaction);
  const pkgs=derivePackages(items);
  let html='<button class="strat-chip'+(selStrat===null?' active':'')+'" onclick="selectStrat(null)">全部<span class="sc-tag">'+items.length+' 颗</span></button>';

    html+=`<button class="strat-chip${selStrat===p.key?' active':''}" onclick="selectStrat('${p.key}')">${esc(p.name)}<span class="sc-tag">${p.ids.length} 颗</span></button>`;

/* ===== 图片存储 ===== */
const IMG_SLOTS=[['stand','站立点'],['aim','描点'],['effect','效果图']];
let idb=null;
const urlCache=new Map();
function idbOpen(){
  return new Promise((res,rej)=>{
    if(idb)return res(idb);
    const rq=indexedDB.open('cs2tac',1);
    rq.onupgradeneeded=()=>rq.result.createObjectStore('imgs');
    rq.onsuccess=()=>{idb=rq.result;res(idb)};
    rq.onerror=()=>rej(rq.error);
  });
}
function imgKey(id,slot){return id+'_'+slot}
async function imgClearAll(){try{const db=await idbOpen();await new Promise((res,rej)=>{const tx=db.transaction('imgs','readwrite');tx.objectStore('imgs').clear();tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});if(typeof urlCache!=='undefined')urlCache.clear();}catch(e){}}
async function imgPut(key,blob){syncBump(true,key);const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('imgs','readwrite');tx.objectStore('imgs').put(blob,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function imgGet(key){const db=await idbOpen();return new Promise((res,rej)=>{const rq=db.transaction('imgs').objectStore('imgs').get(key);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error)})}
async function imgDel(key){syncBump(true,key);imgMarkGone(key);const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('imgs','readwrite');tx.objectStore('imgs').delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function imgCountLocal(){return idbOpen().then(db=>new Promise(res=>{const rq=db.transaction('imgs').objectStore('imgs').count();rq.onsuccess=()=>res(rq.result||0);rq.onerror=()=>res(0);})).catch(()=>0);}
let diskManifest=null;
async function loadManifest(){
  if(diskManifest!==null)return diskManifest;
  try{
    const r=await fetch('imgs/manifest.json',{cache:'no-store'});
    diskManifest=r.ok?await r.json():{};
  }catch(e){diskManifest={}}
  return diskManifest;
}
async function imgURL(key){
  if(urlCache.has(key))return urlCache.get(key);
  let b=null;
  try{b=await imgGet(key)}catch(e){}
  if(b){const u=URL.createObjectURL(b);urlCache.set(key,u);return u}
  const man=await loadManifest();
  if(man[key]){const u='imgs/'+man[key];urlCache.set(key,u);return u}
  return null;
}
function imgInvalidate(key){
  const u=urlCache.get(key);
  if(u&&u.startsWith('blob:'))URL.revokeObjectURL(u);
  urlCache.delete(key);
}
/* 粘贴图片自动压缩为 WebP（大图缩到 1920 宽内，质量 0.85） */
/* 轻度 unsharp 锐化（5 抽头），让描点瞄准点更锐利。太大的图跳过避免卡顿。 */
function sharpenCanvas(ctx,w,h){
  try{
    if(w*h>6000000)return;
    const src=ctx.getImageData(0,0,w,h),out=ctx.createImageData(w,h);
    const s=src.data,o=out.data,a=0.5,kc=1+4*a;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const oi=(y*w+x)*4, xm=x>0?x-1:x, xp=x<w-1?x+1:x, ym=y>0?y-1:y, yp=y<h-1?y+1:y;
      for(let ch=0;ch<3;ch++){
        const v=s[oi+ch]*kc - a*(s[(y*w+xm)*4+ch]+s[(y*w+xp)*4+ch]+s[(ym*w+x)*4+ch]+s[(yp*w+x)*4+ch]);
        o[oi+ch]=v<0?0:v>255?255:v;
      }
      o[oi+3]=s[oi+3];
    }
    ctx.putImageData(out,0,0);
  }catch(e){}
}
/* 描点(aim)最重要：保留高清 + 锐化，几乎不降质；站位/效果图才大幅压缩省体积 */
async function compressImage(file,slot){
  if(!file||!file.type.startsWith('image/'))return file;
  const isAim=slot==='aim';
  if(file.type==='image/webp'&&file.size<(isAim?500:200)*1024)return file; // 已经很清/很小就不动
  try{
    const bmp=await createImageBitmap(file);
    const maxW=isAim?2560:1366; // 描点保留原生清晰度(最高2560)，其它略降省空间
    const k=Math.min(1,maxW/bmp.width);
    const c=document.createElement('canvas');
    c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    const ctx=c.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingQuality='high'; // 描点会 getImageData 锐化，提示浏览器走 CPU 后端不报警/不 deopt
    ctx.drawImage(bmp,0,0,c.width,c.height);
    bmp.close&&bmp.close();
    if(isAim)sharpenCanvas(ctx,c.width,c.height); // 描点锐化
    const blob=await new Promise(r=>c.toBlob(r,'image/webp',isAim?0.95:0.70)); // 描点高质量
    return(blob&&blob.size<file.size)?blob:file;
  }catch(e){return file}
}

  }else if(viewGroup==='spot'){
    // 按「站位区域」去重分组（与编辑·区域分类一致）：同区域的多个点位合并为一组，避免重复的同名标题
    const byReg={},order=[];
    sps.forEach(s=>{
      const th=spotThrows(s.id).filter(keep);if(!th.length)return;
      const r=spotRegion(s);
      if(!byReg[r]){byReg[r]=[];order.push(r);}
      byReg[r].push(...th);
    });
    order.forEach(r=>{
      const list=byReg[r];
      html+=`<div class="op-grouplabel"><i style="background:${utilColorCSS((list[0]||{}).util)}"></i>${esc(r)} · ${list.length}颗</div><div class="idle-list">`;
      list.forEach(d=>{html+=propRow(d);});
      html+='</div>';
    });
  }else{
    [['smoke','烟雾弹','--smoke'],['flash','闪光弹','--flash'],['fire','火焰','--fire'],['he','高爆雷','--red']].forEach(([k,n,v])=>{
      const list=allProps.filter(d=>utilCls(d.util)===k&&keep(d));if(!list.length)return;
      html+=`<div class="op-grouplabel"><i style="background:var(${v})"></i>${n} · ${list.length}颗</div><div class="idle-list">`;
      list.forEach(d=>{html+=propRow(d);});
      html+='</div>';
    });
  }
  sheet.innerHTML=html;
  $('detailOv').classList.add('open');
  countUp();
}

/* ===== 3D 交互 ===== */
function setMouseFrom(e){
  const rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  camera.updateMatrixWorld();      // 后台标签页从未渲染过时矩阵是旧的
  scene.updateMatrixWorld(true);   // 新加入的对象在渲染前 matrixWorld 是单位阵
  raycaster.setFromCamera(mouse,camera);
}
function pickUtil(e){
  setMouseFrom(e);
  const hits=raycaster.intersectObjects(hitProxies,false);
  return hits.length?hits[0].object:null;
}
function pickLayer(e,list,recursive){
  setMouseFrom(e);
  // Sprite 的射线检测依赖 modelViewMatrix（仅渲染时计算），后台页需手动补算（含 group 子节点）
  const patch=o=>{if(o.isSprite)o.modelViewMatrix.multiplyMatrices(camera.matrixWorldInverse,o.matrixWorld)};
  list.forEach(o=>{patch(o);if(recursive&&o.traverse)o.traverse(patch)});
  const hits=raycaster.intersectObjects(list,!!recursive);
  return hits.length?hits[0].object:null;
}
function pickGround(e){
  if(!mapPlane)return null;
  setMouseFrom(e);
  const hits=raycaster.intersectObject(mapPlane);
  if(!hits.length)return null;
  const p=hits[0].point;
  return{mx:Math.min(1,Math.max(0,p.x/MAP_SIZE+.5)),my:Math.min(1,Math.max(0,p.z/MAP_SIZE+.5))};
}
/* 点 P 到线段 AB 的最近点（夹在端点之间） */
function projSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
  let t=L2?((px-ax)*dx+(py-ay)*dy)/L2:0;t=Math.max(0,Math.min(1,t));
  return{x:ax+t*dx,y:ay+t*dy};
}
/* Ctrl/⌘ + 点击区域边线 → 在最近的边上插入一个节点（自动连接相邻两点）。命中返回 true。 */
function tryInsertPlaceNode(e){
  if(drawing||!editMode)return false;
  const polys=placeList().filter(isPolyPlace);
  if(!polys.length)return false;
  const g=pickGround(e);if(!g)return false;
  let best=null;
  polys.forEach(p=>{const n=p.pts.length;for(let i=0;i<n;i++){const a=p.pts[i],b=p.pts[(i+1)%n];const pr=projSeg(g.mx,g.my,a.x,a.y,b.x,b.y);const dd=Math.hypot(pr.x-g.mx,pr.y-g.my);if(!best||dd<best.dd)best={dd,p,i,pr};}});
  if(!best||best.dd>0.06)return false;
  pushUndo(['places']);
  best.p.pts.splice(best.i+1,0,{x:+best.pr.x.toFixed(4),y:+best.pr.y.toFixed(4)});
  savePlaces();renderPlaces();renderPlaceNodes();
  suppressClick=true;setTimeout(()=>suppressClick=false,220);
  if(typeof flashToast==='function')flashToast('已加节点 · 拖动白点微调');
  return true;
}

function onPointerMove(e){
  needsRender=true; // 悬停/拖拽即时续帧；空闲无 pointermove，故不影响省电
  if(drag){
    const g=pickGround(e);
    if(g){
      drag.moved=true;
      if(drag.kind==='editHandle'){
        const d=editTarget&&editTarget.d;
        if(d){
          if(drag.type==='stand'){d.standX=+g.mx.toFixed(4);d.standY=+g.my.toFixed(4)}
          else if(drag.type==='via'){const v=d.via&&d.via[drag.viaIdx];if(v){v.x=+g.mx.toFixed(4);v.y=+g.my.toFixed(4)}}
          else{d.mapX=+g.mx.toFixed(4);d.mapY=+g.my.toFixed(4)}
          positionEditHandles();
        }
        return;
      }
      if(drag.kind==='placeNode'){
        const pl=drag.rec;
        if(pl&&pl.pts[drag.vIdx]){pl.pts[drag.vIdx]={x:+g.mx.toFixed(4),y:+g.my.toFixed(4)};renderPlaces();}
        return;
      }
      const p=mapCoordTo3D(g.mx,g.my);
      drag.objs.forEach(o=>{o.position.x=p.x;o.position.z=p.z});
      drag.mx=g.mx;drag.my=g.my;
    }
    return;
  }

  if(editMode&&editSub!=='util'){
    const list=editSub==='place'?placeMeshes:(editSub==='wall'?wallMeshes:spawnMeshes);
    const hit=pickLayer(e,list,editSub==='place'||editSub==='wall');
    renderer.domElement.style.cursor=(drawing?'crosshair':(hit?'move':'crosshair'));
    return;
  }

  const hit=pickUtil(e);
  if(hoveredHit&&hoveredHit!==hit)unhover(hoveredHit);
  if(hit){
    hoveredHit=hit;
    const sm=spotMeshes.find(s=>s.spot.id===hit.userData.spotId);
    if(sm){sm.mark.scale.setScalar(1.08);sm.mark.userData.ring.material.opacity=1}
    renderer.domElement.style.cursor=editMode?'move':'pointer';

    const v=hit.position.clone();v.y+=.1;
    v.project(camera);
    const cw=(renderer&&renderer.domElement.clientWidth)||stageW(),ch=(renderer&&renderer.domElement.clientHeight)||window.innerHeight;
    const hw=cw/2,hh=ch/2;
    const tip=$('dotTip');
    tip.innerHTML=`${esc(hit.userData.name)}<span class="tt-type" style="margin-left:6px">${hit.userData.count||0} 颗道具</span>`;
    tip.style.left=(v.x*hw+hw)+'px';
    tip.style.top=(-v.y*hh+hh)+'px';
    tip.classList.add('show');
  }else{
    hoveredHit=null;
    renderer.domElement.style.cursor=editMode?'crosshair':'grab';
    $('dotTip').classList.remove('show');
  }
}
function unhover(hit){
  const sm=spotMeshes.find(s=>s.spot.id===hit.userData.spotId);
  if(sm){sm.mark.scale.setScalar(1);if(sm.spot.id!==selSpot)sm.mark.userData.ring.material.opacity=.85}
}
function refreshArc(f){
  if(f.arc){scene.remove(f.arc);disposeObj(f.arc)}
  const live={...f.d};
  if(f._dragLand){live.mapX=f._dragLand.mx;live.mapY=f._dragLand.my}
  if(f._dragStand){live.standX=f._dragStand.mx;live.standY=f._dragStand.my}
  f.arc=buildArc(live);
  if(f.arc){f.arc.visible=true;scene.add(f.arc)}
}

function onPointerDown(e){
  if(editTarget && editHandles){
    const grabs=[editHandles.stand.userData.grab, editHandles.land.userData.grab].concat((editHandles.via||[]).map(o=>o.userData.grab));
    const hit = pickLayer(e, grabs);
    if(hit){
      drag = {kind:'editHandle', type:hit.userData.handleType, viaIdx:hit.userData.viaIdx, moved:false};
      controls.enabled=false;
      try{renderer.domElement.setPointerCapture(e.pointerId)}catch(_){}
      return;
    }
  }
  if(!editMode)return;
  // Ctrl/⌘ + 点击区域边线：插入一个新节点（自动连接相邻两点），用来细化区域形状
  if(!drawing && (e.ctrlKey||e.metaKey)){ if(tryInsertPlaceNode(e))return; }
  // 区域顶点手柄优先：编辑模式任何子模式下都能拖动单个节点
  if(!drawing && placeNodeMeshes.length){
    const nh=pickLayer(e,placeNodeMeshes);
    if(nh&&nh.userData&&nh.userData.placeId!=null){
      const p=placeList().find(x=>String(x.id)===String(nh.userData.placeId));
      if(p&&isPolyPlace(p)){
        pushUndo(['places']);
        drag={kind:'placeNode',rec:p,vIdx:nh.userData.vIdx,moved:false,_pushed:true};
        controls.enabled=false;
        try{renderer.domElement.setPointerCapture(e.pointerId)}catch(_){}
        return;
      }
    }
  }
  if(editSub==='util'){
    const hit=pickUtil(e);
    if(!hit)return;
    const sm=spotMeshes.find(s=>s.spot.id===hit.userData.spotId);
    if(!sm)return;
    drag={kind:'spot',objs:[sm.mark,sm.prox],rec:sm.spot,mx:sm.spot.x,my:sm.spot.y,moved:false};
  }else if(editSub==='place'){
    const hit=pickLayer(e,placeMeshes,true);
    if(!hit)return;
    const p=placeList().find(x=>String(x.id)===String(hit.userData.placeId));
    if(!p)return;
    if(isPolyPlace(p)){
      const grp=placeMeshes.find(o=>o.userData&&String(o.userData.placeId)===String(p.id))||hit;
      const c=placeCenter(p);
      drag={kind:'placePoly',objs:[grp],rec:p,cx0:c.x,cy0:c.y,mx:c.x,my:c.y,moved:false};
    }else{
      drag={kind:'place',objs:[hit],rec:p,mx:p.x,my:p.y,moved:false};
    }
  }else if(editSub==='wall'){
    return;
  }else{
    const hit=pickLayer(e,spawnMeshes);
    if(!hit)return;
    const s=spawnList(curFaction).find(x=>x.id===hit.userData.spawnId);
    if(!s)return;
    drag={kind:'spawn',objs:[hit],rec:s,mx:s.x,my:s.y,moved:false};
  }
  if(drag){
    controls.enabled=false;
    try{renderer.domElement.setPointerCapture(e.pointerId)}catch(_){}
  }
}

function onPointerUp(){
  if(!drag)return;
  if(drag.kind==='placeNode'){
    if(drag.moved){savePlaces();renderPlaces();suppressClick=true;setTimeout(()=>suppressClick=false,200);}
    else if(drag._pushed){undoStack.pop();} // 没拖动 → 撤回多余快照
    controls.enabled=true;drag=null;return;
  }
  if(drag.moved){
    if(drag.kind!=='editHandle')pushUndo(drag.kind==='spawn'?['spawns']:(drag.kind==='place'||drag.kind==='placePoly')?['places']:['data','spots']);
    if(drag.kind==='editHandle'){
      // 投掷点/爆开点已写入 editTarget.d，保存时持久化
      if(drag.type==='stand'&&editTarget&&editTarget._posAuto){ // 拖动投掷点 → 站位区域自动取最近地名
        editTarget.d.pos='';const sel=$('efPos');if(sel){sel.innerHTML=posOptionsHTML(editTarget.d);editTarget.d.pos=sel.value;}
      }
    }else if(drag.kind==='spot'){
      drag.rec.x=+drag.mx.toFixed(4);drag.rec.y=+drag.my.toFixed(4);
      saveSpots();
    }else if(drag.kind==='place'){
      drag.rec.x=+drag.mx.toFixed(4);drag.rec.y=+drag.my.toFixed(4);
      savePlaces();
    }else if(drag.kind==='placePoly'){
      const dx=drag.mx-drag.cx0, dy=drag.my-drag.cy0;
      drag.rec.pts=drag.rec.pts.map(q=>({x:+(q.x+dx).toFixed(4),y:+(q.y+dy).toFixed(4)}));
      savePlaces();renderPlaces();
    }else if(drag.kind==='spawn'){
      drag.rec.x=+drag.mx.toFixed(4);drag.rec.y=+drag.my.toFixed(4);
      saveSpawns();
    }
    suppressClick=true;
    setTimeout(()=>suppressClick=false,200);
  }
  controls.enabled=true;
  drag=null;
}

function onMapClick(e){
  if(suppressClick){suppressClick=false;return}
  hideCtxMenu();
  if(placingProp){
    const g=pickGround(e);
    if(g){
      placingProp=false;
      const ph=$('placeHint');if(ph)ph.classList.remove('show');
      openEditForm(null,{mx:g.mx,my:g.my}); // 在点击处建道具（投掷点=点击位置）
    }
    return;
  }
  if(drawing){
    const g=pickGround(e);
    if(g)window.addDrawPoint(g.mx,g.my);
    return;
  }
  if(editMode&&editSub==='place'){
    const hit=pickLayer(e,placeMeshes,true);
    if(hit){showCtxFor('place',hit,e);return}
    return;
  }
  if(editMode&&editSub==='wall'){
    const hit=pickLayer(e,wallMeshes,true);
    if(hit){showCtxFor('wall',hit,e);return}
    return;
  }
  if(editMode&&editSub==='spawn'){
    const hit=pickLayer(e,spawnMeshes);
    if(hit){showCtxFor('spawn',hit,e);return}
    const g=pickGround(e);
    if(g){
      pushUndo(['spawns']);
      const list=spawnList(curFaction);
      const next=list.length?Math.max(...list.map(s=>+s.n||0))+1:1;
      list.push({id:Date.now(),n:next,x:+g.mx.toFixed(4),y:+g.my.toFixed(4),s:1});
      saveSpawns();renderSpawns();renderSpawnListUI&&renderSpawnListUI();
    }
    return;
  }
  // 点位：浏览=展开道具列表；编辑=管理菜单
  const hit=pickUtil(e);
  if(hit){
    if(editMode&&editSub==='util')showCtxFor('spot',hit,e);
    else if(!editMode)openSpotOrDetail(hit.userData.spotId); // 单道具直显 / 多道具右侧列出
    return;
  }
  if(!editMode){stopPlay();closeSpotPanel()}
}

/* ===== 右键管理（编辑模式）===== */
function onContextMenu(e){
  e.preventDefault();
  let hit;
  if(editMode){
    // 命中优先级：出生点 > 地名 > 道具
    hit=pickLayer(e,spawnMeshes);
    if(hit)return showCtxFor('spawn',hit,e);
    hit=pickLayer(e,placeMeshes,true);
    if(hit)return showCtxFor('place',hit,e);
    hit=pickLayer(e,wallMeshes,true);
    if(hit)return showCtxFor('wall',hit,e);
    hit=pickUtil(e);
    if(hit)return showCtxFor('spot',hit,e);
  } else {
    hit=pickUtil(e);
    if(hit){
      const sp=spotById(hit.userData.spotId);
      if(sp)return showCtxMenu(e.clientX,e.clientY,'点位「'+spotLabel(sp)+'」',[{label:'移出地图',danger:true,fn:()=>{sp.x=undefined;sp.y=undefined;saveSpots();renderDots3D();if(selSpot===sp.id)closeSpotPanel()}}]);
    }
  }
  hideCtxMenu();
}
function showCtxMenu(x,y,title,items){
  const m=$('ctxMenu');
  m.innerHTML=`<div class="cm-title">${esc(title)}</div>`+items.map((it,i)=>
    `<button class="cm-btn${it.danger?' danger':''}${it.primary?' primary':''}" data-i="${i}">${it.label}</button>`).join('');
  items.forEach((it,i)=>{
    m.querySelector(`[data-i="${i}"]`).onclick=ev=>{ev.stopPropagation();pushUndo();it.fn();if(!it.keep)hideCtxMenu()};
  });
  m.classList.add('open');
  const mw=m.offsetWidth,mh=m.offsetHeight;
  m.style.left=Math.min(window.innerWidth-mw-8,Math.max(8,x))+'px';
  m.style.top=Math.min(window.innerHeight-mh-8,Math.max(8,y))+'px';
}
function hideCtxMenu(){const m=$('ctxMenu');m.classList.remove('open');m.innerHTML=''}
document.addEventListener('click',e=>{

      {label:'字号大',keep:true,fn:()=>{p.s=Math.min(3,(p.s||1)*1.25);savePlaces();renderPlaces()}},
      {label:'字号小',keep:true,fn:()=>{p.s=Math.max(.4,(p.s||1)*.8);savePlaces();renderPlaces()}},
      {label:'删除',danger:true,fn:()=>{places[curMap]=placeList().filter(x=>String(x.id)!==String(p.id));savePlaces();renderPlaces();renderPlaceListUI&&renderPlaceListUI()}}
    ]);
  }else{ // 点位
    const sp=spotById(hit.userData.spotId);

      {label:'加道具',fn:()=>openEditForm(null,{spotId:sp.id})},
      {label:'改名',fn:()=>{uiPrompt('点位名',sp.name,'修改点位名').then(v=>{if(v&&v.trim()){sp.name=v.trim();saveSpots();renderDots3D();renderIdlePanel()}})}},
      {label:'调大',keep:true,fn:()=>{sp.size=Math.min(4,(sp.size||1)*1.2);saveSpots();renderDots3D()}},
      {label:'调小',keep:true,fn:()=>{sp.size=Math.max(.4,(sp.size||1)*.83);saveSpots();renderDots3D()}},
      {label:'移出地图',danger:true,fn:()=>{sp.x=undefined;sp.y=undefined;saveSpots();renderDots3D();if(selSpot===sp.id)closeSpotPanel()}}
    ]);
  }
}

/* ===== 相机 ===== */
function animateCameraIn(){
  const start={x:0,y:18,z:0};
  const end={x:0,y:12,z:8};
  const ts={x:controls.target.x,y:controls.target.y,z:controls.target.z};
  const dur=1200;
  const t0=performance.now();
  function step(now){
    const t=Math.min((now-t0)/dur,1);
    const e=1-Math.pow(1-t,4);
    camera.position.set(
      start.x+(end.x-start.x)*e,
      start.y+(end.y-start.y)*e,
      start.z+(end.z-start.z)*e);
    controls.target.set(ts.x*(1-e),ts.y*(1-e),ts.z*(1-e));
    controls.update();
    needsRender=true;
    if(t<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* 视点边界：WASD/平移都不能把画布无限拉走（夹住 target，并把同样的修正量补给相机以保持视角） */
function clampView(){
  if(!controls||!camera)return;
  const LIM=MAP_SIZE*0.4; // 视点边界收窄，贴近地图
  const t=controls.target;
  const nx=Math.max(-LIM,Math.min(LIM,t.x)),nz=Math.max(-LIM,Math.min(LIM,t.z)),ny=Math.max(-.3,Math.min(1.8,t.y));
  const dx=nx-t.x,dy=ny-t.y,dz=nz-t.z;
  if(dx||dy||dz){t.set(nx,ny,nz);camera.position.x+=dx;camera.position.y+=dy;camera.position.z+=dz;}
}
/* 右侧信息/编辑栏展开时，把地图整体投影左移，避开被面板遮住（改投影中心，不动相机，拾取/标签自动跟随） */
function updateViewOffset(){
  if(!camera)return;
  const w=window.innerWidth,h=window.innerHeight;
  const detailOpen=$('detailOv')&&$('detailOv').classList.contains('open')&&!panelHidden;
  const editOpen=$('editOv')&&$('editOv').classList.contains('open');
  if(w>720 && (detailOpen||editOpen)){
    const sw=Math.max(360,Math.min(w*0.382,680))+14; // 面板宽 + 右边距
    camera.setViewOffset(w,h,Math.round(sw*0.5),0,w,h);
  }else if(camera.view&&camera.view.enabled){camera.clearViewOffset();}
  invalidate();
}
/* ===== 渲染循环 ===== */
function animateFrame(){
  if(controls.update())needsRender=true;   // OrbitControls 阻尼/拖拽期间持续返回 true → 自动续帧
  clampView();
  const now=performance.now(),time=now*.001;

  // WASD / QE 自由视角
  if(keys.w || keys.a || keys.s || keys.d || keys.q || keys.e) {
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    dir.y = 0; dir.normalize();
    const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
    const speed = 0.08;
    const move = new THREE.Vector3();
    if(keys.w) move.add(dir.clone().multiplyScalar(speed));
    if(keys.s) move.sub(dir.clone().multiplyScalar(speed));
    if(keys.a) move.sub(right.clone().multiplyScalar(speed));
    if(keys.d) move.add(right.clone().multiplyScalar(speed));
    if(move.lengthSq() > 0){camera.position.add(move);controls.target.add(move);}
    if(keys.q || keys.e){
      const angle = keys.q ? 0.04 : -0.04;
      const offset = camera.position.clone().sub(controls.target);
      offset.applyAxisAngle(new THREE.Vector3(0,1,0), angle);
      camera.position.copy(controls.target).add(offset);
    }
    controls.update(); needsRender=true;
  }

  // 仅「选中」点位外环轻微呼吸；空闲时全静止（配合按需渲染 → 空闲零 GPU、不再 60fps 空转）
  if(selSpot!=null){
    const sm=spotMeshes.find(s=>s.spot.id===selSpot);
    if(sm&&sm.mark.userData.ring){sm.mark.userData.ring.material.opacity=.8+Math.sin(time*2.2)*.2;needsRender=true;}
  }

  // 选中道具的投掷动画推进
  if(activePlay){
    needsRender=true;
    const ap=activePlay;
    if(ap.phase==='fly'){
      const t=Math.min((now-ap.t0)/ap.dur,1);
      const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; // easeInOut
      ap.grenade.position.copy(ap.curve.getPoint(e));
      ap.grenade.rotation.x+=.35;ap.grenade.rotation.z+=.22;
      if(ap.man) ap.man.position.y = ap.curve.v0.y + Math.sin(Math.min(t*5, 1) * Math.PI) * 0.025; // 3D 小人只轻微踮一下，不再大幅悬浮
      if(t>=1){
        scene.remove(ap.grenade);disposeObj(ap.grenade);ap.grenade=null;
        const fx=buildLandFx(ap.d);
        const land=mapCoordTo3D(ap.d.mapX,ap.d.mapY);
        fx.position.set(land.x,landY(ap.d)-.04,land.z);
        scene.add(fx);
        ap.landFx=fx;ap.phase='land';ap.landT0=now;
      }
    }else if(ap.phase==='land'){
      const intro=Math.min((now-ap.landT0)/350,1);
      animateFx(ap.landFx,time,intro);
    }
  }

  // 风格交叉淡入推进（新平面 opacity 0→1，平滑无白屏）
  if(styleFade){
    const f=styleFade,t=Math.min((now-f.t0)/f.dur,1),e=t*t*(3-2*t);
    if(f.plane)f.plane.material.opacity=e;
    if(t>=1)finishStyleFade();
    needsRender=true;
  }

  // 弧线流光：高光沿弧滑动（仅在有彗星时）
  if(arcComets.length){
    needsRender=true;
    const flowT=(now*.0005)%1;
    for(const ln of arcComets){
      if(!ln.parent)continue;
      const c=ln.userData.comet,cv=ln.userData.curve;
      if(c&&cv){c.position.copy(cv.getPoint(flowT));const p=Math.sin(flowT*Math.PI);c.material.opacity=.4+p*.6}
    }
  }

  // ===== 按需渲染：仅在有变化/动画或 ~800ms 心跳时才真正绘制 =====
  if(needsRender || now-_lastRenderAt>800){
    if((placeLabelMeshes.length||presetLabelMeshes.length)&&camera&&controls){
      const az=Math.atan2(camera.position.x-controls.target.x, camera.position.z-controls.target.z);
      for(const lbl of placeLabelMeshes){if(lbl)lbl.rotation.z=az;}
      for(const lbl of presetLabelMeshes){if(lbl)lbl.rotation.z=az;}
    }
    updateLabelPositions();
    renderer.render(scene,camera);
    _lastRenderAt=now;needsRender=false;
  }
}

/* ===== 编辑时的地图手柄：投掷点(standX/Y) + 爆开点(mapX/Y) ===== */
let editHandles=null;
/* 手柄上方的文字标签（彩色药丸，始终朝向相机、不被地形遮挡） */
function handleLabel(text,css){
  const c=document.createElement('canvas');c.width=200;c.height=72;
  const g=c.getContext('2d');
  g.font='bold 34px Inter,PingFang SC,sans-serif';g.textAlign='center';g.textBaseline='middle';
  const tw=g.measureText(text).width,pad=15,bw=tw+pad*2,bh=44,bx=(200-bw)/2,by=(72-bh)/2;
  g.fillStyle=css;
  if(g.roundRect){g.beginPath();g.roundRect(bx,by,bw,bh,12);g.fill();}else{g.fillRect(bx,by,bw,bh);}
  g.fillStyle='#fff';g.fillText(text,100,38);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,depthTest:false}));
  sp.scale.set(.5,.18,1);sp.position.y=.62;sp.renderOrder=999;  // 更小、更贴近手柄
  return sp;
}
function makeEditHandle(color,label,css){
  const g=new THREE.Group();
  const ring=new THREE.Mesh(new THREE.RingGeometry(.07,.1,28),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95,side:THREE.DoubleSide,depthWrite:false}));
  ring.rotation.x=-Math.PI/2;ring.position.y=.04;
  const fill=new THREE.Mesh(new THREE.CircleGeometry(.07,24),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:.28,side:THREE.DoubleSide,depthWrite:false}));
  fill.rotation.x=-Math.PI/2;fill.position.y=.038;
  const pin=new THREE.Mesh(new THREE.ConeGeometry(.045,.2,16),new THREE.MeshBasicMaterial({color})); // 倒锥变小
  pin.position.y=.22;pin.rotation.x=Math.PI;
  const grab=new THREE.Mesh(new THREE.SphereGeometry(.4,8,8),       // 命中区仍较大，好点
    new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
  grab.position.y=.14;
  g.add(fill,ring,pin,grab);
  if(label)g.add(handleLabel(label,css));
  g.userData.grab=grab;
  return g;
}
/* 投掷点手柄 = 小人（与播放态同一个小人，保证表示一致） */
function makePersonHandle(label,css){
  const g=new THREE.Group();
  const ring=new THREE.Mesh(new THREE.RingGeometry(.07,.1,28),
    new THREE.MeshBasicMaterial({color:0x06b6d4,transparent:true,opacity:.92,side:THREE.DoubleSide,depthWrite:false}));
  ring.rotation.x=-Math.PI/2;ring.position.y=.04;
  const man=makeManSprite(editTarget&&editTarget.d?editTarget.d.side:curFaction);          // 同 playThrow 的小人，按阵营上色
  man.position.y=.12;                  // 站在地面
  const grab=new THREE.Mesh(new THREE.SphereGeometry(.4,8,8),
    new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false}));
  grab.position.y=.14;
  g.add(ring,man,grab);
  if(label)g.add(handleLabel(label,css));
  g.userData.grab=grab;
  return g;
}
function clearEditHandles(){
  if(!editHandles)return;
  ['stand','land','arc'].forEach(k=>{const o=editHandles[k];if(o){scene.remove(o);disposeObj(o)}});
  (editHandles.via||[]).forEach(o=>{scene.remove(o);disposeObj(o)});
  editHandles=null;
}
function positionEditHandles(){
  if(!editHandles||!editTarget)return;
  const d=editTarget.d;
  const sv=mapCoordTo3D(d.standX,d.standY),lv=mapCoordTo3D(d.mapX,d.mapY);
  editHandles.stand.position.set(sv.x,getHeightAt(d.standX,d.standY)+.04,sv.z);
  editHandles.land.position.set(lv.x,getHeightAt(d.mapX,d.mapY)+.04,lv.z);
  (editHandles.via||[]).forEach((o,i)=>{const v=d.via&&d.via[i];if(v){const w=mapCoordTo3D(v.x,v.y);o.position.set(w.x,getHeightAt(v.x,v.y)+.04,w.z)}});
  if(editHandles.arc){scene.remove(editHandles.arc);disposeObj(editHandles.arc)}
  const arc=buildArc(d);
  if(arc){arc.visible=true;scene.add(arc);editHandles.arc=arc}else editHandles.arc=null;
}
function buildEditHandles(){
  if(!scene)return;
  clearEditHandles();
  if(!editTarget)return;
  const stand=makePersonHandle('投掷点','#06b6d4'); // 投掷点 = 小人（你站立投掷的位置）
  const land=makeEditHandle(0xea580c,'爆开点','#ea580c');  // 手雷落地/炸开的位置
  stand.userData.grab.userData={handleType:'stand'};
  land.userData.grab.userData={handleType:'land'};
  scene.add(stand);scene.add(land);
  const via=[];
  const d0=editTarget.d;
  if(Array.isArray(d0.via))d0.via.forEach((v,i)=>{const vh=makeEditHandle(0x7c3aed,'弹点'+(i+1),'#7c3aed');vh.userData.grab.userData={handleType:'via',viaIdx:i};scene.add(vh);via.push(vh)});
  editHandles={stand,land,arc:null,via};
  positionEditHandles();
  // 编辑时只保留两个手柄+弧线：停掉播放小人、隐藏点位圈与出生点，避免“三个元素分不清”
  stopPlay();
  spotMeshes.forEach(s=>{if(s.mark)s.mark.visible=false;if(s.prox)s.prox.visible=false;});
  spawnMeshes.forEach(m=>m.visible=false);
}

function initDrop(slot,id){
  const el=$('drop_'+slot);
  if(!el)return;
  // 新增道具一律空白；只有“编辑已有道具”才回填已存图片（避免磁盘旧图按 id 漏进新道具）
  const isNew=editTarget&&editTarget.isNew;
  if(!isNew && !(editTarget&&editTarget.d.imgs&&editTarget.d.imgs[slot]===''))
    imgURL(imgKey(id,slot)).then(u=>{
      if(u&&editTarget&&editTarget.pending[slot]===undefined)setDropPreview(slot,u);
    });
  // 仅支持剪贴板粘贴：点格子聚焦，再 Ctrl+V 粘贴截图（不再本地选文件 / 拖拽文件）
  el.onclick=e=>{
    if(e.target.classList.contains('id-x'))return;
    el.classList.add('focus');el.focus();
  };
  el.onblur=()=>el.classList.remove('focus');
  el.onpaste=e=>{
    const items=(e.clipboardData||{}).items||[];
    const it=[...items].find(i=>i.type&&i.type.startsWith('image/'));
    if(it){stageImg(slot,it.getAsFile());e.preventDefault()}
  };
}
async function stageImg(slot,file){
  if(!file||!editTarget)return;
  const blob=await compressImage(file,slot);  // 传 slot：描点(aim)保清晰
  if(!editTarget)return;
  editTarget.pending[slot]=blob;
  setDropPreview(slot,URL.createObjectURL(blob));
}
function setDropPreview(slot,u){
  const el=$('drop_'+slot);
  if(!el)return;
  el.innerHTML=`<img src="${u}" alt=""><span class="id-x" onclick="clearImg('${slot}')">&#10005;</span>`;
}
window.clearImg=function(slot){
  if(!editTarget)return;

};

window.saveEdit=async function(){
  const t=editTarget;
  if(!t)return;
  // E4: 名称必填（防止存成「未命名」的空壳道具）
  const nameInp=$('efTarget');
  if(nameInp&&!nameInp.value.trim()){nameInp.focus();nameInp.classList.add('ef-err');flashToast('请先填名称');return;}
  pushUndo(['data','spots']);
  const d=t.d;
  d.side=$('efSide').value;d.util=$('efUtil').value;d.pos=$('efPos').value;d.purpose=$('efPurpose').value;
  d.target=$('efTarget').value.trim()||'未命名';
  d.key=$('efKey').value;d.action=$('efAction').value;
  d.note=$('efNote').value.trim();
  d.tags=t._tags?[...t._tags]:(Array.isArray(d.tags)?d.tags:[]);
  for(const[slot]of IMG_SLOTS){
    const p=t.pending[slot];
    if(p===undefined)continue;
    const key=imgKey(d.id,slot);
    imgInvalidate(key);
    if(p===null){await imgDel(key);d.imgs[slot]=''}
    else{await imgPut(key,p);d.imgs[slot]='idb'}
  }
  if(t.isNew)data.push(d);
  else{const i=data.findIndex(x=>x.id===d.id);if(i>=0)data[i]=d}
  migrateSpots();        // 先归并出 spotId，再写盘，保证 localStorage 里道具带 spotId
  save();saveSpots();
  // 保存后自动开启对应类型筛选，防止误关筛选导致新道具不可见
  const _fcls=utilCls(d.util);
  if(_fcls&&!window.activeFilters[_fcls]){
    window.activeFilters[_fcls]=true;
    ['uf_','tf_'].forEach(pfx=>{const el=$(pfx+_fcls);if(el){el.classList.add('active');el.setAttribute('aria-pressed','true');}});
  }
  closeEdit();
  // 道具可以加到任一阵营；若它不是当前正在看的阵营，自动切到它那边，否则"加了却看不到"
  if(d.side&&d.side!==curFaction)setFaction(d.side);
  else renderDots3D();
};
window.delEdit=async function(){
  const t=editTarget;
  if(!t||t.isNew)return;
  if(!await uiConfirm('确定删除「'+(t.d.target||'未命名')+'」这颗道具？','删除道具'))return;
  pushUndo(['data','spots']);
  await stashImgsForUndo([t.d.id]);
  data=data.filter(x=>x.id!==t.d.id);
  data.forEach(x=>{x.combo=x.combo.filter(c=>c!==t.d.id)});
  IMG_SLOTS.forEach(([slot])=>{imgInvalidate(imgKey(t.d.id,slot));imgDel(imgKey(t.d.id,slot))});
  save();
  migrateSpots();saveSpots();
  closeEdit();
  renderDots3D();
};

function blobToDataURL(b){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(b);});}
function dataURLtoBlob(u){const i=u.indexOf(',');const meta=u.slice(0,i),b64=u.slice(i+1);const mime=(meta.match(/:(.*?);/)||[])[1]||'image/webp';const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)arr[j]=bin.charCodeAt(j);return new Blob([arr],{type:mime});}
/* 完整备份：含全部道具/点位/地名/出生点/空气墙/收藏 + 图片(base64)，可在任意浏览器导入 */

/* 一键把已上传的图片重新压缩到更小（省空间、备份/同步更快） */
window.recompressAll=async function(){
  if(!await uiConfirm('把「站位点 / 效果图」重新压缩到更小（省空间）。描点(aim)最重要，不会动它的清晰度。','压缩现有图片'))return;
  // A2: 先统计总数 + 压缩期间禁用按钮并显示进度，避免用户以为卡住重复点击
  const queue=[];
  for(const d of data){if(!d.imgs)continue;for(const slot of ['stand','effect']){if(d.imgs[slot]==='idb')queue.push([d.id,slot]);}}
  const btn=document.querySelector('.compress-chip');
  const total=queue.length;
  if(!total){if(typeof flashToast==='function')flashToast('图片已经够小了');return;}
  if(btn){btn.disabled=true;btn.dataset.txt=btn.textContent;btn.textContent='压缩中…';}
  if(typeof flashToast==='function')flashToast('开始压缩 '+total+' 张…');
  let n=0,saved=0,done=0;
  for(const [id,slot] of queue){
    try{
      const blob=await imgGet(imgKey(id,slot));
      if(!blob)continue;
      const c=await compressImage(blob,slot);
      if(c&&c.size<blob.size){await imgPut(imgKey(id,slot),c);imgInvalidate(imgKey(id,slot));n++;saved+=blob.size-c.size;}
    }catch(e){}
    done++;
    if(done%3===0&&typeof flashToast==='function')flashToast('压缩进度 '+done+'/'+total);
  }
  if(btn){btn.disabled=false;if(btn.dataset.txt)btn.textContent=btn.dataset.txt;}
  if(typeof flashToast==='function')flashToast(n?('压缩了 '+n+' 张，省 '+(saved/1048576).toFixed(1)+'MB'):'图片已经够小了');
};

/* ===== 键盘 ===== */
window.addEventListener('keydown',e=>{
  if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(['w','a','s','d','q','e'].includes(k)) keys[k]=true;
  
  const inGame=$('gameView').classList.contains('active');
  if(e.key==='Escape'){
    if(drawing){cancelDraw();return;}
    if($('lightbox').classList.contains('open'))closeLightbox();
    else if($('editOv').classList.contains('open'))closeEdit();
    else if($('detailOv').classList.contains('open'))closeDetail();
    else if($('sidePanel').classList.contains('open'))closeSide();
    else if(editMode)toggleEdit(false);
    else if(inGame)goBack();
    return;
  }
  if(!inGame)return;
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&(e.key==='z'||e.key==='Z')){e.preventDefault();if(drawing)window.undoDrawPoint();else window.undoLast();return;}
  if(e.key==='1')setFaction('CT');
  else if(e.key==='2')setFaction('T');
  else if(e.key==='p'||e.key==='P')snapshot(true);

/* ===== 粒子背景（浅色） ===== */
function initParticles(){
  const c=$('particleBg'),ctx=c.getContext('2d');
  let w,h;const pts=[];
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  for(let i=0;i<55;i++)pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.6+.6,a:Math.random()*.18+.06});
  function draw(){
    if($('landing').classList.contains('hidden')){requestAnimationFrame(draw);return}
    ctx.clearRect(0,0,w,h);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(8,145,178,${p.a})`;ctx.fill();
    });
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<120){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);
        ctx.strokeStyle=`rgba(8,145,178,${.05*(1-d/120)})`;ctx.stroke()}
    }
    requestAnimationFrame(draw);
  }
  draw();
}

/* ===== 极速检索 · 跨地图命令面板 =====

   真·错字纠正（如 mirgge）仅靠子序列回退近似命中，非完整编辑距离。 */
const SP_MAP_ALIAS={
  '炼狱小镇':'inferno inf ln lianyu lyxz 炼狱 小镇',
  '荒漠迷城':'mirage mg mrg huangmo hmmc hm 沙漠 荒漠 迷城',
  '炙热沙城2':'dust2 dust d2 ds2 zhiresha zrsc 沙城 沙2',

  '核子危机下层':'nuke lower hzwjxc 核子下 下层',
  '远古遗迹':'ancient anc yuangu ygyj 远古 遗迹',
  '阿努比斯':'anubis anb anbs 阿努 比斯',
  '死亡游乐园':'overpass op siwang swyly 游乐园 过道',
  '殒命大厦':'vertigo vtg yunming ymds 大厦 高楼',

const SP_UTIL_ALIAS={smoke:'smoke sm 烟 烟雾 烟雾弹 闷烟',flash:'flash fl 闪 闪光 闪光弹',fire:'fire mol molly molotov incendiary 火 火焰 燃烧 燃烧弹 火墙',he:'he nade grenade 雷 手雷 高爆 高爆雷 破片'};
function spHay(d){
  const u=utilCls(d.util);
  return [d.target,d.pos,d.purpose,d.key,d.action,d.util,d.map,(d.tags||[]).join(' '),
    SP_MAP_ALIAS[d.map]||'',SP_UTIL_ALIAS[u]||'',d.side==='CT'?'ct 防守':'t 进攻'].join(' ').toLowerCase();
}
function spSubseq(hay,tok){let i=0;for(const c of hay){if(c===tok[i])i++;if(i===tok.length)return true;}return false;}
/* 反查：别名词 → 该词唯一归属的【基础地图】（多图共用但同属一族时归并到基础图，
   跨族共用才置 null）。修复A：纯地图别名 token(nuke/dust2/inf…)按地图过滤语义处理，
   绝不跨图子序列误命中——空数据图族(如核子族 0 道具)直接 0 结果。 */
const SP_MAP_TOKEN=(()=>{const m={};for(const map in SP_MAP_ALIAS){const base=baseMapOf(map);for(const raw of SP_MAP_ALIAS[map].split(/\s+/)){const w=raw.toLowerCase();if(!w)continue;m[w]=w in m&&m[w]!==base?null:base;}}return m;})();
function spMapOfTok(t){return SP_MAP_TOKEN.hasOwnProperty(t)?SP_MAP_TOKEN[t]:null;}
function spScore(d,toks){
  const hay=spHay(d),name=(d.target||'').toLowerCase();let s=0;
  for(const t of toks){
    if(name.indexOf(t)===0)s+=40;          // 命中道具名开头：最强
    else if(name.indexOf(t)>=0)s+=24;      // 命中道具名
    else if(hay.indexOf(t)>=0)s+=10;       // 命中任意字段（含别名）
    else if(spSubseq(hay,t))s+=3;          // 子序列回退：缩写 / 漏字
    else return -1;                        // 有 token 完全不中 → 淘汰（AND 语义）
  }
  if(d.needUpdate)s-=6;                     // 标记“需更新”的排后面
  return s;
}
let spList=[],spCur=0;

  // 多个地图 token 取交集；该图族无道具时直接 0 结果，绝不跨图乱配（如 nuke→核子族0道具→「没找到」）。

/* ══════════════════════════════════════════════════════════════════════════
   界面精修层 —— 智能感应 + 原生控件重绘
   全部走「后置增强」：不改任何既有渲染函数，由 MutationObserver 发现新节点后
   自动加工。这样以后新增的面板/表单也自动继承，不用再回来补调用。
   ══════════════════════════════════════════════════════════════════════════ */

/* 只在真鼠标 + 用户没要求减少动效时才启用倾角。触屏做倾角只会变成误触抖动 */
const FINE_POINTER = matchMedia('(hover:hover) and (pointer:fine)').matches
                  && !matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ── 智能感应：跟随鼠标的光晕 + 3D 微倾角 ──────────────────────────────
   写 CSS 变量交给合成器，不触发布局；rAF 合帧，pointermove 再密也只算一次。 */
function magnet(el,maxTilt){
  if(!FINE_POINTER||el.dataset.mag)return; el.dataset.mag='1';
  const tilt=maxTilt||6; let raf=0,box=null;
  el.addEventListener('pointerenter',()=>{box=el.getBoundingClientRect();el.classList.add('hot')});
  el.addEventListener('pointermove',e=>{
    if(!box)box=el.getBoundingClientRect();
    if(raf)return;
    raf=requestAnimationFrame(()=>{
      raf=0;
      const x=(e.clientX-box.left)/box.width, y=(e.clientY-box.top)/box.height;
      el.style.setProperty('--mx',(x*100).toFixed(1)+'%');
      el.style.setProperty('--my',(y*100).toFixed(1)+'%');
      // 鼠标偏右→绕 Y 正转，偏下→绕 X 负转，像被一根手指按住那一角
      el.style.setProperty('--ry',((x-.5)*2*tilt).toFixed(2)+'deg');
      el.style.setProperty('--rx',((.5-y)*2*tilt).toFixed(2)+'deg');
    });
  });
  el.addEventListener('pointerleave',()=>{
    box=null; el.classList.remove('hot');
    // 回正走 .map-card 的 380ms 缓动（比进入的 120ms 慢），有回位的重量感
    el.style.setProperty('--rx','0deg'); el.style.setProperty('--ry','0deg');
  });
}

/* ── 下拉重绘：原生 select 留在 DOM 里 ────────────────────────────────
   .value / .selectedIndex / change 事件全部不变，所有既有 inline onchange
   （refreshPurposeOptions / useSpawnAsStand …）照常触发，JS 侧零改动。 */
const SEL_CARET='<svg class="sel-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>';
function selSignature(sel){
  return sel.options.length+'|'+[].map.call(sel.options,o=>o.text).join('');
}
function enhanceSelect(sel){
  if(sel.closest('.sel-wrap')){ resyncSelect(sel); return; }
  const wrap=document.createElement('div');
  wrap.className='sel-wrap';
  sel.parentNode.insertBefore(wrap,sel);
  wrap.appendChild(sel);
  sel.tabIndex=-1; sel.setAttribute('aria-hidden','true');

  const btn=document.createElement('button');
  btn.type='button'; btn.className='sel-btn';
  btn.setAttribute('aria-haspopup','listbox');
  const list=document.createElement('div');
  list.className='sel-list'; list.setAttribute('role','listbox');
  wrap.append(btn,list);

  const close=()=>{wrap.classList.remove('open');document.removeEventListener('pointerdown',away,true)};
  const away=e=>{if(!wrap.contains(e.target))close()};
  const open=()=>{
    document.querySelectorAll('.sel-wrap.open').forEach(o=>{if(o!==wrap)o.classList.remove('open')});
    // 下方空间不够就向上开，浮层永远落在视口内不被裁
    wrap.classList.toggle('up',btn.getBoundingClientRect().bottom+270>innerHeight);
    wrap.classList.add('open');
    const on=list.querySelector('.sel-opt.on'); if(on)on.scrollIntoView({block:'nearest'});
    document.addEventListener('pointerdown',away,true);
  };
  btn.addEventListener('click',()=>wrap.classList.contains('open')?close():open());
  list.addEventListener('click',e=>{
    const o=e.target.closest('.sel-opt'); if(!o)return;
    sel.selectedIndex=+o.dataset.i;
    sel.dispatchEvent(new Event('change',{bubbles:true}));
    resyncSelect(sel); close();
  });
  btn.addEventListener('keydown',e=>{
    const n=sel.options.length; if(!n)return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      sel.selectedIndex=(sel.selectedIndex+(e.key==='ArrowDown'?1:n-1)+n)%n;
      sel.dispatchEvent(new Event('change',{bubbles:true})); resyncSelect(sel);
    }else if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}
    else if(e.key==='Escape')close();
  });
  sel.addEventListener('change',()=>resyncSelect(sel));
  resyncSelect(sel);
}
function resyncSelect(sel){
  const wrap=sel.closest('.sel-wrap'); if(!wrap)return;
  const btn=wrap.querySelector('.sel-btn'), list=wrap.querySelector('.sel-list');
  if(!btn||!list)return;
  const cur=sel.options[sel.selectedIndex];
  btn.innerHTML='<span class="sel-val">'+esc(cur?cur.text:'')+'</span>'+SEL_CARET;
  const sig=selSignature(sel);
  if(list.dataset.sig===sig&&list.dataset.idx===String(sel.selectedIndex))return;
  list.dataset.sig=sig; list.dataset.idx=String(sel.selectedIndex);
  let html='',lastGroup=null;
  [].forEach.call(sel.options,(o,i)=>{
    const g=o.parentNode&&o.parentNode.tagName==='OPTGROUP'?o.parentNode.label:null;
    if(g&&g!==lastGroup){html+='<div class="sel-group">'+esc(g)+'</div>';lastGroup=g}
    if(!g)lastGroup=null;
    html+='<div class="sel-opt'+(i===sel.selectedIndex?' on':'')+'" role="option" data-i="'+i+'">'
        + '<span>'+esc(o.text)+'</span><span class="tick">✓</span></div>';
  });
  list.innerHTML=html;
}

/* ── 滑杆已填色：Chrome 需要喂 --fill，Firefox 走 ::-moz-range-progress ── */
function paintRange(r){
  const min=+r.min||0, max=(+r.max||100), span=(max-min)||1;
  r.style.setProperty('--fill',((r.value-min)/span*100).toFixed(2)+'%');
}
document.addEventListener('input',e=>{
  if(e.target&&e.target.type==='range')paintRange(e.target);
},true);

/* ── 后置增强调度：谁新出现就加工谁 ─────────────────────────────────── */
function polish(root){
  const R=root&&root.querySelectorAll?root:document;
  R.querySelectorAll('.map-card').forEach(el=>magnet(el,6));
  R.querySelectorAll('.idle-item').forEach(el=>magnet(el,0)); // 0 = 只要光晕，不要倾角
  R.querySelectorAll('select.ef-select').forEach(enhanceSelect);
  R.querySelectorAll('input[type=range]').forEach(paintRange);
}
let _polishTimer=0;
const _polishObserver=new MutationObserver(()=>{
  // 用 setTimeout 而不是 rAF：这是 DOM 批处理不是动画。
  // 标签页不可见时 rAF 不触发，会让后台渲染出来的表单一直停在未加工状态。
  if(_polishTimer)return;
  _polishTimer=setTimeout(()=>{_polishTimer=0;polish(document)},0);
});

try{
  loadAll();
  _initializing=false; // loadAll 的初始化写盘已完成；之后任何保存都是真实用户操作，必须计入云同步
  renderLanding();
  setEditSub('util');
}catch(_ie){
  console.error('[cs2] init error',_ie);
  _initializing=false;
  // 数据损坏时降级：清空本地存储，用空白状态启动
  try{data=[];spots=[];places={};spawns={};walls={};renderLanding();setEditSub('util');}catch(e){}
}finally{
  // 无论如何都关闭加载屏，避免「系统初始化」卡死
  const l=$('loader');if(l){const f=$('ldFill');if(f)f.style.width='100%';l.classList.add('done');}
}

/* 启动界面精修层：先加工一遍现有节点，再挂观察器接管后续所有重渲染 */
try{
  const _lc=document.querySelector('.lcard'); if(_lc)magnet(_lc,2.5); // 简报卡也有引力，但克制得多
  polish(document);
  ['mapGrid','detailSheet','editSheet','spContent','spResults','ctxMenu'].forEach(id=>{
    const el=$(id); if(el)_polishObserver.observe(el,{childList:true,subtree:true});
  });
}catch(e){console.warn('[cs2] polish init',e);}
// 云同步（没配路由会自动降级纯本地，不影响使用）
try{initSync();}catch(e){_initializing=false;}

// PWA：注册 Service Worker（离线壳 + 缓存 three/雷达/字体；缺 sw.js 会静默失败，不影响使用）
if('serviceWorker'in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
// 首屏渲染完成后空闲预取 three.js：不阻塞着陆/搜索，但点进沙盘时通常已就绪 → 进图瞬时
(window.requestIdleCallback||(f=>setTimeout(f,1200)))(()=>{try{ensureThree().catch(()=>{});}catch(e){}});

</script>
</body>
</html>
